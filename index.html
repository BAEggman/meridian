<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>經絡 학습 통합 — 경혈·기능·발전사·시동소생 퀴즈 + 자타 암송</title>
<style>
  :root{ --hub-ink:#0f0d0a; --hub-bar:#171310; --hub-line:#3a3225; --hub-gold:#cbb87e; --hub-dim:#b2a994; }
  html,body{margin:0;padding:0;background:var(--hub-ink)}
  #tabbar{position:sticky;top:0;z-index:1000;display:flex;align-items:center;gap:6px;overflow-x:auto;
    background:linear-gradient(180deg,#1b1611,#141009);border-bottom:1px solid var(--hub-line);
    padding:10px 14px;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  #tabbar .brand{font-family:'Nanum Myeongjo','Noto Serif KR',serif;font-weight:600;color:var(--hub-gold);
    font-size:16px;letter-spacing:.04em;margin-right:10px;white-space:nowrap}
  #tabbar .brand small{display:block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.22em;color:#6f6757;font-weight:400}
  .tab{appearance:none;border:1px solid var(--hub-line);background:#1d1812;color:var(--hub-dim);
    border-radius:999px;padding:8px 16px;font-size:15px;cursor:pointer;transition:.15s;font-family:inherit;white-space:nowrap}
  .tab:hover{color:var(--hub-gold);border-color:var(--hub-gold)}
  .tab.on{color:#17130c;background:var(--hub-gold);border-color:var(--hub-gold);font-weight:600}
  #tabbar .grow{flex:1}
  #hub-hint{font-family:ui-monospace,monospace;font-size:12px;color:#6f6757;white-space:nowrap}
  #loader{position:fixed;inset:0;display:grid;place-items:center;background:rgba(15,13,10,.82);z-index:2000;
    color:var(--hub-gold);font-family:'Malgun Gothic',sans-serif;font-size:16px;letter-spacing:.02em}
  #loader.hidden{display:none}
  #loader .sp{width:34px;height:34px;border:3px solid #2a2419;border-top-color:var(--hub-gold);border-radius:50%;
    animation:hubspin 0.8s linear infinite;margin:0 auto 14px}
  @keyframes hubspin{to{transform:rotate(360deg)}}
  #mount{min-height:60vh}
  /* keep the hub's top-level layout block even when a mounted game sets body{display:flex} (acu),
     and re-center that game's top-level .wrap inside the mount column */
  body{display:block !important}
  #mount>.wrap{margin-left:auto !important;margin-right:auto !important}
</style>
</head>
<body>
<div id="tabbar">
  <div class="brand">經絡 학습 통합<small>MERIDIAN STUDY HUB</small></div>
  <button class="tab" data-id="home">홈</button>
  <button class="tab" data-id="acu">경혈 퀴즈</button>
  <button class="tab" data-id="osstep">오수혈 상생휠</button>
  <button class="tab" data-id="osspeed">오수혈 스피드</button>
  <button class="tab" data-id="func">기능 퀴즈</button>
  <button class="tab" data-id="history">발전사</button>
  <button class="tab" data-id="sidong">시동·소생</button>
  <button class="tab" data-id="jata">자타 암송</button>
  <button class="tab" data-id="jingorder">순행 순서맞추기</button>
  <button class="tab" data-id="spine">배수혈맵</button>
  <button class="tab" data-id="baesurule">배수혈 추론</button>
  <button class="tab" data-id="ref">가리기표</button>
  <button class="tab" data-id="cloze">교회혈 니모닉</button>
  <button class="tab" data-id="era">연표 배치</button>
  <button class="tab" data-id="match">발전사 매칭</button>
  <button class="tab" data-id="systree">계통 트리</button>
  <button class="tab" data-id="swipe">변별 스와이프</button>
  <button class="tab" data-id="saamwheel">사암 수레바퀴</button>
  <button class="tab" data-id="saammirror">사암 거울</button>
  <button class="tab" data-id="saamcloze">사암 니모닉</button>
  <button class="tab" data-id="saammaster">사암 종합</button>
  <button class="tab" data-id="saamquiz">사암 보사 퀴즈</button>
  <button class="tab" data-id="saambosafill">사암 補瀉</button>
  <span class="grow"></span>
  <span id="hub-hint"></span>
</div>
<div id="loader" class="hidden"><div><div class="sp"></div><div class="msg">불러오는 중…</div></div></div>
<div id="mount"></div>
<template id="tpl-acu"><style>
  :root{
    --bg:#141319; --panel:#1E1C26; --panel2:#26242F; --line:#34313F;
    --ink:#ECE6D9; --mut:#948FA0; --gold:#D8A72B;
    --mu:#46A35A; --hwa:#D8473B; --to:#D6A52C; --geum:#C7CCD4; --su:#5274BC;
    --ok:#46A35A; --no:#D8473B;
    --serif:'Noto Serif KR','Nanum Myeongjo','Apple SD Gothic Neo','Malgun Gothic',serif;
    --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
  .wrap{width:100%;max-width:680px;padding:20px 16px 48px}
  .hidden{display:none !important}
  .brand{display:flex;align-items:baseline;gap:9px;justify-content:center;margin:4px 0 2px;flex-wrap:wrap}
  .brand .ko{font-family:var(--serif);font-weight:700;font-size:26px}
  .brand .han{font-family:var(--serif);font-weight:700;font-size:14px;color:var(--gold)}
  .tag{text-align:center;color:var(--mut);font-size:13px;margin-bottom:16px}
  .sec-label{font-size:12px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;margin:20px 2px 9px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .sec-label .mini{letter-spacing:0;text-transform:none;color:var(--gold);cursor:pointer;font-weight:700}
  .due{background:linear-gradient(180deg,#221f2b,#1b1923);border:1px solid var(--line);border-radius:16px;padding:18px}
  .due .row{display:flex;gap:10px;text-align:center}
  .due .cell{flex:1}
  .due .cell .v{font-family:var(--serif);font-weight:700;font-size:33px;line-height:1}
  .due .cell .v.hot{color:var(--gold)}
  .due .cell .l{font-size:12px;color:var(--mut);margin-top:4px;letter-spacing:.5px}
  .due .btns{display:flex;gap:10px;margin-top:16px}
  .btn{appearance:none;border:none;cursor:pointer;font-family:var(--sans);font-weight:700;border-radius:12px;transition:transform .1s,filter .15s}
  .btn:active{transform:translateY(1px)}
  .btn-go{background:var(--gold);color:#231c08;font-size:18px;padding:14px;flex:2}
  .btn-go:hover{filter:brightness(1.06)}
  .btn-rev{background:var(--panel2);color:var(--ink);border:1px solid var(--line);font-size:15px;padding:14px;flex:1}
  .btn-rev.off{opacity:.5;cursor:default}
  .cats{display:flex;flex-wrap:wrap;gap:7px}
  .cc{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--mut);transition:all .13s;user-select:none}
  .cc:hover{border-color:var(--gold)}
  .cc.on{background:var(--panel2);border-color:var(--gold);color:var(--ink)}
  .cc .n{color:var(--gold);font-size:11px;margin-left:5px;font-weight:700}
  .cc.on .n{opacity:.85}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;color:var(--ink);transition:all .13s}
  .chip:hover{border-color:var(--gold)}
  .chip.on{background:var(--gold);border-color:var(--gold);color:#231c08;font-weight:700}
  .legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .lg{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mut);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 8px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  .backup{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .btn-sm{background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-size:14px;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}
  .btn-sm:hover{border-color:var(--gold)}
  #impArea{width:100%;margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:monospace;font-size:12px;padding:8px;min-height:54px;resize:vertical}
  .note{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.6}
  .hud{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
  .hud .sb{display:flex;flex-direction:column}
  .hud .sb .l{font-size:11px;letter-spacing:1.4px;color:var(--mut);font-weight:700}
  .hud .sb .v{font-family:var(--serif);font-weight:700;font-size:24px;line-height:1}
  .hud .grow{flex:1}
  .streak{font-size:14px;color:var(--gold);font-weight:700;min-height:16px;text-align:center}
  .lives{font-size:19px;letter-spacing:2px}
  .lives .x{opacity:.22}
  .exit{background:transparent;color:var(--mut);font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
  .pbar{height:5px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:16px}
  .pbar>i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
  .qcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 20px;text-align:center;margin-bottom:15px}
  .qkind{font-size:13px;letter-spacing:2px;color:var(--mut);font-weight:700;text-transform:uppercase;margin-bottom:12px}
  .qkind .rv{color:var(--gold)}
  .qmain{font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.3}
  .qsub{font-family:var(--serif);color:var(--mut);font-size:15px;margin-top:5px}
  .poschip{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:6px 15px;border-radius:999px;font-family:var(--serif);font-weight:700;font-size:18px;border:1.5px solid;background:rgba(255,255,255,.03)}
  .poschip .wx{font-size:13px;opacity:.9}
  .qbig{font-family:var(--serif);font-weight:700;font-size:44px;line-height:1.1;margin:2px 0}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opts.three{grid-template-columns:1fr 1fr 1fr}
  .opt{position:relative;background:var(--panel);border:1.5px solid var(--line);border-radius:13px;padding:16px 12px;cursor:pointer;text-align:center;font-family:var(--serif);font-weight:700;font-size:21px;color:var(--ink);transition:all .1s;word-break:keep-all}
  .opt:hover:not(.dis){border-color:var(--gold)}
  .opt:active:not(.dis){transform:translateY(1px)}
  .opt .num{position:absolute;top:6px;left:9px;font-family:var(--sans);font-size:12px;color:var(--mut);font-weight:700}
  .opt.dis{cursor:default}
  .opt.correct{border-color:var(--ok);background:rgba(70,163,90,.14);color:#bfe9c9}
.opt.elim{opacity:.38;color:var(--mut)}
.hintrow{display:flex;justify-content:flex-end;margin-top:10px}
.hintbtn{appearance:none;border:1px dashed var(--mut);background:transparent;color:var(--mut);border-radius:9px;padding:7px 13px;cursor:pointer;font-family:var(--sans);font-size:14px;transition:.15s}
.hintbtn:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.hintbtn:disabled{opacity:.6;cursor:default;border-style:solid}
.hintbtn em{font-style:normal;color:var(--hwa);font-size:12px}
  .opt.wrong{border-color:var(--no);background:rgba(216,71,59,.14);color:#f2b8b2}
  .opt.glow{animation:pulse .5s ease}
  @keyframes pulse{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 12px rgba(70,163,90,0)}}
  .shake{animation:shake .32s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  .fb{margin-top:14px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px 15px;display:flex;align-items:center;gap:12px;min-height:54px}
  .fb .mark{font-size:25px;font-weight:700}
  .fb.okc .mark{color:var(--ok)} .fb.noc .mark{color:var(--no)}
  .fb .txt{flex:1;font-size:15px;line-height:1.5}
  .fb .txt b{font-family:var(--serif);font-size:17px}
  .fb .wxbadge{font-family:var(--serif);font-weight:700;font-size:13px;padding:3px 9px;border-radius:7px;border:1px solid;white-space:nowrap}
  .fb .next{font-size:13px;color:var(--mut);white-space:nowrap;align-self:flex-end}
  .srsnote{font-size:12px;color:var(--gold);margin-top:6px;text-align:center;min-height:14px}
  .res{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 22px;text-align:center}
  .res h2{font-family:var(--serif);font-weight:700;font-size:24px;margin:0 0 2px}
  .res .big{font-family:var(--serif);font-weight:700;font-size:57px;color:var(--gold);line-height:1.05;margin:8px 0}
  .res .stats{display:flex;justify-content:center;gap:22px;margin:12px 0 4px;color:var(--mut);font-size:14px}
  .res .stats b{display:block;color:var(--ink);font-family:var(--serif);font-size:21px;font-weight:700}
  .sched{display:flex;gap:9px;margin:18px 0 4px}
  .sched .s{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 6px}
  .sched .s .v{font-family:var(--serif);font-weight:700;font-size:24px;color:var(--gold)}
  .sched .s .l{font-size:12px;color:var(--mut);margin-top:3px}
  .review{text-align:left;margin-top:18px}
  .review .rl{font-size:12px;letter-spacing:1.4px;color:var(--mut);font-weight:700;margin-bottom:8px}
  .rrow{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
  .rrow .q{color:var(--mut);flex:1}
  .rrow .a{font-family:var(--serif);font-weight:700;color:#bfe9c9;text-align:right}
  .res-btns{display:flex;gap:10px;margin-top:22px}
  .btn-again{background:var(--gold);color:#231c08;font-size:16px;padding:13px;flex:1}
  .btn-menu{background:var(--panel2);color:var(--ink);font-size:16px;padding:13px;flex:1;border:1px solid var(--line)}
  .foot{text-align:center;color:var(--mut);font-size:12px;margin-top:20px;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);color:var(--ink);padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
  .tchart{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px 6px;overflow:hidden}
  .tchart svg{display:block;width:100%}
  .tchart .blab{fill:var(--mut);font-size:9px;font-family:var(--sans)}
  .tchart .vlab{fill:var(--ink);font-size:9px;font-family:var(--sans);opacity:.85}
  .tchart .avgline{stroke:var(--mut);stroke-dasharray:3 3;stroke-width:1;opacity:.55}
  .chart-empty{color:var(--mut);font-size:13px;text-align:center;padding:18px 6px}
  @media (max-width:420px){ .qmain{font-size:23px} .qbig{font-size:37px} .opt{font-size:19px} .due .cell .v{font-size:29px} }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }
</style>
<div class="wrap">
  <div class="brand"><span class="ko">경혈 마스터</span><span class="han">五輸·特定穴·經脈순행·간격반복</span></div>
  <div class="tag">매일 복습 · 처음 맞히면 7일, 오답은 3일 뒤 · 맞힐수록 간격이 늘어남(졸업 없음)</div>

  <section id="home">
    <div class="due">
      <div class="row">
        <div class="cell"><div class="v hot" id="dueN">0</div><div class="l">오늘 복습</div></div>
        <div class="cell"><div class="v" id="streakN">0</div><div class="l">연속 학습(일)</div></div>
        <div class="cell"><div class="v" id="trackN">0</div><div class="l">추적 중 카드</div></div>
        <div class="cell"><div class="v" id="masterN">0</div><div class="l">유지(30일+)</div></div>
      </div>
      <div class="btns">
        <button class="btn btn-go" id="studyBtn">오늘 학습 시작</button>
        <button class="btn btn-rev" id="revBtn">복습만</button>
      </div>
    </div>
    <div class="sec-label">범위 <span class="mini" id="catToggleAll">전체 켜기/끄기</span></div>
    <div class="cats" id="catGrid"></div>
    <div class="sec-label">경맥 / 모드</div>
    <div class="chips" id="yyChips">
      <button class="chip on" data-yy="전체">전체 12경</button>
      <button class="chip" data-yy="음">음경 6</button>
      <button class="chip" data-yy="양">양경 6</button>
    </div>
    <div class="chips" id="lifeChips" style="margin-top:8px">
      <button class="chip on" data-life="0">연습 · 무한</button>
      <button class="chip" data-life="3">도전 · 생명 3</button>
    </div>
    <div class="sec-label">일별 평균 풀이시간 <span class="mini" id="timeAvg" style="cursor:default"></span></div>
    <div class="tchart" id="timeChart"></div>
    <div class="legend">
      <span class="lg"><i class="dot" style="background:var(--mu)"></i>木青</span>
      <span class="lg"><i class="dot" style="background:var(--hwa)"></i>火赤</span>
      <span class="lg"><i class="dot" style="background:var(--to)"></i>土黄</span>
      <span class="lg"><i class="dot" style="background:var(--geum)"></i>金白</span>
      <span class="lg"><i class="dot" style="background:var(--su)"></i>水黑</span>
    </div>
    <div class="sec-label">데이터 백업 <span class="mini" id="bkToggle">열기</span></div>
    <div id="bkPanel" class="hidden">
      <div class="backup">
        <button class="btn-sm" id="expBtn">진도 내보내기(.json)</button>
        <button class="btn-sm" id="impBtn">아래 내용으로 가져오기</button>
        <button class="btn-sm" id="resetBtn" style="border-color:#5a2c2c;color:#e8a">진도 초기화</button>
      </div>
      <textarea id="impArea" placeholder="백업 JSON을 여기에 붙여넣고 ‘가져오기’를 누르세요"></textarea>
      <div class="note">매일 쓰려면 이 파일을 다운로드해 두고 열어서 푸세요(브라우저에 진도가 저장됩니다). 기기 변경·캐시 삭제 전 ‘내보내기’로 백업하세요.</div>
    </div>
    <div class="foot" id="storeNote"></div>
  </section>

  <section id="play" class="hidden">
    <div class="hud">
      <div class="sb"><span class="l">SCORE</span><span class="v" id="score">0</span></div>
      <div class="grow"><div class="streak" id="streak"></div></div>
      <div class="lives" id="lives"></div>
      <button class="exit" id="exitBtn">그만</button>
    </div>
    <div class="pbar"><i id="pbar"></i></div>
    <div class="qcard" id="qcard"><div class="qkind" id="qkind"></div><div id="qbody"></div></div>
    <div class="opts" id="opts"></div>
    <div class="hintrow" id="hintrow"><button class="hintbtn" id="hintbtn" title="정답 후보를 줄여주지만, 이 문제는 오답(복습 대상)으로 기록됩니다">힌트 · 선택지 줄이기 <em>(오답 처리)</em></button></div>
    <div class="srsnote" id="srsnote"></div>
    <div class="fb hidden" id="fb"></div>
  </section>

  <section id="result" class="hidden">
    <div class="res">
      <h2 id="resTitle">학습 종료</h2>
      <div class="big" id="resScore">0</div>
      <div class="stats">
        <div>푼 문제<b id="resTotal">0</b></div>
        <div>정답률<b id="resAcc">0%</b></div>
        <div>최고 연속<b id="resStreak">0</b></div>
      </div>
      <div class="review hidden" id="schedWrap">

const rint=n=>Math.floor(Math.random()*n);
const pick=a=>a[rint(a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rint(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function sampleDistinct(pool,n,exclude){const ex=new Set(exclude);const out=[];for(const x of shuffle(pool)){if(out.length>=n)break;if(ex.has(x))continue;ex.add(x);out.push(x);}return out;}

/* ============ DATES & SRS ============ */
const INT={1:3,2:7,3:14,4:30,5:60,6:120}; const ST_MAX=6; /* 오답→3일, 처음 맞힘→7일, 이후 성공마다 확장 · 졸업 없음 */
function isoOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return isoOf(new Date());}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return isoOf(d);}
let db={v:3,cards:{},stats:{lastDay:null,streak:0,days:0},log:{}};
function schedMiss(id){let c=db.cards[id];if(!c){c={st:0,due:null,lapses:0};db.cards[id]=c;}c.st=1;c.due=addDays(today(),3);c.lapses=(c.lapses||0)+1;}
function schedReview(id,ok){let c=db.cards[id];const t=today();if(!c){if(ok){db.cards[id]={st:2,due:addDays(t,INT[2]),lapses:0,first:t};}else schedMiss(id);return;}if(ok){if(c.due&&c.due<=t){c.st=Math.min((c.st||1)+1,ST_MAX);c.due=addDays(t,INT[c.st]);}else if(!c.due){c.st=Math.max(c.st||1,4);c.due=addDays(t,INT[c.st]);}/* 기한 전 조기 정답은 간격 유지 */}else{c.st=1;c.due=addDays(t,3);c.lapses=(c.lapses||0)+1;}}
function dueIds(enabled){const t=today();return Object.keys(db.cards).filter(id=>{const c=db.cards[id];return c.due&&c.due<=t&&enabled.has(id.split('|')[0]);});}
function countMastered(){return Object.values(db.cards).filter(c=>c.st>=4).length;}
function countTracked(){return Object.values(db.cards).filter(c=>c.due).length;}
function touchDay(){const t=today();if(db.stats.lastDay!==t){if(db.stats.lastDay===addDays(t,-1))db.stats.streak=(db.stats.streak||0)+1;else db.stats.streak=1;db.stats.days=(db.stats.days||0)+1;db.stats.lastDay=t;}if(!db.log[t])db.log[t]={a:0,c:0,ms:0};}

/* ============ PERSISTENCE ============ */
const KEY='acu_srs_v3';let _mem=null,storeMode='memory';
function lsAvail(){try{const k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);return true;}catch(e){return false;}}
async function loadDB(){
  if(lsAvail()){storeMode='localStorage';const v=localStorage.getItem(KEY);if(v){try{db=JSON.parse(v);}catch(e){}}return;}
  try{if(window.storage){storeMode='cloud';const r=await window.storage.get(KEY);if(r&&r.value){try{db=JSON.parse(r.value);}catch(e){}}return;}}catch(e){}
  storeMode='memory';if(_mem){try{db=JSON.parse(_mem);}catch(e){}}
}
function saveDB(){const s=JSON.stringify(db);_mem=s;try{if(lsAvail())localStorage.setItem(KEY,s);}catch(e){}try{if(window.storage)window.storage.set(KEY,s);}catch(e){}}
function normalizeDB(){if(!db||typeof db!=='object')db={};if(!db.cards)db.cards={};if(!db.stats)db.stats={lastDay:null,streak:0,days:0};if(!db.log)db.log={};db.v=3;Object.keys(db.cards).forEach(k=>{const c=db.cards[k];if(c&&!c.due){let h=0;for(let i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))>>>0;c.st=Math.max(c.st||1,4);c.due=addDays(today(),7+(h%24));}});/* 구버전 졸업 카드 → 유지 단계 */
  const valid=new Set(CATS_DEF.map(c=>c.id));Object.keys(db.cards).forEach(id=>{if(!valid.has(id.split('|')[0]))delete db.cards[id];});}

function qOsu(mi,pi,reverse){
  const m=MERID[mi];const name=m.osu[pi];const w=(m.yy==='음'?WX_YIN:WX_YANG)[pi];const id=`osu|${mi}|${pi}`;
  if(reverse){function _lab(a,b){const ww=(MERID[a].yy==='음'?WX_YIN:WX_YANG)[b];return `${MERID[a].han} ${POS[b]}${ww}穴`;}const ans=_lab(mi,pi);const cand=[];for(let mj=0;mj<MERID.length;mj++)if(mj!==mi)cand.push([mj,pi]);for(let pj=0;pj<5;pj++)if(pj!==pi)cand.push([mi,pj]);const seen=new Set([ans]),ds=[];shuffle(cand).forEach(([a,b])=>{const L=_lab(a,b);if(!seen.has(L)){seen.add(L);ds.push(L);}});return {id,kind:'五輸穴 · 識別',body:`<div class="qsub">이 혈은 어느 經의 무슨 五輸穴?</div><div class="qbig">${name}</div>`,options:shuffle([ans,...ds.slice(0,3)]),answer:ans,five:false,explain:`<b>${name} = ${m.han} ${POS[pi]}穴</b> · ${WX_NM[w]}`,wx:w,qtext:`${name} 식별`};}
  let pool=m.osu.filter(x=>x!==name).concat(MERID.map(x=>x.osu[pi]),POOL.osu);
  return {id,kind:'五輸穴 · 혈명',body:`<div class="qmain">${m.han}</div><div class="poschip" style="border-color:${wxColor(w)};color:${wxColor(w)}">${POS[pi]}穴 <span class="wx">${WX_NM[w]}</span></div>`,options:shuffle([name,...sampleDistinct(pool,3,[name])]),answer:name,five:false,explain:`<b>${m.han} ${POS[pi]}穴 = ${name}</b>`,wx:w,qtext:`${m.han} ${POS[pi]}穴`};
}

  return {id,kind:'五行 · 규칙',body:`<div class="qmain">${yy==='음'?'陰經':'陽經'}<span style="color:var(--mut)">의</span> ${POS[pi]}穴</div><div class="qsub">五行 속성은?</div>`,options:['木','火','土','金','水'],answer:ans,five:true,explain:`<b>${yy==='음'?'陰':'陽'}經 ${POS[pi]}穴 = ${WX_NM[ans]}</b> · ${yy==='음'?'음경 木火土金水':'양경 金水木火土'}`,wx:ans,qtext:`${yy==='음'?'陰':'陽'}經 ${POS[pi]}穴 五行`};
}

const KEY='gyeongnak_func_srs_v1';
const INT={1:3,2:7,3:14,4:30,5:60,6:120}; const ST_MAX=6; /* 오답→3일, 처음 맞힘→7일, 이후 성공마다 확장 · 졸업 없음 */
const G={ db:null, queue:[], cur:null, answered:false, mode:'today',

  sCorrect:0, sWrong:0, sStreak:0, sBest:0, sSeen:0, sTotal:0, sinceMiss:99 };
const $=id=>document.getElementById(id);

function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function probeStorage(){ try{localStorage.setItem('__p','1');const ok=localStorage.getItem('__p')==='1';localStorage.removeItem('__p');return ok;}catch(e){return false;} }
let storageOK=true;
function loadDB(){
  let db={cards:{},streak:0,lastDay:null,log:{}};
  try{ const raw=localStorage.getItem(KEY); if(raw){ const o=JSON.parse(raw); db=Object.assign(db,o); db.cards=o.cards||{}; db.log=o.log||{}; } }catch(e){}
  // prune cards no longer in bank
  const ids=new Set(BANK.map(b=>b.id));
  for(const k of Object.keys(db.cards)) if(!ids.has(k)) delete db.cards[k];
  // 구버전 '졸업'(due=null) 카드 → 유지 단계로 복귀, 7~30일에 분산
  for(const k of Object.keys(db.cards)){ const c=db.cards[k]; if(c && !c.due){ let h=0; for(let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))>>>0; c.st=Math.max(c.st||1,4); c.due=addDays(today(), 7+(h%24)); } }
  G.db=db;
}
function saveDB(){ try{ localStorage.setItem(KEY, JSON.stringify(G.db)); }catch(e){} }

function dueCount(){
  const t=today(); let n=0;
  for(const b of BANK){ if(!G.active.has(b.cat)) continue; const c=G.db.cards[b.id]; if(c && c.due && c.due<=t) n++; }
  return n;
}
function buildQueue(mode){
  const t=today();
  const due=[], fresh=[];
  for(const b of BANK){
    if(!G.active.has(b.cat)) continue;
    const c=G.db.cards[b.id];
    if(c && c.due && c.due<=t) due.push(b.id);
    else if(!c && mode!=='review') fresh.push(b.id);
  }
  shuffle(due); shuffle(fresh);
  let q;
  if(mode==='review') q=due;
  else if(mode==='practice'){ q=BANK.filter(b=>G.active.has(b.cat)).map(b=>b.id); shuffle(q); }
  else {
    const NEW_CAP=12; // 하루 신규 유입 상한
    q=[...due, ...fresh.slice(0,NEW_CAP)];
    if(!q.length){ // 전부 카드화됐고 오늘 기한도 없음 → 기한이 가장 가까운 10장 앞당겨 복습
      const ahead=BANK.filter(b=>G.active.has(b.cat)&&G.db.cards[b.id]&&G.db.cards[b.id].due)
        .sort((x,y)=>G.db.cards[x.id].due<G.db.cards[y.id].due?-1:1).slice(0,10).map(b=>b.id);

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ============== flow ============== */
function start(mode){if(window.__focusDrill&&window.__focusDrill.tool==='func'&&window.__focusDrill.ids&&window.__focusDrill.ids.length){var _fd=window.__focusDrill.ids.slice();var _hub=!!window.__focusDrill.hub;window.__focusDrill=null;var _ex=new Set(BANK.map(function(x){return x.id;}));G.mode='review';G.hub=_hub;G.queue=_fd.filter(function(id){return _ex.has(id);});shuffle(G.queue);G.sCorrect=G.sWrong=G.sStreak=G.sBest=G.sSeen=0;G.sinceMiss=99;G.sTotal=G.queue.length;if($('result'))$('result').classList.remove('show');if(!G.queue.length){if($('stage'))$('stage').innerHTML='<div class="card"><div class="q" style="font-size:18px">복습할 문항이 없습니다.</div></div>';refreshStats();if(_hub){G.hub=false;setTimeout(function(){try{window.HubSession&&HubSession.next();}catch(e){}},500);}return;}nextQ();refreshStats();return;}
  G.mode=mode;

      : '이 분야에 더 풀 카드가 없습니다. 분야를 추가하거나 연습(무한) 모드를 써보세요.';

function catMeta(k){ return CATS.find(c=>c.key===k); }
function renderQ(b){

  const c=G.db.cards[b.id];

  // build options

  $('opts').querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>choose(btn));
  const hb=$('btn-hint'); if(hb) hb.onclick=useHint;
  $('btn-next').onclick=nextQ;
}
function esc(s){ return String(s).replace(/"/g,'&quot;'); }
function useHint(){
  if(G.answered || G.hinted) return;

function choose(btn){

}
function addDays(ds,n){ const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ============== SRS engine ============== */
const KEY='gyeongnak_history_srs_v1';
const INT={1:3,2:7,3:14,4:30,5:60,6:120}; const ST_MAX=6; /* 오답→3일, 처음 맞힘→7일, 이후 성공마다 확장 · 졸업 없음 */
const G={ db:null, queue:[], cur:null, answered:false, mode:'today',
  active:new Set(CATS.map(c=>c.key)),
  sCorrect:0, sWrong:0, sStreak:0, sBest:0, sSeen:0, sTotal:0, sinceMiss:99 };
const $=id=>document.getElementById(id);

function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function probeStorage(){ try{localStorage.setItem('__p','1');const ok=localStorage.getItem('__p')==='1';localStorage.removeItem('__p');return ok;}catch(e){return false;} }
let storageOK=true;
function loadDB(){
  let db={cards:{},streak:0,lastDay:null,log:{}};
  try{ const raw=localStorage.getItem(KEY); if(raw){ const o=JSON.parse(raw); db=Object.assign(db,o); db.cards=o.cards||{}; db.log=o.log||{}; } }catch(e){}
  // prune cards no longer in bank
  const ids=new Set(BANK.map(b=>b.id));
  for(const k of Object.keys(db.cards)) if(!ids.has(k)) delete db.cards[k];
  // 구버전 '졸업'(due=null) 카드 → 유지 단계로 복귀, 7~30일에 분산
  for(const k of Object.keys(db.cards)){ const c=db.cards[k]; if(c && !c.due){ let h=0; for(let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))>>>0; c.st=Math.max(c.st||1,4); c.due=addDays(today(), 7+(h%24)); } }
  G.db=db;
}
function saveDB(){ try{ localStorage.setItem(KEY, JSON.stringify(G.db)); }catch(e){} }

function dueCount(){
  const t=today(); let n=0;
  for(const b of BANK){ if(!G.active.has(b.cat)) continue; const c=G.db.cards[b.id]; if(c && c.due && c.due<=t) n++; }
  return n;
}
function buildQueue(mode){
  const t=today();
  const due=[], fresh=[];
  for(const b of BANK){
    if(!G.active.has(b.cat)) continue;
    const c=G.db.cards[b.id];
    if(c && c.due && c.due<=t) due.push(b.id);
    else if(!c && mode!=='review') fresh.push(b.id);
  }
  shuffle(due); shuffle(fresh);
  let q;
  if(mode==='review') q=due;
  else if(mode==='practice'){ q=BANK.filter(b=>G.active.has(b.cat)).map(b=>b.id); shuffle(q); }
  else {
    const NEW_CAP=12; // 하루 신규 유입 상한
    q=[...due, ...fresh.slice(0,NEW_CAP)];
    if(!q.length){ // 전부 카드화됐고 오늘 기한도 없음 → 기한이 가장 가까운 10장 앞당겨 복습
      const ahead=BANK.filter(b=>G.active.has(b.cat)&&G.db.cards[b.id]&&G.db.cards[b.id].due)
        .sort((x,y)=>G.db.cards[x.id].due<G.db.cards[y.id].due?-1:1).slice(0,10).map(b=>b.id);
      q=shuffle(ahead);
    }
  }
  return q;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ============== flow ============== */
function start(mode){if(window.__focusDrill&&window.__focusDrill.tool==='history'&&window.__focusDrill.ids&&window.__focusDrill.ids.length){var _fd=window.__focusDrill.ids.slice();var _hub=!!window.__focusDrill.hub;window.__focusDrill=null;var _ex=new Set(BANK.map(function(x){return x.id;}));G.mode='review';G.hub=_hub;G.queue=_fd.filter(function(id){return _ex.has(id);});shuffle(G.queue);G.sCorrect=G.sWrong=G.sStreak=G.sBest=G.sSeen=0;G.sinceMiss=99;G.sTotal=G.queue.length;if($('result'))$('result').classList.remove('show');if(!G.queue.length){if($('stage'))$('stage').innerHTML='<div class="card"><div class="q" style="font-size:18px">복습할 문항이 없습니다.</div></div>';refreshStats();if(_hub){G.hub=false;setTimeout(function(){try{window.HubSession&&HubSession.next();}catch(e){}},500);}return;}nextQ();refreshStats();return;}
  G.mode=mode;
  G.queue=buildQueue(mode);
  G.sCorrect=G.sWrong=G.sStreak=G.sBest=G.sSeen=0; G.sinceMiss=99;
  G.sTotal=G.queue.length;
  $('result').classList.remove('show');
  if(!G.queue.length){
    $('stage').innerHTML='';
    const t=today();
    const msg = mode==='review'
      ? '복습할 카드가 없습니다 — 선택한 분야에서 틀린 문제가 모두 기한이 안 됐거나 졸업했어요.'
      : '이 분야에 더 풀 카드가 없습니다. 분야를 추가하거나 연습(무한) 모드를 써보세요.';
    $('stage').innerHTML=`<div class="card"><div class="q" style="font-size:20px">${msg}</div></div>`;
    refreshStats(); return;
  }
  nextQ();
  refreshStats();
}
function nextQ(){
  if(!G.queue.length){ return finish(); }
  const id=G.queue.shift();
  const b=BANK.find(x=>x.id===id);
  G.cur=b; G.answered=false;
  renderQ(b);
  updateProg();
}
function catMeta(k){ return CATS.find(c=>c.key===k); }
function renderQ(b){
  G.hinted=false;
  const cm=catMeta(b.cat);
  const cc=getComputedStyle(document.documentElement).getPropertyValue(cm.v).trim();
  const c=G.db.cards[b.id];
  const stTag = c ? (((c.st||1)>=4) ? `유지 ${INT[Math.min(c.st||1,ST_MAX)]}일` : `복습 ${c.st||1}단계`) : '신규';
  // build options
  const opts=shuffle([b.a, ...b.d]).slice();
  const letters=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ'];
  let html=`<div class="card" style="--cc:${cc}">
    <div class="tag"><span class="dot"></span>${cm.label} · <span style="color:var(--paper-dim)">${stTag}</span></div>
    <div class="q">${b.q}</div>
    <div class="opts" id="opts">`;
  opts.forEach((o,i)=>{ html+=`<button class="opt" data-v="${esc(o)}"><span class="key">${letters[i]}</span><span>${o}</span><span class="mark"></span></button>`; });
  html+=`</div>
    <div class="hint-row" id="hint-row"><button class="hint-btn" id="btn-hint" title="정답 후보를 줄여주지만, 이 문제는 오답(복습 대상)으로 기록됩니다">힌트 · 선택지 줄이기 <em>(오답 처리)</em></button></div>
    <div class="fb" id="fb">
      <div class="verdict" id="verdict"></div>
      <div class="note" id="note"></div>
      <div class="srs" id="srs"></div>
      <div class="next-row"><button class="btn primary" id="btn-next">다음 →</button></div>
    </div></div>`;
  $('stage').innerHTML=html;
  $('opts').querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>choose(btn));
  const hb=$('btn-hint'); if(hb) hb.onclick=useHint;
  $('btn-next').onclick=nextQ;
}
function esc(s){ return String(s).replace(/"/g,'&quot;'); }
function useHint(){
  if(G.answered || G.hinted) return;
  G.hinted=true;
  const b=G.cur, opts=[...$('opts').querySelectorAll('.opt')];
  const wrong=opts.filter(o=>o.dataset.v!==b.a);
  shuffle(wrong);
  wrong.slice(0, Math.max(0, wrong.length-1)).forEach(o=>{ o.classList.add('eliminated'); o.disabled=true; const mk=o.querySelector('.mark'); if(mk) mk.textContent='✕'; });
  const hb=$('btn-hint'); if(hb){ hb.disabled=true; hb.innerHTML='힌트 사용됨 · 오답 처리'; }
}

function choose(btn){
  if(G.answered) return;
  G.answered=true;
  const b=G.cur, picked=btn.dataset.v, actuallyCorrect = picked===b.a, correct = actuallyCorrect && !G.hinted;
  const opts=$('opts').querySelectorAll('.opt');
  opts.forEach(o=>{
    o.disabled=true;
    const v=o.dataset.v;
    if(v===b.a){ o.classList.add('correct'); o.querySelector('.mark').textContent='✓'; }
    else if(o===btn){ o.classList.add('wrong'); o.querySelector('.mark').textContent='✕'; }
  });
  // SRS update
  const t=today();
  const card=G.db.cards[b.id];
  let srsMsg='';
  if(correct){
    G.sCorrect++; G.sStreak++; G.sBest=Math.max(G.sBest,G.sStreak); G.sinceMiss++;
    if(!card){ // 처음 맞힘 → 카드 생성, 7일 뒤 확인
      G.db.cards[b.id]={st:2,due:addDays(t,INT[2]),lapses:0,first:t};
      srsMsg=`✓ 처음 맞힘 → ${INT[2]}일 뒤 확인.`;
    } else if(card.due && card.due<=t){ // 예정된 복습 성공 → 간격 확장 (졸업 없음)
      card.st=Math.min((card.st||1)+1, ST_MAX);
      card.due=addDays(t, INT[card.st]);
      srsMsg = card.st>=4 ? `✓ 유지 단계 → ${INT[card.st]}일 뒤 다시.` : `✓ 복습 성공 → ${INT[card.st]}일 뒤 다시.`;
    } else { // 기한 전 조기 정답(연습 등) → 간격 유지
      if(!card.due){ card.st=Math.max(card.st||1,4); card.due=addDays(t, INT[card.st]); }
      srsMsg=`✓ 정답 (다음 확인 ${card.due}).`;
    }
  } else {
    G.sWrong++; G.sStreak=0; G.sinceMiss=0;
    const cc=G.db.cards[b.id]||{lapses:0};
    cc.st=1; cc.due=addDays(t,INT[1]); cc.lapses=(cc.lapses||0)+1;
    G.db.cards[b.id]=cc;
    srsMsg=`✕ 오답 → 3일 뒤 복습 예약.`;
    // re-drill later this session
    if(Math.random()<0.5){ const pos=Math.min(G.queue.length, 3+Math.floor(Math.random()*3)); G.queue.splice(pos,0,b.id); }
  }
  G.sSeen++;
  // log
  G.db.log[t]=G.db.log[t]||{a:0,c:0}; G.db.log[t].a++; if(correct)G.db.log[t].c++; try{window.HubStats&&HubStats.record('history',{id:b.id,q:b.q,cat:b.cat,a:b.a},correct);}catch(e){}
  saveDB();
  // feedback
  const hr=$('hint-row'); if(hr) hr.style.display='none';
  $('verdict').textContent = correct ? '정답입니다'
    : (G.hinted && actuallyCorrect ? '정답이지만 힌트 사용 → 복습 대상으로 기록 (정답: '+b.a+')'
       : ('오답 — 정답: '+b.a)+(G.hinted?' · 힌트 사용':''));
  $('verdict').className = 'verdict '+(correct?'ok':'no');
  $('note').innerHTML = b.note||'';
  $('srs').textContent = srsMsg;
  $('fb').classList.add('show');
  refreshStats();
}
function addDays(ds,n){ const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function finish(){
  // streak day bookkeeping
  const t=today();
  if(G.db.lastDay!==t){ const y=addDays(t,-1); G.db.streak = (G.db.lastDay===y? (G.db.streak||0)+1 : 1); G.db.lastDay=t; saveDB(); }
  $('stage').innerHTML='';
  $('r-title').textContent = G.mode==='practice' ? '연습 한 바퀴 완료' : '학습 세트 완료';
  $('r-score').textContent = G.sCorrect+' / '+G.sSeen;
  $('r-correct').textContent=G.sCorrect; $('r-wrong').textContent=G.sWrong; $('r-streak').textContent=G.sBest;
  // due buckets after this session
  const t2=today(); const b3=addDays(t2,3),b7=addDays(t2,7),b30=addDays(t2,30);
  let n3=0,n7=0,n30=0,nk=0;
  for(const b of BANK){ const c=G.db.cards[b.id]; if(!c||!c.due) continue; if(c.due<=b3)n3++; else if(c.due<=b7)n7++; else if(c.due<=b30)n30++; else nk++; }
  $('r-buckets').innerHTML = `예정 복습 — <b style="color:var(--el)">3일 내 ${n3}</b> · 7일 내 ${n7} · 한 달 내 ${n30} · 유지(30일+) ${nk}`;
  $('result').classList.add('show');
  $('prog').style.width='100%';
  refreshStats();
  if(G.hub){ G.hub=false; const rb=$('r-buckets'); if(rb) rb.innerHTML+=' <span style="color:var(--gold)">· 통합 세션 — 다음 도구로 넘어갑니다…</span>'; setTimeout(function(){ try{ window.HubSession&&HubSession.next(); }catch(e){} },1400); }
}

/* ============== ui glue ============== */
function buildCats(){
  const wrap=$('cats');
  CATS.forEach(c=>{
    const cc=getComputedStyle(document.documentElement).getPropertyValue(c.v).trim();
    const n=BANK.filter(b=>b.cat===c.key).length;
    const el=document.createElement('button');
    el.className='cat on'; el.style.setProperty('--cc',cc); el.dataset.key=c.key;
    el.innerHTML=`<span class="dot"></span>${c.label}<span class="n">${n}</span>`;
    el.onclick=()=>{ if(G.active.has(c.key)){ if(G.active.size>1){G.active.delete(c.key); el.classList.remove('on');} } else { G.active.add(c.key); el.classList.add('on'); } refreshStats(); };
    wrap.appendChild(el);
  });
}
function refreshStats(){ $('s-due').textContent=dueCount(); $('s-streak').textContent=G.db.streak||0; }
function updateProg(){ const done=G.sSeen, total=Math.max(1,G.sTotal); $('prog').style.width=Math.min(100,Math.round(done/total*100))+'%'; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }

function doExport(){
  const blob=new Blob([JSON.stringify(G.db,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='경락기능_진도.json'; a.click(); URL.revokeObjectURL(a.href);
  toast('진도를 내려받았습니다');
}
function doImport(file){ const r=new FileReader(); r.onload=()=>{ try{ const o=JSON.parse(r.result); G.db=Object.assign({cards:{},log:{},streak:0,lastDay:null},o); saveDB(); refreshStats(); toast('진도를 불러왔습니다'); }catch(e){ toast('파일을 읽을 수 없습니다'); } }; r.readAsText(file); }

function showStorage(){
  const el=$('storage');
  if(storageOK){ el.style.color='var(--paper-faint)'; el.innerHTML='● 자동 저장 켜짐 — 복습 일정이 이 브라우저에 저장됩니다.'; }
  else{ el.style.color='#e0a35a'; el.innerHTML='⚠ 이 브라우저는 자동 저장이 막혀 있습니다 — 진도 내보내기/불러오기를 쓰세요.'; }
}

/* ============== init ============== */
function init(){
  storageOK=probeStorage();
  loadDB();
  buildCats();
  showStorage();
  refreshStats();
  $('btn-start').onclick=()=>start('today');
  $('btn-review').onclick=()=>start('review');
  $('btn-practice').onclick=()=>start('practice');
  $('r-again').onclick=()=>start(G.mode==='practice'?'practice':'today');
  $('r-reset-session').onclick=()=>start(G.mode);
  $('btn-export').onclick=doExport;
  $('btn-import').onclick=()=>$('file-import').click();
  $('file-import').onchange=e=>{ if(e.target.files[0]) doImport(e.target.files[0]); e.target.value=''; };
  $('btn-wipe').onclick=()=>{ if(confirm('모든 진도(복습 일정·기록)를 지울까요?')){ G.db={cards:{},log:{},streak:0,lastDay:null}; saveDB(); refreshStats(); toast('초기화했습니다'); $('result').classList.remove('show'); $('stage').innerHTML=''; } };
  document.addEventListener('keydown',e=>{
    if(['1','2','3','4','5'].includes(e.key)){ const opts=$('opts')&&$('opts').querySelectorAll('.opt'); if(opts&&opts[+e.key-1]&&!G.answered) opts[+e.key-1].click(); }
    if((e.key==='Enter'||e.key===' ')&&G.answered){ e.preventDefault(); const n=$('btn-next'); if(n)n.click(); }
  });
  window.addEventListener('pagehide', saveDB);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') saveDB(); });
}
init();

try{if(window.__focusDrill&&window.__focusDrill.tool==='history'){start('review');}}catch(e){}
})();</script>

  {id:'sc6', cat:'concept', q:'是動病과 所生病의 관계로 옳은 것은?', a:'是動은 氣分의 病(先), 所生은 血分·臟腑의 病', d:['둘 다 臟腑에서 발생한다','둘 다 經氣 변동이다','所生이 먼저 나타난다','是動이 血病이다'], note:'난경 계열: 시동=氣病(先病)/소생=血病.'}
];

/* ============== SRS engine ============== */
const KEY='sidong_sosaeng_srs_v1';
const INT={1:3,2:7,3:14,4:30,5:60,6:120}; const ST_MAX=6; /* 오답→3일, 처음 맞힘→7일, 이후 성공마다 확장 · 졸업 없음 */
const G={ db:null, queue:[], cur:null, answered:false, mode:'today',
  active:new Set(CATS.map(c=>c.key)),
  sCorrect:0, sWrong:0, sStreak:0, sBest:0, sSeen:0, sTotal:0, sinceMiss:99 };
const $=id=>document.getElementById(id);

function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function probeStorage(){ try{localStorage.setItem('__p','1');const ok=localStorage.getItem('__p')==='1';localStorage.removeItem('__p');return ok;}catch(e){return false;} }
let storageOK=true;
function loadDB(){
  let db={cards:{},streak:0,lastDay:null,log:{}};
  try{ const raw=localStorage.getItem(KEY); if(raw){ const o=JSON.parse(raw); db=Object.assign(db,o); db.cards=o.cards||{}; db.log=o.log||{}; } }catch(e){}
  // prune cards no longer in bank
  const ids=new Set(BANK.map(b=>b.id));
  for(const k of Object.keys(db.cards)) if(!ids.has(k)) delete db.cards[k];
  // 구버전 '졸업'(due=null) 카드 → 유지 단계로 복귀, 7~30일에 분산
  for(const k of Object.keys(db.cards)){ const c=db.cards[k]; if(c && !c.due){ let h=0; for(let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))>>>0; c.st=Math.max(c.st||1,4); c.due=addDays(today(), 7+(h%24)); } }
  G.db=db;
}
function saveDB(){ try{ localStorage.setItem(KEY, JSON.stringify(G.db)); }catch(e){} }

function dueCount(){
  const t=today(); let n=0;
  for(const b of BANK){ if(!G.active.has(b.cat)) continue; const c=G.db.cards[b.id]; if(c && c.due && c.due<=t) n++; }
  return n;
}
function buildQueue(mode){
  const t=today();
  const due=[], fresh=[];
  for(const b of BANK){
    if(!G.active.has(b.cat)) continue;
    const c=G.db.cards[b.id];
    if(c && c.due && c.due<=t) due.push(b.id);
    else if(!c && mode!=='review') fresh.push(b.id);
  }
  shuffle(due); shuffle(fresh);
  let q;
  if(mode==='review') q=due;
  else if(mode==='practice'){ q=BANK.filter(b=>G.active.has(b.cat)).map(b=>b.id); shuffle(q); }
  else {
    const NEW_CAP=12; // 하루 신규 유입 상한
    q=[...due, ...fresh.slice(0,NEW_CAP)];
    if(!q.length){ // 전부 카드화됐고 오늘 기한도 없음 → 기한이 가장 가까운 10장 앞당겨 복습
      const ahead=BANK.filter(b=>G.active.has(b.cat)&&G.db.cards[b.id]&&G.db.cards[b.id].due)
        .sort((x,y)=>G.db.cards[x.id].due<G.db.cards[y.id].due?-1:1).slice(0,10).map(b=>b.id);
      q=shuffle(ahead);
    }
  }

}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ============== flow ============== */
function start(mode){if(window.__focusDrill&&window.__focusDrill.tool==='sidong'&&window.__focusDrill.ids&&window.__focusDrill.ids.length){var _fd=window.__focusDrill.ids.slice();var _hub=!!window.__focusDrill.hub;window.__focusDrill=null;var _ex=new Set(BANK.map(function(x){return x.id;}));G.mode='review';G.hub=_hub;G.queue=_fd.filter(function(id){return _ex.has(id);});shuffle(G.queue);G.sCorrect=G.sWrong=G.sStreak=G.sBest=G.sSeen=0;G.sinceMiss=99;G.sTotal=G.queue.length;if($('result'))$('result').classList.remove('show');if(!G.queue.length){if($('stage'))$('stage').innerHTML='<div class="card"><div class="q" style="font-size:18px">복습할 문항이 없습니다.</div></div>';refreshStats();if(_hub){G.hub=false;setTimeout(function(){try{window.HubSession&&HubSession.next();}catch(e){}},500);}return;}nextQ();refreshStats();return;}
  G.mode=mode;

    $('stage').innerHTML='';

    const msg = mode==='review'
      ? '복습할 카드가 없습니다 — 선택한 분야에서 틀린 문제가 모두 기한이 안 됐거나 졸업했어요.'
      : '이 분야에 더 풀 카드가 없습니다. 분야를 추가하거나 연습(무한) 모드를 써보세요.';
    $('stage').innerHTML=`<div class="card"><div class="q" style="font-size:20px">${msg}</div></div>`;
    refreshStats(); return;
  }
  nextQ();
  refreshStats();
}
function nextQ(){
  if(!G.queue.length){ return finish(); }

  renderQ(b);
  updateProg();
}
function catMeta(k){ return CATS.find(c=>c.key===k); }
function renderQ(b){
  G.hinted=false;
  const cm=catMeta(b.cat);
  const cc=getComputedStyle(document.documentElement).getPropertyValue(cm.v).trim();
  const c=G.db.cards[b.id];
  const stTag = c ? (((c.st||1)>=4) ? `유지 ${INT[Math.min(c.st||1,ST_MAX)]}일` : `복습 ${c.st||1}단계`) : '신규';
  // build options
  const opts=shuffle([b.a, ...b.d]).slice();

  let html=`<div class="card" style="--cc:${cc}">

  html+=`</div>
    <div class="hint-row" id="hint-row"><button class="hint-btn" id="btn-hint" title="정답 후보를 줄여주지만, 이 문제는 오답(복습 대상)으로 기록됩니다">힌트 · 선택지 줄이기 <em>(오답 처리)</em></button></div>
    <div class="fb" id="fb">
      <div class="verdict" id="verdict"></div>
      <div class="note" id="note"></div>

  $('stage').innerHTML=html;
  $('opts').querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>choose(btn));

function esc(s){ return String(s).replace(/"/g,'&quot;'); }
function useHint(){
  if(G.answered || G.hinted) return;
  G.hinted=true;
  const b=G.cur, opts=[...$('opts').querySelectorAll('.opt')];
  const wrong=opts.filter(o=>o.dataset.v!==b.a);
  shuffle(wrong);
  wrong.slice(0, Math.max(0, wrong.length-1)).forEach(o=>{ o.classList.add('eliminated'); o.disabled=true; const mk=o.querySelector('.mark'); if(mk) mk.textContent='✕'; });
  const hb=$('btn-hint'); if(hb){ hb.disabled=true; hb.innerHTML='힌트 사용됨 · 오답 처리'; }
}

function choose(btn){
  if(G.answered) return;
  G.answered=true;
  const b=G.cur, picked=btn.dataset.v, actuallyCorrect = picked===b.a, correct = actuallyCorrect && !G.hinted;
  const opts=$('opts').querySelectorAll('.opt');
  opts.forEach(o=>{
    o.disabled=true;
    const v=o.dataset.v;
    if(v===b.a){ o.classList.add('correct'); o.querySelector('.mark').textContent='✓'; }
    else if(o===btn){ o.classList.add('wrong'); o.querySelector('.mark').textContent='✕'; }
  });
  // SRS update
  const t=today();
  const card=G.db.cards[b.id];
  let srsMsg='';
  if(correct){
    G.sCorrect++; G.sStreak++; G.sBest=Math.max(G.sBest,G.sStreak); G.sinceMiss++;
    if(!card){ // 처음 맞힘 → 카드 생성, 7일 뒤 확인
      G.db.cards[b.id]={st:2,due:addDays(t,INT[2]),lapses:0,first:t};
      srsMsg=`✓ 처음 맞힘 → ${INT[2]}일 뒤 확인.`;
    } else if(card.due && card.due<=t){ // 예정된 복습 성공 → 간격 확장 (졸업 없음)
      card.st=Math.min((card.st||1)+1, ST_MAX);
      card.due=addDays(t, INT[card.st]);
      srsMsg = card.st>=4 ? `✓ 유지 단계 → ${INT[card.st]}일 뒤 다시.` : `✓ 복습 성공 → ${INT[card.st]}일 뒤 다시.`;
    } else { // 기한 전 조기 정답(연습 등) → 간격 유지
      if(!card.due){ card.st=Math.max(card.st||1,4); card.due=addDays(t, INT[card.st]); }
      srsMsg=`✓ 정답 (다음 확인 ${card.due}).`;
    }
  } else {
    G.sWrong++; G.sStreak=0; G.sinceMiss=0;
    const cc=G.db.cards[b.id]||{lapses:0};
    cc.st=1; cc.due=addDays(t,INT[1]); cc.lapses=(cc.lapses||0)+1;
    G.db.cards[b.id]=cc;

    // re-drill later this session

    : (G.hinted && actuallyCorrect ? '정답이지만 힌트 사용 → 복습 대상으로 기록 (정답: '+b.a+')'
       : ('오답 — 정답: '+b.a)+(G.hinted?' · 힌트 사용':''));
  $('verdict').className = 'verdict '+(correct?'ok':'no');

}
function addDays(ds,n){ const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ============== ui glue ============== */
function buildCats(){
  const wrap=$('cats');

    const cc=getComputedStyle(document.documentElement).getPropertyValue(c.v).trim();
    const n=BANK.filter(b=>b.cat===c.key).length;
    const el=document.createElement('button');

function refreshStats(){ $('s-due').textContent=dueCount(); $('s-streak').textContent=G.db.streak||0; }
function updateProg(){ const done=G.sSeen, total=Math.max(1,G.sTotal); $('prog').style.width=Math.min(100,Math.round(done/total*100))+'%'; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }

function showStorage(){
  const el=$('storage');
  if(storageOK){ el.style.color='var(--paper-faint)'; el.innerHTML='● 자동 저장 켜짐 — 복습 일정이 이 브라우저에 저장됩니다.'; }
  else{ el.style.color='#e0a35a'; el.innerHTML='⚠ 이 브라우저는 자동 저장이 막혀 있습니다 — 진도 내보내기/불러오기를 쓰세요.'; }
}

/* ============== init ============== */
function init(){
  storageOK=probeStorage();
  loadDB();
  buildCats();
  showStorage();
  refreshStats();
  $('btn-start').onclick=()=>start('today');
  $('btn-review').onclick=()=>start('review');
  $('btn-practice').onclick=()=>start('practice');
  $('r-again').onclick=()=>start(G.mode==='practice'?'practice':'today');
  $('r-reset-session').onclick=()=>start(G.mode);
  $('btn-export').onclick=doExport;
  $('btn-import').onclick=()=>$('file-import').click();
  $('file-import').onchange=e=>{ if(e.target.files[0]) doImport(e.target.files[0]); e.target.value=''; };
  $('btn-wipe').onclick=()=>{ if(confirm('모든 진도(복습 일정·기록)를 지울까요?')){ G.db={cards:{},log:{},streak:0,lastDay:null}; saveDB(); refreshStats(); toast('초기화했습니다'); $('result').classList.remove('show'); $('stage').innerHTML=''; } };
  document.addEventListener('keydown',e=>{
    if(['1','2','3','4','5'].includes(e.key)){ const opts=$('opts')&&$('opts').querySelectorAll('.opt'); if(opts&&opts[+e.key-1]&&!G.answered) opts[+e.key-1].click(); }

}
init();

try{if(window.__focusDrill&&window.__focusDrill.tool==='sidong'){start('review');}}catch(e){}
})();</script>

  activeSources.push(s);
  return s;
}
function stopAll(bumpToken){

/* ---------- helpers ---------- */
function fmt(t){
  if(!isFinite(t)) return '0:00.0';
  const m=Math.floor(t/60), s=Math.floor(t%60), d=Math.floor((t*10)%10);
  return m+':'+String(s).padStart(2,'0')+'.'+d;
}
function meridian(key){ return MERIDIANS.find(m=>m.key===key); }
function evenCuts(dur,len){
  const n=Math.max(1,Math.round(dur/len));
  const cuts=[];
  for(let i=1;i<n;i++) cuts.push(+(i*dur/n).toFixed(2));
  return cuts;
}
function segments(){
  const key=state.current;
  let dur=state.durations[key]||0;
  if((!dur||dur<=0) && buffers[key]) dur=buffers[key].duration||0;
  let cuts=state.boundaries[key];
  if(!cuts){ cuts=evenCuts(dur,state.segLen); state.boundaries[key]=cuts; }
  cuts=[...new Set(cuts.map(Number).filter(c=>c>0 && (dur>0 ? c<dur-0.01 : true)))].sort((a,b)=>a-b);
  const end = dur>0 ? dur : (cuts.length ? cuts[cuts.length-1]+0.01 : 0.01);
  const pts=[0,...cuts,end];
  const segs=[];
  for(let i=0;i<pts.length-1;i++) segs.push({a:pts[i],b:pts[i+1]});
  return segs;
}
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1900);
}

/* ---------- single-segment preview ---------- */
function previewSeg(i){
  const key=state.current;
  if(!buffers[key]){ loadBuffer(key).then(()=>previewSeg(i)).catch(()=>toast('오디오를 불러올 수 없습니다')); return; }

  (function track(){ if(my!==playToken) return; playPos=Math.min(s.b, s.a+Math.max(0, actx.currentTime-when)); if(actx.currentTime<when+dur) requestAnimationFrame(track); })();

/* ---------- segment loop (구간 반복: gapless audio-thread loop = background-safe) ---------- */
function loopSeg(i){
  if(loopingIdx===i){ stopAll(true); setBanner('idle'); return; }
  const key=state.current;
  if(!buffers[key]){ loadBuffer(key).then(()=>loopSeg(i)).catch(()=>toast('오디오를 불러올 수 없습니다')); return; }
  ensureCtx();
  stopAll(true);
  const segs=segments(), s=segs[i]; if(!s) return;
  const my=++playToken;
  loopingIdx=i;
  nodes().forEach(x=>x.classList.remove('looping'));
  const n=nodes()[i]; if(n){ n.classList.add('looping'); n.scrollIntoView({block:'nearest',behavior:'smooth'}); }
  updateProgress(i);
  setBanner('loop', i);
  const src=actx.createBufferSource();
  src.buffer=buffers[key];
  src.loop=true; src.loopStart=s.a; src.loopEnd=s.b;
  src.connect(master);
  loopStartCtx=actx.currentTime+0.05;
  try{ src.start(loopStartCtx, s.a); }catch(e){ try{ src.start(); }catch(_){} }
  activeSources.push(src);
  const span=Math.max(0.05, s.b-s.a);
  (function track(){ if(my!==playToken||loopingIdx!==i) return; const el=Math.max(0, actx.currentTime-loopStartCtx); playPos=s.a+(el%span); requestAnimationFrame(track); })();
}

/* ---------- full drill: pre-scheduled on the audio clock (runs in background) ---------- */
let drilling=false;
function runDrill(){
  const key=state.current;
  if(!buffers[key]){ loadBuffer(key).then(runDrill).catch(()=>toast('오디오를 불러올 수 없습니다')); return; }
  ensureCtx();
  stopAll(false);
  const my=++playToken; drilling=true; setDrillBtn(true);
  const segs=segments();
  let t=actx.currentTime+0.12;
  const tl=[];
  for(let i=0;i<segs.length;i++){
    const segDur=Math.max(0.05, segs[i].b-segs[i].a);
    for(let c=0;c<state.callCount;c++){
      playSrc(key, segs[i].a, segDur, t);
      tl.push({type:'call', i, start:t, dur:segDur});
      t+=segDur;
      if(c<state.callCount-1) t+=0.22;
    }
    const echoLen=Math.max(0.7, segDur);
    for(let e=1;e<=state.echoCount;e++){ tl.push({type:'echo', i, e, start:t, dur:echoLen}); t+=echoLen; }
    t+=0.18;
  }
  drillTimeline=tl; drillEnd=t;
  drillBounds=tl.map(e=>e.start).concat([drillEnd]); drillTypes=tl.map(e=>e.type);
  lastVisKey='';
  startVisualSync(my);
  clearTimeout(endBackstop);
  endBackstop=setTimeout(()=>{ if(my===playToken) finishDrill(my); }, Math.max(0,(drillEnd-actx.currentTime))*1000+300);
}
function startVisualSync(my){
  cancelAnimationFrame(visRAF);
  function tick(){
    if(my!==playToken) return;
    const now=actx.currentTime;
    if(now>=drillEnd){ finishDrill(my); return; }
    let cur=null;
    for(const ev of drillTimeline){ if(now>=ev.start && now<ev.start+ev.dur){ cur=ev; break; } }
    if(cur){
      const vk=cur.type+':'+cur.i+':'+(cur.e||0);
      if(vk!==lastVisKey){
        lastVisKey=vk;
        clearActive();
        const n=nodes()[cur.i];
        if(n){ n.classList.add('active'); if(cur.type==='echo') n.classList.add('echoing'); n.scrollIntoView({block:'center',behavior:'smooth'}); }
        updateProgress(cur.i);
        if(cur.type==='call') setBanner('call',cur.i); else setBanner('echo',cur.i,cur.e);
      }
      if(cur.type==='call'){ const sg=segments()[cur.i]; if(sg) playPos=sg.a+(now-cur.start); }
    }
    updateNextClip(now);
    visRAF=requestAnimationFrame(tick);
  }
  visRAF=requestAnimationFrame(tick);
}
function finishDrill(my){
  if(my!==playToken) return;
  drilling=false; setDrillBtn(false);
  cancelAnimationFrame(visRAF); clearTimeout(endBackstop);
  activeSources.forEach(s=>{ try{s.stop();}catch(e){} });
  activeSources=[]; drillTimeline=null;
  clearActive(); updateProgress(segments().length); setBanner('done');
  if(recordStudy(state.current)){ renderStudyTags(); renderWeekly(); renderHeatmap(); toast('전체 연습 완료 — '+meridian(state.current).han+' 오늘 암기 기록'); }
}
function setDrillBtn(on){
  const b=$('btn-drill');
  b.classList.toggle('primary',!on);
  b.innerHTML = on
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg><span>정지</span>'
    : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span>전체 연습</span>';
  const nc=$('nextclip'); if(nc){ nc.classList.toggle('show', on); if(!on){ const f=$('nc-fill'); if(f) f.style.width='0%'; nc.classList.remove('is-call','is-echo'); } }
}
function clearActive(){ nodes().forEach(n=>n.classList.remove('active','echoing')); }
function updateNextClip(now){
  const bd=drillBounds; if(!bd||bd.length<2) return;
  const box=$('nextclip'); if(!box) return;
  let j=0; while(j<bd.length-1 && now>=bd[j+1]) j++;
  let rem,pct,curT,nextT;
  if(j>=bd.length-1){ rem=Math.max(0,drillEnd-now); pct=100; curT=drillTypes[drillTypes.length-1]; nextT=null; }
  else { const lo=bd[j],hi=bd[j+1],span=Math.max(0.001,hi-lo); rem=Math.max(0,hi-now); pct=Math.min(100,Math.max(0,(now-lo)/span*100)); curT=drillTypes[j]; nextT=drillTypes[j+1]||null; }
  const t=$('nc-time'); if(t) t.textContent=rem.toFixed(1)+'초';
  const f=$('nc-fill'); if(f) f.style.width=pct.toFixed(1)+'%';
  const p=$('nc-pct'); if(p) p.textContent=Math.round(pct)+'%';
  const n=$('nc-next'); if(n) n.textContent = nextT==='call'?'→ 선창': nextT==='echo'?'→ 후창':'→ 끝';
  box.classList.toggle('is-call',curT==='call');
  box.classList.toggle('is-echo',curT==='echo');
}

/* ---------- banner ---------- */
function setBanner(kind,i,e){

  bn.classList.remove('call','echo');

  else if(kind==='echo'){ bn.classList.add('echo'); lab.textContent='따라 읽기 '+CIRC[e]; sub.textContent='구절 '+(i+1)+' — 소리 내어 후창'; }
  else if(kind==='loop'){ bn.classList.add('call'); lab.textContent='구간 반복'; sub.textContent='구절 '+(i+1)+' — 끊김 없이 반복 (버튼 다시 누르면 정지)'; }

}

/* ---------- edit boundaries ---------- */
function editBoundary(act,i){
  const key=state.current;
  let dur=state.durations[key]||0;
  if((!dur||dur<=0) && buffers[key]) dur=buffers[key].duration||0;
  let cuts=(state.boundaries[key]||[]).slice();
  const pts=[0,...cuts,dur];
  const STEP=0.2, MIN=0.4;
  function setPt(idx,val){
    val=Math.max(pts[idx-1]+MIN,Math.min(pts[idx+1]-MIN,val));
    pts[idx]=+val.toFixed(2);
  }
  if(act==='startM'||act==='startP'){
    if(i===0){ toast('첫 구절의 시작(0초)은 고정입니다'); return; }
    setPt(i, pts[i]+(act==='startP'?STEP:-STEP));
  }else if(act==='endM'||act==='endP'){
    if(i===pts.length-2){ toast('마지막 구절의 끝(곡 끝)은 고정입니다'); return; }
    setPt(i+1, pts[i+1]+(act==='endP'?STEP:-STEP));
  }else if(act==='merge'){
    if(i>=pts.length-2){ toast('마지막 구절은 합칠 다음 구절이 없습니다'); return; }
    pts.splice(i+1,1);
  }else if(act==='split'){
    const t=playPos;
    const a=pts[i], b=pts[i+1];
    if(t>a+MIN && t<b-MIN){ pts.splice(i+1,0,+t.toFixed(2)); }
    else{ const mid=(a+b)/2; pts.splice(i+1,0,+mid.toFixed(2)); toast('재생 위치가 구절 밖이라 중앙에서 분할'); }
  }
  state.boundaries[key]=pts.slice(1,-1);
  save(); renderHead(); renderChannel();
}

/* ---------- marking ---------- */
let marking=false, markPts=[], markRAF=0, markSrc=null, markStart=0, markDur=0;
function openMark(){
  const key=state.current;
  if(!buffers[key]){ loadBuffer(key).then(openMark).catch(()=>toast('오디오를 불러올 수 없습니다')); return; }
  ensureCtx();
  stopAll(true);
  marking=true; markPts=[];
  $('mark-title').textContent = meridian(key).full+' 구절 마킹';
  $('mark-count').textContent='경계 0개';
  $('mark-recent').textContent='';
  $('scrim').classList.add('show');
  markSrc=actx.createBufferSource(); markSrc.buffer=buffers[key]; markSrc.connect(master);
  markStart=actx.currentTime+0.06; markDur=buffers[key].duration;
  try{ markSrc.start(markStart,0); }catch(e){}
  tickMark();
}
function markPos(){ return Math.min(markDur, Math.max(0, actx.currentTime-markStart)); }
function tickMark(){
  if(!marking) return;
  $('mark-clock').textContent=fmt(markPos());
  markRAF=requestAnimationFrame(tickMark);
}
function tapMark(){
  if(!marking) return;
  const t=+markPos().toFixed(2);
  if(markPts.length && Math.abs(markPts[markPts.length-1]-t)<0.15) return;
  markPts.push(t);
  $('mark-count').textContent='경계 '+markPts.length+'개 → '+(markPts.length+1)+'구절';
  $('mark-recent').textContent = markPts.slice(-6).map(fmt).join('  ·  ');
}
function undoMark(){
  if(!marking||!markPts.length) return;
  markPts.pop();
  $('mark-count').textContent='경계 '+markPts.length+'개 → '+(markPts.length+1)+'구절';
  $('mark-recent').textContent = markPts.slice(-6).map(fmt).join('  ·  ');
}
function closeMark(saveIt){
  marking=false; cancelAnimationFrame(markRAF);
  try{ markSrc && markSrc.stop(); }catch(e){}
  markSrc=null;
  $('scrim').classList.remove('show');
  if(saveIt){
    const dur=state.durations[state.current]||markDur||0;
    const cuts=[...new Set(markPts.map(t=>+t.toFixed(2)))]
      .filter(t=>t>0.2 && t<dur-0.2).sort((a,b)=>a-b);
    state.boundaries[state.current]=cuts;
    save(); renderHead(); renderChannel();
    toast(cuts.length+1 + '구절로 저장됨');
  }
}

/* ---------- redivide ---------- */
function redivide(){
  const dur=state.durations[state.current]||0;
  if(!dur){ toast('오디오를 불러오는 중입니다'); return; }
  const had=state.boundaries[state.current];
  if(had && had.length && !confirm('이 곡의 현재 구절 나눔을 지우고 '+state.segLen+'초 균등분할로 바꿀까요?')) return;
  state.boundaries[state.current]=evenCuts(dur,state.segLen);
  save(); renderHead(); renderChannel(); toast(state.segLen+'초 균등분할 적용');
}

/* ---------- export / import ---------- */
function doExport(){

  },null,1);

function doImport(file){

  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(o.boundaries) state.boundaries=o.boundaries;
      if(o.segLen){ state.segLen=o.segLen; $('sel-seglen').value=o.segLen; }

    }catch(e){ toast('파일을 읽을 수 없습니다'); }

    st.className='jata-storage';st.innerHTML='● 자동 저장 켜짐 — 구절 나눔이 이 브라우저에 저장되어 다시 열어도 유지됩니다.';
  }else{
    st.style.color='#e0a35a';

  }
  anchor.parentNode.insertBefore(st, anchor.nextSibling);
}

/* ---------- study log: 날짜 기록 + 요일별 현황 ---------- */
let weekOffset=0;
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return fmtDate(new Date()); }
function tagLabel(ds){ const p=ds.split('-').map(Number); const wd=['일','월','화','수','목','금','토'][new Date(p[0],p[1]-1,p[2]).getDay()]; return String(p[1]).padStart(2,'0')+'-'+String(p[2]).padStart(2,'0')+'('+wd+')'; }
function startOfWeek(d){ const x=new Date(d); const off=(x.getDay()+6)%7; x.setDate(x.getDate()-off); x.setHours(0,0,0,0); return x; }
function logForKey(k){ return (state.studyLog[k]||[]); }
function toggleToday(){
  const k=state.current, t=todayStr();
  const arr=state.studyLog[k]?state.studyLog[k].slice():[];
  const i=arr.indexOf(t); if(i>=0) arr.splice(i,1); else arr.push(t);
  if(arr.length) state.studyLog[k]=arr; else delete state.studyLog[k];
  save(); renderStudyTags(); renderWeekly(); renderHeatmap();
  toast(i>=0?'오늘 기록을 지웠습니다':meridian(k).han+' · 오늘 암기로 기록했습니다');
}
function removeDate(d){
  const k=state.current; const arr=state.studyLog[k]; if(!arr) return;
  const i=arr.indexOf(d); if(i<0) return; arr.splice(i,1);
  if(!arr.length) delete state.studyLog[k];
  save(); renderStudyTags(); renderWeekly(); renderHeatmap(); toast('#'+tagLabel(d)+' 삭제');
}
function renderStudyTags(){
  const box=$('study-tags'); if(!box) return;
  const k=state.current; const list=logForKey(k).slice().sort().reverse();
  const has=list.includes(todayStr());
  const tags=list.map(d=>`<button class="stag" data-d="${d}" title="클릭하면 삭제">#${tagLabel(d)}<span class="x">×</span></button>`).join('');
  box.innerHTML='<div class="st-head">'
    +'<span class="st-title">'+meridian(k).han+' 암기 기록<span class="st-count">'+list.length+'회</span></span>'
    +'<button class="st-add '+(has?'on':'')+'" id="st-add">'+(has?'오늘 암기함 ✓':'＋ 오늘 암기')+'</button>'
    +'</div>'
    +'<div class="st-list">'+(tags||'<span class="st-empty">아직 기록이 없습니다 · “＋ 오늘 암기”로 기록하세요</span>')+'</div>';
  const add=$('st-add'); if(add) add.onclick=toggleToday;
  box.querySelectorAll('.stag').forEach(b=>b.onclick=()=>removeDate(b.dataset.d));
}
function renderWeekly(){
  const box=$('weekly'); if(!box) return;
  const base=startOfWeek(new Date()); base.setDate(base.getDate()+weekOffset*7);
  const t=todayStr();
  const map={};
  Object.keys(state.studyLog).forEach(k=>{ logForKey(k).forEach(d=>{ (map[d]=map[d]||[]).push(k); }); });
  const dn=['월','화','수','목','금','토','일']; let cols='';
  const weekKeys=new Set(); let weekSessions=0;
  for(let i=0;i<7;i++){
    const dt=new Date(base); dt.setDate(base.getDate()+i); const ds=fmtDate(dt);
    const studied=(map[ds]||[]).slice().sort((a,b)=>MERIDIANS.findIndex(m=>m.key===a)-MERIDIANS.findIndex(m=>m.key===b));
    studied.forEach(k=>{ weekKeys.add(k); weekSessions++; });
    const pills=studied.map(k=>{ const m=meridian(k); return '<button class="wpill" style="--c:'+m.c+'" data-key="'+k+'" title="'+m.full+' · '+ds+'">'+m.han+'</button>'; }).join('');
    cols+='<div class="wday '+(ds===t?'today':'')+'"><div class="wd-name">'+dn[i]+'</div><div class="wd-date">'+(dt.getMonth()+1)+'/'+dt.getDate()+'</div><div class="wd-pills">'+(pills||'<span class="wd-none">·</span>')+'</div></div>';
  }
  const end=new Date(base); end.setDate(base.getDate()+6);
  const range=(base.getMonth()+1)+'/'+base.getDate()+' – '+(end.getMonth()+1)+'/'+end.getDate();
  const title=weekOffset===0?'이번 주':(weekOffset<0?(-weekOffset)+'주 전':weekOffset+'주 후');
  box.innerHTML='<div class="wk-head">'
    +'<span class="wk-title">요일별 암기 현황<span class="wk-sub">'+title+' · '+range+'</span></span>'
    +'<span class="wk-nav"><button id="wk-prev" title="이전 주">‹</button><button id="wk-cur" title="이번 주로">오늘</button><button id="wk-next" title="다음 주">›</button></span>'
    +'</div>'
    +'<div class="wk-stat"><span class="wk-chip">연속 <b>'+currentStreak()+'</b>일</span><span class="wk-chip">이 주 <b>'+weekKeys.size+'</b>경 · '+weekSessions+'회</span></div>'
    +'<div class="wk-grid">'+cols+'</div>';
  const p=$('wk-prev'),c=$('wk-cur'),n=$('wk-next');
  if(p)p.onclick=()=>{weekOffset--;renderWeekly();};
  if(n)n.onclick=()=>{weekOffset++;renderWeekly();};
  if(c)c.onclick=()=>{weekOffset=0;renderWeekly();};
  box.querySelectorAll('.wpill').forEach(b=>b.onclick=()=>selectMeridian(b.dataset.key));
}

/* ---------- streak / auto-record / monthly heatmap ---------- */
function recordStudy(key){
  const t=todayStr(); const arr=state.studyLog[key]?state.studyLog[key].slice():[];
  if(arr.indexOf(t)>=0) return false;
  arr.push(t); state.studyLog[key]=arr; save(); return true;
}
function studyDaySet(){ const s=new Set(); Object.keys(state.studyLog).forEach(k=>logForKey(k).forEach(d=>s.add(d))); return s; }
function currentStreak(){
  const set=studyDaySet(); if(!set.size) return 0;
  let s=0; const cur=new Date(); cur.setHours(0,0,0,0);
  if(!set.has(fmtDate(cur))) cur.setDate(cur.getDate()-1); // 오늘 아직 안 했어도 어제까지 이어졌으면 유지
  while(set.has(fmtDate(cur))){ s++; cur.setDate(cur.getDate()-1); }
  return s;
}
let monthOffset=0;
function renderHeatmap(){
  const box=$('heatmap'); if(!box) return;
  const now=new Date(); const view=new Date(now.getFullYear(), now.getMonth()+monthOffset, 1);
  const year=view.getFullYear(), mon=view.getMonth();
  const daysIn=new Date(year, mon+1, 0).getDate();
  const isCurMonth=(year===now.getFullYear()&&mon===now.getMonth());
  const rows=MERIDIANS.map(m=>{ const days=new Set();
    logForKey(m.key).forEach(d=>{ const p=d.split('-').map(Number); if(p[0]===year && p[1]-1===mon) days.add(p[2]); });
    return {m, days}; });
  let head='<div class="hm-row hm-head"><div class="hm-lab"></div><div class="hm-cells">';
  for(let d=1; d<=daysIn; d++){ const isT=isCurMonth&&d===now.getDate(); head+='<span class="hm-dnum '+(isT?'tdy':'')+'">'+((d===1||d%5===0)?d:'')+'</span>'; }
  head+='</div><div class="hm-tot">일</div></div>';
  let bodyH='';
  rows.forEach(r=>{ let cells='';
    for(let d=1; d<=daysIn; d++){ const on=r.days.has(d); const isT=isCurMonth&&d===now.getDate();
      cells+='<span class="hm-cell'+(on?' on':'')+(isT?' tdy':'')+'" style="--c:'+r.m.c+'" title="'+r.m.han+' · '+(mon+1)+'/'+d+(on?' 복습':'')+'"></span>'; }
    bodyH+='<div class="hm-row"><button class="hm-lab" data-key="'+r.m.key+'" style="--c:'+r.m.c+'" title="'+r.m.full+'">'+r.m.han+'</button><div class="hm-cells">'+cells+'</div><div class="hm-tot">'+(r.days.size||'·')+'</div></div>';
  });
  const monthTotal=rows.reduce((a,r)=>a+r.days.size,0);
  const studiedMer=rows.filter(r=>r.days.size>0).length;
  const mlabel=year+'.'+String(mon+1).padStart(2,'0');
  box.innerHTML='<div class="hm-head-bar">'
    +'<span class="hm-title">월간 복습 히트맵<span class="hm-sub">'+mlabel+' · '+studiedMer+'경 · 총 '+monthTotal+'회</span></span>'
    +'<span class="hm-nav"><button id="hm-prev" title="이전 달">‹</button><button id="hm-cur" title="이번 달로">이번 달</button><button id="hm-next" title="다음 달">›</button></span>'
    +'</div><div class="hm-grid">'+head+bodyH+'</div>';
  const p=$('hm-prev'),c=$('hm-cur'),n=$('hm-next');
  if(p)p.onclick=()=>{monthOffset--;renderHeatmap();};
  if(n)n.onclick=()=>{monthOffset++;renderHeatmap();};
  if(c)c.onclick=()=>{monthOffset=0;renderHeatmap();};
  box.querySelectorAll('.hm-lab[data-key]').forEach(b=>b.onclick=()=>selectMeridian(b.dataset.key));
}

               ref:'背兪·兪募·交會穴 일람 — 열 가리고 셀프테스트',
               cloze:'交會穴 약 91 — 니모닉 빈칸 채우기 (소속경별·유주 순서)',
               era:'한·진·당·송·원·명·청 연표에 의가·저서 배치 (혈수 변천 배지)',
               match:'의가 ↔ 著書·穴數·時代·業績 4속성 연결 매칭',
               systree:'經脈·絡脈·連屬 구조에 기능 카드 분류 (離入出合↔경별 등)',
               swipe:'經別/經筋·任/衝·督/任 등 헷갈리는 쌍 좌우 스와이프',
               saamwheel:'生我·克我·我生으로 正格·勝格을 유도 (이해)',
               saammirror:'正格↔勝格: 官혈 축, 母↔子만 교체 (관계)',
               saamcloze:'암송 문장 단서로 4혈 타이핑 (회상)',
               saammaster:'自經·正格·勝格·主客·寒熱 4법을 한 시스템으로',
               saamquiz:'舍岩 4법(自經·正格·勝格·主客·寒熱) 혈·五行 — 간격반복',
               saambosafill:'自經·主客·正格·勝格 — 칩으로 빈칸 채우기 (도출 훈련)'
};
  let ACTIVE=null, recs=[];
  const TKEY='hub_track_v1';
  function _tk(){ try{const o=JSON.parse(localStorage.getItem(TKEY))||{};o.tools=o.tools||{};o.days=o.days||{};return o;}catch(e){return {tools:{},days:{}};} }
  function _tkSave(t){ try{localStorage.setItem(TKEY,JSON.stringify(t));}catch(e){} }
  function _tkToday(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function logVisit(id){ if(id==='home')return; const t=_tk(); const o=t.tools[id]||{visits:0}; o.visits=(o.visits||0)+1; o.last=_tkToday(); t.tools[id]=o; const d=_tkToday(); t.days[d]=(t.days[d]||0)+1; _tkSave(t); }
  window.HubTrack={ report:function(d){ try{ const t=_tk(); const id=window.__active; if(!id||id==='home')return; const o=t.tools[id]||{visits:0}; if(d.total!=null)o.total=d.total; if(d.done!=null)o.done=Math.max(o.done||0,d.done); if(d.acc!=null)o.bestAcc=Math.max(o.bestAcc||0,d.acc); if(d.total&&d.done>=d.total)o.completes=(o.completes||0)+1; o.last=_tkToday(); t.tools[id]=o; _tkSave(t); }catch(e){} }, get:function(){ return _tk(); } };
  const SKEY='hub_stats_v1';
  function _sk(){ try{const o=JSON.parse(localStorage.getItem(SKEY))||{};o.q=o.q||{};return o;}catch(e){return {q:{}};} }
  function _skSave(o){ try{localStorage.setItem(SKEY,JSON.stringify(o));}catch(e){} }
  window.HubStats={ record:function(tool,card,correct){ try{ if(!tool||!card||card.id==null)return; const o=_sk(); const k=tool+'::'+card.id; const e=o.q[k]||{tool:tool,id:card.id,seen:0,wrong:0}; e.seen++; if(!correct)e.wrong++; if(card.q!=null)e.q=String(card.q).slice(0,240); if(card.cat!=null)e.cat=String(card.cat).slice(0,80); if(card.kind!=null)e.kind=String(card.kind).slice(0,48); if(card.a!=null)e.a=String(card.a).slice(0,160); e.last=_tkToday(); if(!correct)e.lastWrong=_tkToday(); e.h=(e.h||[]).concat([[_tkToday(),correct?1:0]]).slice(-10); o.q[k]=e; _skSave(o); }catch(err){} }, get:function(){ return _sk(); } };
  function inject(text, where){ const s=document.createElement('script'); s.textContent=text; (where||mount).appendChild(s); }
  function captureOn(){
    recs=[]; const oD=document.addEventListener, oW=window.addEventListener;
    document.addEventListener=function(t,f,o){ recs.push(['d',t,f,o]); return oD.call(document,t,f,o); };
    window.addEventListener  =function(t,f,o){ recs.push(['w',t,f,o]); return oW.call(window,t,f,o); };
    return ()=>{ document.addEventListener=oD; window.addEventListener=oW; };
  }
  function deactivate(){
    if(ACTIVE==='jata'){ try{ window.__jataStop && window.__jataStop(); }catch(e){} }
    recs.forEach(r=>{ try{ (r[0]==='d'?document:window).removeEventListener(r[1],r[2],r[3]); }catch(e){} });
    recs=[]; mount.innerHTML='';
  }
  async function activate(id){
    if(ACTIVE===id) return;
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.id===id));
    if(hint) hint.textContent = HINTS[id]||'';
    deactivate();
    // lazily parse the 16MB audio only the first time 자타 is opened
    if(id==='jata' && !window.__AUDIO){
      loader.querySelector('.msg').textContent='오디오 불러오는 중… (최초 1회, 잠시만요)';
      loader.classList.remove('hidden');
      await new Promise(r=>setTimeout(r,40));
      inject(document.getElementById('src-audio').textContent, document.body);
    }
    if(id==='saambosafill'){
      var __gf=document.createElement('iframe');
      __gf.src='saam_bosa_fill.html';
      __gf.title='사암 보사 빈칸채우기';
      __gf.style.cssText='width:100%;height:100vh;border:0;display:block';
      mount.appendChild(__gf);
      ACTIVE=id; window.__active=id;
      mount.setAttribute('data-tab',id);
      mount.classList.remove('lt-srs','lt-jata');
      try{logVisit(id);}catch(e){}
      loader.classList.add('hidden');
      window.scrollTo(0,0);
      return;
    }
    mount.appendChild(document.getElementById('tpl-'+id).content.cloneNode(true));
    const restore=captureOn();
    try{ inject(document.getElementById('src-'+id).textContent); }
    catch(e){ console.error('mount error',e); }
    finally{ restore(); }
    ACTIVE=id; window.__active=id;
    mount.setAttribute('data-tab',id);
    mount.classList.remove('lt-srs','lt-jata');
    if(['func','history','sidong','baesurule','saamquiz'].indexOf(id)>=0) mount.classList.add('lt-srs');
    else if(id==='jata') mount.classList.add('lt-jata');
    try{logVisit(id);}catch(e){}
    loader.classList.add('hidden');
    window.scrollTo(0,0);
  }

  /* ===== ② 통합 오늘 세션: 전 도구의 복습 대기 문항을 라운드로빈 청크로 섞어 순서대로 진행 ===== */
  window.HubSession={
    st:null,
    start:function(plan){ this.st={plan:plan||[],i:0,items:(plan||[]).reduce(function(n,c){return n+c.ids.length;},0),t0:Date.now()}; this.next(); },
    active:function(){ return !!(this.st&&this.st.i<this.st.plan.length); },
    cancel:function(){ this.st=null; window.__focusDrill=null; if(hint) hint.textContent=HINTS[ACTIVE]||''; },
    next:function(){
      var S=this.st; if(!S) return;
      if(S.i>=S.plan.length){ this.st=null; var mins=Math.max(1,Math.round((Date.now()-S.t0)/60000)); try{ localStorage.setItem('hub_session_last', JSON.stringify({day:_tkToday(),items:S.items,chunks:S.plan.length,mins:mins})); }catch(e){} activate('home'); return; }
      var c=S.plan[S.i]; S.i++;
      window.__focusDrill={tool:c.tool,ids:c.ids.slice(),hub:true};
      var label=(TOOL_LABEL[c.tool]||c.tool);
      var self=this;
      var go=function(){ if(hint) hint.textContent='통합 세션 '+S.i+'/'+S.plan.length+' · '+label+' '+c.ids.length+'문항'; };
      if(ACTIVE===c.tool){ ACTIVE=null; } /* 같은 도구가 연속되면 재마운트해 focusDrill을 소비시킴 */
      Promise.resolve(activate(c.tool)).then(go,go);
    }
  };
  var TOOL_LABEL={acu:'경혈 퀴즈',func:'기능 퀴즈',history:'발전사',sidong:'시동·소생',baesurule:'배수혈 추론',saamquiz:'사암 보사'};
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ try{ if(window.HubSession&&HubSession.active()) HubSession.cancel(); }catch(e){} activate(t.dataset.id); });
  window.__activate=activate;
  /* ===== 전역 스페이스→다음 (플래시카드/문제 게임 통일) ===== */
  (function(){
    var SELF=['acu','func','history','sidong','baesurule','saamquiz']; /* 자체 스페이스 처리: 중복 advance 방지 위해 제외 */
    var SKIP=['jata','ref','home','saambosafill'];                                    /* jata=오디오 재생/정지, ref=읽기, home=메뉴 */
    document.addEventListener('keydown',function(e){
      if(e.repeat) return;                       /* 길게 눌러도 1칸만 */
      if(e.code!=='Space' && e.key!==' ') return;
      var id=window.__active;
      if(!id || SELF.indexOf(id)>=0 || SKIP.indexOf(id)>=0) return;
      var ae=document.activeElement;             /* 입력 중이면 스페이스는 글자로 */
      if(ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT'||ae.isContentEditable)) return;
      var b=mount.querySelector('#btn-next, #next, button.next, .btn-next');
      if(b && b.getClientRects().length && !b.classList.contains('hidden') && !b.disabled){
        e.preventDefault();                      /* 페이지 스크롤 막고 */
        b.click();                               /* 보이는 '다음' 버튼 클릭 */
      }
    });
  })();
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){activate('home');});}else{activate('home');}
})();
</script>

<template id="tpl-spine"><style>

<div class="wrap">
  <div class="kicker">背兪穴 · 交會穴 — 학습 도구 예시 (안 2)</div>
  <h1>척추 위에 배수혈을 놓다<span class="sub">背兪穴 척추맵 · 交會穴 네트워크 — 위치를 그림으로 익히는 프로토타입</span></h1>
  <p class="lede">방광경 1선은 척추를 따라 내려갑니다. 장부 칩을 <b>정확한 척추 마디</b>에 놓아 배수혈 위치를 익히고, <b>건너뛰는 마디</b>(T8·L3·L5)를 눈으로 확인하세요. 교회혈 탭에서는 혈 하나가 <b>어느 경맥들과 만나는지</b>를 점등으로 봅니다.</p>

  <div class="vtabs">
    <button class="vtab on" data-view="spine">背兪穴 척추맵</button>
    <button class="vtab" data-view="jiao">交會穴 네트워크</button>
  </div>

  <!-- ========== SPINE VIEW ========== -->
  <section class="vsection on" id="view-spine">
    <div class="bar">
      <div class="seg" id="mode-seg">
        <button data-mode="place" class="on">배치 연습</button>
        <button data-mode="study">학습(정답)</button>
      </div>
      <button class="btn" id="btn-reveal">정답 보기</button>
