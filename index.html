<script type="text/plain" id="src-spine">(function(){

const EL={金:'#bfc4cb',火:'#cc4b3c',木:'#5f9070',土:'#caa44e',水:'#5a86a8',督:'#9b86c4',任:'#6fae9e',奇:'#8d8475',血:'#c45149'};
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1400);}

/* ===== back-shu data ===== */
const SHU=[
  {j:'肺',  h:'肺兪',  c:'BL13', lv:'T3', el:'金'},
  {j:'心包',h:'厥陰兪',c:'BL14', lv:'T4', el:'火'},
  {j:'心',  h:'心兪',  c:'BL15', lv:'T5', el:'火'},
  {j:'督',  h:'督兪',  c:'BL16', lv:'T6', el:'督'},
  {j:'膈',  h:'膈兪',  c:'BL17', lv:'T7', el:'血'},
  {j:'肝',  h:'肝兪',  c:'BL18', lv:'T9', el:'木'},
  {j:'膽',  h:'膽兪',  c:'BL19', lv:'T10',el:'木'},
  {j:'脾',  h:'脾兪',  c:'BL20', lv:'T11',el:'土'},
  {j:'胃',  h:'胃兪',  c:'BL21', lv:'T12',el:'土'},
  {j:'三焦',h:'三焦兪',c:'BL22', lv:'L1', el:'火'},
  {j:'腎',  h:'腎兪',  c:'BL23', lv:'L2', el:'水'},
  {j:'大腸',h:'大腸兪',c:'BL25', lv:'L4', el:'金'},
  {j:'小腸',h:'小腸兪',c:'BL27', lv:'S1', el:'火'},
  {j:'膀胱',h:'膀胱兪',c:'BL28', lv:'S2', el:'水'},
];
const BY_LV={}; SHU.forEach(s=>BY_LV[s.lv]=s);
const REGIONS=[
  {tag:'頸椎', items:['C7']},
  {tag:'胸椎 T1–T12', items:['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12']},
  {tag:'腰椎 L1–L5', items:['L1','L2','L3','L4','L5']},
  {tag:'仙骨 S1–S4', items:['S1','S2','S3','S4']},
];

let mode='place', sel=null, placed={}, firstTry={ok:0,miss:0};

function buildSpine(){
  const sp=$('spine'); sp.innerHTML='';
  REGIONS.forEach(rg=>{
    const reg=document.createElement('div'); reg.className='region';
    reg.innerHTML='<div class="rtag">'+rg.tag+'</div>';
    rg.items.forEach(lv=>{
      const has=!!BY_LV[lv];
      const row=document.createElement('div'); row.className='vrow'; row.dataset.lv=lv; row.dataset.has=has?'1':'0';
      const slotState = has ? 'empty' : 'gap';
      row.innerHTML='<div class="bone">'+lv+'</div>'+
        '<div class="slot '+slotState+'" data-lv="'+lv+'">'+(has?'':'<span style="font-family:var(--mono);font-size:10px">—</span>')+'</div>';
      reg.appendChild(row);
    });
    sp.appendChild(reg);
  });
  sp.querySelectorAll('.slot').forEach(s=>s.onclick=()=>onSlot(s));
}
function fillSlot(slot,s,opts){
  opts=opts||{};
  slot.classList.remove('empty','gap'); slot.classList.add('filled');
  slot.innerHTML='<span class="dot" style="background:'+EL[s.el]+'"></span>'+
    '<span class="nm">'+s.j+'</span>'+
    '<span class="pt">'+s.h+' '+s.c+'</span>';
  if(opts.hide) slot.classList.add('hide');
}
function buildTray(){
  const tray=$('tray'); tray.innerHTML='';
  const remaining=SHU.filter(s=>!placed[s.lv]);
  if(!remaining.length){ tray.innerHTML='<div class="tray-empty">모든 장부를 배치했습니다.</div>'; return; }
  shuffle(remaining.slice()).forEach(s=>{
    const b=document.createElement('button'); b.className='chip'; b.dataset.j=s.j;
    b.innerHTML='<span class="dot" style="background:'+EL[s.el]+'"></span>'+s.j;
    b.onclick=()=>{ if(sel===s.j){sel=null;} else {sel=s.j;} paintSel(); };
    tray.appendChild(b);
  });
}
function paintSel(){
  document.querySelectorAll('#tray .chip').forEach(c=>c.classList.toggle('sel',c.dataset.j===sel));
  const st=$('spine-status');
  if(sel){ const s=SHU.find(x=>x.j===sel); st.innerHTML='선택: <b>'+s.h+'</b> — 놓을 <b>척추 마디</b>를 누르세요.'; }
  else st.innerHTML='놓을 <b>장부</b>를 고른 뒤, 해당하는 <b>척추 마디</b>를 누르세요.';
}
function onSlot(slot){
  if(mode==='study'){ slot.classList.toggle('hide'); return; }
  const lv=slot.dataset.lv;
  if(placed[lv]) return;                 // already filled
  if(!sel){ toast('먼저 장부 칩을 선택하세요'); return; }
  const s=SHU.find(x=>x.j===sel);
  if(s.lv===lv){                          // correct
    placed[lv]=s; firstTry.ok++;
    fillSlot(slot,s);
    sel=null; buildTray(); paintSel(); updateProg();
  } else {                                // wrong
    firstTry.miss++;
    slot.classList.add('wrong','flash-bad');
    setTimeout(()=>slot.classList.remove('wrong','flash-bad'),340);
    const correctLv=s.lv;
    toast(s.j+'은(는) '+lv+'가 아니에요');
  }
}
function updateProg(){
  const n=Object.keys(placed).length;
  $('sp-done').textContent=n;
  if(n===SHU.length){
    const total=firstTry.ok+firstTry.miss;
    const acc=total?Math.round(firstTry.ok/total*100):100;
    $('done-msg').textContent='첫 시도 정확도 '+acc+'%  (정답 '+firstTry.ok+' · 실수 '+firstTry.miss+'). 학습 모드로 위치를 한 번 더 훑어보세요.';
    $('spine-done').classList.add('on');
  }
}
function revealAll(){
  Object.values(BY_LV).forEach(()=>{});
  document.querySelectorAll('#spine .slot').forEach(slot=>{
    const s=BY_LV[slot.dataset.lv]; if(s){ placed[s.lv]=s; fillSlot(slot,s); }
  });
  $('tray').innerHTML='<div class="tray-empty">정답을 표시했습니다. “다시 섞기”로 연습을 시작하세요.</div>';
  updateProg();
}
function resetSpine(keepMode){
  sel=null; placed={}; firstTry={ok:0,miss:0};
  $('spine-done').classList.remove('on');
  buildSpine();
  if(mode==='study'){
    document.querySelectorAll('#spine .slot').forEach(slot=>{ const s=BY_LV[slot.dataset.lv]; if(s) fillSlot(slot,s,{hide:false}); });
    $('tray-wrap').style.display='none';
  }else{
    $('tray-wrap').style.display='';
    buildTray();
  }
  paintSel(); updateProg();
}
function setMode(m){
  mode=m;
  document.querySelectorAll('#mode-seg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  $('btn-reveal').style.display = m==='place' ? '' : 'none';
  $('spine-status').style.display = m==='place' ? '' : 'none';
  $('spine-prog').style.display = m==='place' ? '' : 'none';
  resetSpine();
  if(m==='study') $('spine-status').innerHTML='';
}

/* ===== 교회혈 data ===== */
const MER=[
  {k:'肺',full:'手太陰肺',el:'金'},{k:'大腸',full:'手陽明大腸',el:'金'},
  {k:'胃',full:'足陽明胃',el:'土'},{k:'脾',full:'足太陰脾',el:'土'},
  {k:'心',full:'手少陰心',el:'火'},{k:'小腸',full:'手太陽小腸',el:'火'},
  {k:'膀胱',full:'足太陽膀胱',el:'水'},{k:'腎',full:'足少陰腎',el:'水'},
  {k:'心包',full:'手厥陰心包',el:'火'},{k:'三焦',full:'手少陽三焦',el:'火'},
  {k:'膽',full:'足少陽膽',el:'木'},{k:'肝',full:'足厥陰肝',el:'木'},
  {k:'督',full:'督脈',el:'督'},{k:'任',full:'任脈',el:'任'},
  {k:'衝',full:'衝脈',el:'奇'},{k:'帶',full:'帶脈',el:'奇'},
  {k:'陰維',full:'陰維脈',el:'奇'},{k:'陽維',full:'陽維脈',el:'奇'},
  {k:'陰蹻',full:'陰蹻脈',el:'奇'},{k:'陽蹻',full:'陽蹻脈',el:'奇'},
];
const MK={}; MER.forEach(m=>MK[m.k]=m);
const JIAO=[
  {pt:'三陰交',c:'SP6', m:['脾','肝','腎'], note:'足三陰(비·간·신)의 교회. 부인과·비뇨생식의 要穴.'},
  {pt:'關元', c:'CV4', m:['任','脾','肝','腎'], note:'任脈과 足三陰의 교회. 元氣를 기르는 强壯穴.'},
  {pt:'中極', c:'CV3', m:['任','脾','肝','腎'], note:'任脈과 足三陰의 교회. 膀胱의 募穴.'},
  {pt:'大椎', c:'GV14',m:['督','大腸','小腸','三焦','胃','膀胱','膽'], note:'督脈 + 手足六陽經의 교회 — 諸陽之會. 退熱 要穴.'},
  {pt:'百會', c:'GV20',m:['督','膀胱'], note:'督脈·足太陽의 교회. 頭頂의 升陽 要穴.'},
  {pt:'風池', c:'GB20',m:['膽','陽維'], note:'足少陽膽·陽維脈의 교회. 祛風 要穴.'},
  {pt:'風府', c:'GV16',m:['督','陽維'], note:'督脈·陽維脈의 교회.'},
  {pt:'章門', c:'LR13',m:['肝','膽'], note:'足厥陰肝·足少陽膽의 교회. 八會穴의 臟會.'},
  {pt:'中脘', c:'CV12',m:['任','小腸','三焦','胃'], note:'任脈·手太陽·手少陽·足陽明의 교회. 八會穴의 腑會.'},
  {pt:'睛明', c:'BL1', m:['膀胱','小腸','胃','陰蹻','陽蹻'], note:'足太陽·手太陽·足陽明·陰蹻·陽蹻 5경의 교회.'},
];
let jmode='explore', jSel=new Set(), jCur=null, jScore={c:0,t:0}, jAnswered=false;

function buildLegend(){
  const lg=$('legend'); lg.innerHTML='';
  MER.forEach(m=>{
    const b=document.createElement('button'); b.className='mchip'; b.dataset.k=m.k;
    b.innerHTML='<span class="dot" style="background:'+EL[m.el]+'"></span>'+m.full;
    b.onclick=()=>onMchip(m.k);
    lg.appendChild(b);
  });
}
function clearLegendState(){ document.querySelectorAll('#legend .mchip').forEach(c=>c.className='mchip'); }
function buildJbtns(){
  const wrap=$('jbtns'); wrap.innerHTML='';
  JIAO.forEach(j=>{
    const b=document.createElement('button'); b.className='jbtn'; b.dataset.pt=j.pt; b.textContent=j.pt;
    b.onclick=()=>showPoint(j.pt);
    wrap.appendChild(b);
  });
}
function showPoint(pt){
  const j=JIAO.find(x=>x.pt===pt);
  document.querySelectorAll('#jbtns .jbtn').forEach(b=>b.classList.toggle('on',b.dataset.pt===pt));
  const set=new Set(j.m);
  document.querySelectorAll('#legend .mchip').forEach(c=>{
    c.className='mchip'+(set.has(c.dataset.k)?' hi':' dim');
  });
  const mers=j.m.map(k=>{const m=MK[k];return '<span class="mchip hi"><span class="dot" style="background:'+EL[m.el]+'"></span>'+m.full+'</span>';}).join('');
  $('notecard').innerHTML='<div class="h"><span class="pt">'+j.pt+'</span><span class="code">'+j.c+'</span><span class="cnt">'+j.m.length+'경 교회</span></div>'+
    '<div class="mers">'+mers+'</div><div class="nt">'+j.note+'</div>';
}
function onMchip(k){
  if(jmode==='explore') return; // legend is display-only in explore
  if(jAnswered) return;
  const c=document.querySelector('#legend .mchip[data-k="'+k+'"]');
  if(jSel.has(k)){jSel.delete(k);c.classList.remove('sel');}
  else{jSel.add(k);c.classList.add('sel');}
}
function newQuiz(){
  jAnswered=false; jSel.clear(); clearLegendState();
  jCur=JIAO[Math.floor(Math.random()*JIAO.length)];
  $('q-pt').textContent=jCur.pt; $('q-code').textContent=jCur.c;
  $('q-fb').textContent=''; $('q-check').style.display=''; $('q-next').style.display='none';
}
function checkQuiz(){
  if(jAnswered) return; jAnswered=true;
  const ans=new Set(jCur.m); let allRight=true;
  document.querySelectorAll('#legend .mchip').forEach(c=>{
    const k=c.dataset.k, picked=jSel.has(k), correct=ans.has(k);
    c.classList.remove('sel');
    if(correct&&picked) c.classList.add('ok');
    else if(correct&&!picked){ c.classList.add('miss'); allRight=false; }
    else if(!correct&&picked){ c.classList.add('bad'); allRight=false; }
  });
  jScore.t++; if(allRight) jScore.c++;
  $('jc').textContent=jScore.c; $('jt').textContent=jScore.t;
  $('q-fb').innerHTML = allRight ? '<b style="color:var(--mok)">정답!</b> '+jCur.pt+' = '+jCur.m.length+'경 교회'
    : '<b style="color:var(--hwa)">오답</b> — 초록=정답, 점선=빠뜨림, 빨강=잘못 고름';
  $('q-check').style.display='none'; $('q-next').style.display='';
}
function setJmode(m){
  jmode=m;
  document.querySelectorAll('#jmode-seg button').forEach(b=>b.classList.toggle('on',b.dataset.jmode===m));
  $('explore-box').style.display = m==='explore'?'':'none';
  $('quiz-box').style.display = m==='quiz'?'':'none';
  $('jscore').style.display = m==='quiz'?'':'none';
  clearLegendState();
  document.querySelectorAll('#jbtns .jbtn').forEach(b=>b.classList.remove('on'));
  if(m==='quiz'){ newQuiz(); } else { $('notecard').innerHTML='<span class="ph">위 혈을 누르면 만나는 경맥이 점등됩니다.</span>'; }
}

/* ===== view tabs ===== */
function showView(v){
  document.querySelectorAll('.vtab').forEach(t=>t.classList.toggle('on',t.dataset.view===v));
  document.querySelectorAll('.vsection').forEach(s=>s.classList.remove('on'));
  $('view-'+v).classList.add('on');
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ===== wire ===== */
document.querySelectorAll('.vtab').forEach(t=>t.onclick=()=>showView(t.dataset.view));
document.querySelectorAll('#mode-seg button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$('btn-reveal').onclick=revealAll;
$('btn-reset').onclick=()=>resetSpine();
document.querySelectorAll('#jmode-seg button').forEach(b=>b.onclick=()=>setJmode(b.dataset.jmode));
$('q-check').onclick=checkQuiz;
$('q-next').onclick=newQuiz;

buildSpine(); buildTray(); setMode('place');
buildLegend(); buildJbtns(); setJmode('explore');

})();</script>

/* ============== SRS engine ============== */
const KEY='baesu_rule_srs_v1';
const INT={1:3,2:7,3:14,4:30,5:60,6:120}; const ST_MAX=6; /* 오답→3일, 처음 맞힘→7일, 이후 성공마다 확장 · 졸업 없음 */
const G={ db:null, queue:[], cur:null, answered:false, mode:'today',
  active:new Set(CATS.map(c=>c.key)),
  sCorrect:0, sWrong:0, sStreak:0, sBest:0, sSeen:0, sTotal:0, sinceMiss:99 };
const $=id=>document.getElementById(id);

function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function probeStorage(){ try{localStorage.setItem('__p','1');const ok=localStorage.getItem('__p')==='1';localStorage.removeItem('__p');return ok;}catch(e){return false;} }
let storageOK=true;
function loadDB(){
  let db={cards:{},streak:0,lastDay:null,log:{}};
  try{ const raw=localStorage.getItem(KEY); if(raw){ const o=JSON.parse(raw); db=Object.assign(db,o); db.cards=o.cards||{}; db.log=o.log||{}; } }catch(e){}
  // prune cards no longer in bank
  const ids=new Set(BANK.map(b=>b.id));
  for(const k of Object.keys(db.cards)) if(!ids.has(k)) delete db.cards[k];
  // 구버전 '졸업'(due=null) 카드 → 유지 단계로 복귀, 7~30일에 분산
  for(const k of Object.keys(db.cards)){ const c=db.cards[k]; if(c && !c.due){ let h=0; for(let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))>>>0; c.st=Math.max(c.st||1,4); c.due=addDays(today(), 7+(h%24)); } }
  G.db=db;
}
function saveDB(){ try{ localStorage.setItem(KEY, JSON.stringify(G.db)); }catch(e){} }

function dueCount(){
  const t=today(); let n=0;
  for(const b of BANK){ if(!G.active.has(b.cat)) continue; const c=G.db.cards[b.id]; if(c && c.due && c.due<=t) n++; }
  return n;
}
function buildQueue(mode){
  const t=today();
  const due=[], fresh=[];
  for(const b of BANK){
    if(!G.active.has(b.cat)) continue;
    const c=G.db.cards[b.id];
    if(c && c.due && c.due<=t) due.push(b.id);
    else if(!c && mode!=='review') fresh.push(b.id);
  }
  shuffle(due); shuffle(fresh);
  let q;
  if(mode==='review') q=due;
  else if(mode==='practice'){ q=BANK.filter(b=>G.active.has(b.cat)).map(b=>b.id); shuffle(q); }
  else {
    const NEW_CAP=12; // 하루 신규 유입 상한
    q=[...due, ...fresh.slice(0,NEW_CAP)];
    if(!q.length){ // 전부 카드화됐고 오늘 기한도 없음 → 기한이 가장 가까운 10장 앞당겨 복습
      const ahead=BANK.filter(b=>G.active.has(b.cat)&&G.db.cards[b.id]&&G.db.cards[b.id].due)
        .sort((x,y)=>G.db.cards[x.id].due<G.db.cards[y.id].due?-1:1).slice(0,10).map(b=>b.id);
      q=shuffle(ahead);
    }
  }
  return q;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ============== flow ============== */
function start(mode){if(window.__focusDrill&&window.__focusDrill.tool==='baesurule'&&window.__focusDrill.ids&&window.__focusDrill.ids.length){var _fd=window.__focusDrill.ids.slice();var _hub=!!window.__focusDrill.hub;window.__focusDrill=null;var _ex=new Set(BANK.map(function(x){return x.id;}));G.mode='review';G.hub=_hub;G.queue=_fd.filter(function(id){return _ex.has(id);});shuffle(G.queue);G.sCorrect=G.sWrong=G.sStreak=G.sBest=G.sSeen=0;G.sinceMiss=99;G.sTotal=G.queue.length;if($('result'))$('result').classList.remove('show');if(!G.queue.length){if($('stage'))$('stage').innerHTML='<div class="card"><div class="q" style="font-size:18px">복습할 문항이 없습니다.</div></div>';refreshStats();if(_hub){G.hub=false;setTimeout(function(){try{window.HubSession&&HubSession.next();}catch(e){}},500);}return;}nextQ();refreshStats();return;}
  G.mode=mode;
  G.queue=buildQueue(mode);
  G.sCorrect=G.sWrong=G.sStreak=G.sBest=G.sSeen=0; G.sinceMiss=99;
  G.sTotal=G.queue.length;
  $('result').classList.remove('show');
  if(!G.queue.length){
    $('stage').innerHTML='';
    const t=today();
    const msg = mode==='review'
      ? '복습할 카드가 없습니다 — 선택한 분야에서 틀린 문제가 모두 기한이 안 됐거나 졸업했어요.'
      : '이 분야에 더 풀 카드가 없습니다. 분야를 추가하거나 연습(무한) 모드를 써보세요.';
    $('stage').innerHTML=`<div class="card"><div class="q" style="font-size:20px">${msg}</div></div>`;
    refreshStats(); return;
  }
  nextQ();
  refreshStats();
}
function nextQ(){
  if(!G.queue.length){ return finish(); }
  const id=G.queue.shift();
  const b=BANK.find(x=>x.id===id);
  G.cur=b; G.answered=false;
  renderQ(b);
  updateProg();
}
function catMeta(k){ return CATS.find(c=>c.key===k); }
function renderQ(b){
  G.hinted=false;
  const cm=catMeta(b.cat);
  const cc=getComputedStyle(document.documentElement).getPropertyValue(cm.v).trim();
  const c=G.db.cards[b.id];
  const stTag = c ? (((c.st||1)>=4) ? `유지 ${INT[Math.min(c.st||1,ST_MAX)]}일` : `복습 ${c.st||1}단계`) : '신규';
  // build options
  const opts=shuffle([b.a, ...b.d]).slice();
  const letters=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ'];
  let html=`<div class="card" style="--cc:${cc}">
    <div class="tag"><span class="dot"></span>${cm.label} · <span style="color:var(--paper-dim)">${stTag}</span></div>
    <div class="q">${b.q}</div>
    <div class="opts" id="opts">`;
  opts.forEach((o,i)=>{ html+=`<button class="opt" data-v="${esc(o)}"><span class="key">${letters[i]}</span><span>${o}</span><span class="mark"></span></button>`; });
  html+=`</div>
    <div class="hint-row" id="hint-row"><button class="hint-btn" id="btn-hint" title="정답 후보를 줄여주지만, 이 문제는 오답(복습 대상)으로 기록됩니다">힌트 · 선택지 줄이기 <em>(오답 처리)</em></button></div>
    <div class="fb" id="fb">
      <div class="verdict" id="verdict"></div>
      <div class="note" id="note"></div>
      <div class="srs" id="srs"></div>
      <div class="next-row"><button class="btn primary" id="btn-next">다음 →</button></div>
    </div></div>`;
  $('stage').innerHTML=html;
  $('opts').querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>choose(btn));
  const hb=$('btn-hint'); if(hb) hb.onclick=useHint;
  $('btn-next').onclick=nextQ;
}
function esc(s){ return String(s).replace(/"/g,'&quot;'); }
function useHint(){
  if(G.answered || G.hinted) return;
  G.hinted=true;
  const b=G.cur, opts=[...$('opts').querySelectorAll('.opt')];
  const wrong=opts.filter(o=>o.dataset.v!==b.a);
  shuffle(wrong);
  wrong.slice(0, Math.max(0, wrong.length-1)).forEach(o=>{ o.classList.add('eliminated'); o.disabled=true; const mk=o.querySelector('.mark'); if(mk) mk.textContent='✕'; });
  const hb=$('btn-hint'); if(hb){ hb.disabled=true; hb.innerHTML='힌트 사용됨 · 오답 처리'; }
}

function choose(btn){
  if(G.answered) return;
  G.answered=true;
  const b=G.cur, picked=btn.dataset.v, actuallyCorrect = picked===b.a, correct = actuallyCorrect && !G.hinted;
  const opts=$('opts').querySelectorAll('.opt');
  opts.forEach(o=>{
    o.disabled=true;
    const v=o.dataset.v;
    if(v===b.a){ o.classList.add('correct'); o.querySelector('.mark').textContent='✓'; }
    else if(o===btn){ o.classList.add('wrong'); o.querySelector('.mark').textContent='✕'; }
  });
  // SRS update
  const t=today();
  const card=G.db.cards[b.id];
  let srsMsg='';
  if(correct){
    G.sCorrect++; G.sStreak++; G.sBest=Math.max(G.sBest,G.sStreak); G.sinceMiss++;
    if(!card){ // 처음 맞힘 → 카드 생성, 7일 뒤 확인
      G.db.cards[b.id]={st:2,due:addDays(t,INT[2]),lapses:0,first:t};
      srsMsg=`✓ 처음 맞힘 → ${INT[2]}일 뒤 확인.`;
    } else if(card.due && card.due<=t){ // 예정된 복습 성공 → 간격 확장 (졸업 없음)
      card.st=Math.min((card.st||1)+1, ST_MAX);
      card.due=addDays(t, INT[card.st]);
      srsMsg = card.st>=4 ? `✓ 유지 단계 → ${INT[card.st]}일 뒤 다시.` : `✓ 복습 성공 → ${INT[card.st]}일 뒤 다시.`;
    } else { // 기한 전 조기 정답(연습 등) → 간격 유지
      if(!card.due){ card.st=Math.max(card.st||1,4); card.due=addDays(t, INT[card.st]); }
      srsMsg=`✓ 정답 (다음 확인 ${card.due}).`;
    }
  } else {
    G.sWrong++; G.sStreak=0; G.sinceMiss=0;
    const cc=G.db.cards[b.id]||{lapses:0};
    cc.st=1; cc.due=addDays(t,INT[1]); cc.lapses=(cc.lapses||0)+1;
    G.db.cards[b.id]=cc;
    srsMsg=`✕ 오답 → 3일 뒤 복습 예약.`;
    // re-drill later this session
    if(Math.random()<0.5){ const pos=Math.min(G.queue.length, 3+Math.floor(Math.random()*3)); G.queue.splice(pos,0,b.id); }
  }
  G.sSeen++;
  // log
  G.db.log[t]=G.db.log[t]||{a:0,c:0}; G.db.log[t].a++; if(correct)G.db.log[t].c++; try{window.HubStats&&HubStats.record('baesurule',{id:b.id,q:b.q,cat:b.cat,a:b.a},correct);}catch(e){}
  saveDB();
  // feedback
  const hr=$('hint-row'); if(hr) hr.style.display='none';
  $('verdict').textContent = correct ? '정답입니다'
    : (G.hinted && actuallyCorrect ? '정답이지만 힌트 사용 → 복습 대상으로 기록 (정답: '+b.a+')'
       : ('오답 — 정답: '+b.a)+(G.hinted?' · 힌트 사용':''));
  $('verdict').className = 'verdict '+(correct?'ok':'no');
  $('note').innerHTML = b.note||'';
  $('srs').textContent = srsMsg;
  $('fb').classList.add('show');
  refreshStats();
}
function addDays(ds,n){ const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function finish(){
  // streak day bookkeeping
  const t=today();
  if(G.db.lastDay!==t){ const y=addDays(t,-1); G.db.streak = (G.db.lastDay===y? (G.db.streak||0)+1 : 1); G.db.lastDay=t; saveDB(); }
  $('stage').innerHTML='';
  $('r-title').textContent = G.mode==='practice' ? '연습 한 바퀴 완료' : '학습 세트 완료';
  $('r-score').textContent = G.sCorrect+' / '+G.sSeen;
  $('r-correct').textContent=G.sCorrect; $('r-wrong').textContent=G.sWrong; $('r-streak').textContent=G.sBest;
  // due buckets after this session
  const t2=today(); const b3=addDays(t2,3),b7=addDays(t2,7),b30=addDays(t2,30);
  let n3=0,n7=0,n30=0,nk=0;
  for(const b of BANK){ const c=G.db.cards[b.id]; if(!c||!c.due) continue; if(c.due<=b3)n3++; else if(c.due<=b7)n7++; else if(c.due<=b30)n30++; else nk++; }
  $('r-buckets').innerHTML = `예정 복습 — <b style="color:var(--el)">3일 내 ${n3}</b> · 7일 내 ${n7} · 한 달 내 ${n30} · 유지(30일+) ${nk}`;
  $('result').classList.add('show');
  $('prog').style.width='100%';
  refreshStats();
  if(G.hub){ G.hub=false; const rb=$('r-buckets'); if(rb) rb.innerHTML+=' <span style="color:var(--gold)">· 통합 세션 — 다음 도구로 넘어갑니다…</span>'; setTimeout(function(){ try{ window.HubSession&&HubSession.next(); }catch(e){} },1400); }
}

/* ============== ui glue ============== */
function buildCats(){
  const wrap=$('cats');
  CATS.forEach(c=>{
    const cc=getComputedStyle(document.documentElement).getPropertyValue(c.v).trim();
    const n=BANK.filter(b=>b.cat===c.key).length;
    const el=document.createElement('button');
    el.className='cat on'; el.style.setProperty('--cc',cc); el.dataset.key=c.key;
    el.innerHTML=`<span class="dot"></span>${c.label}<span class="n">${n}</span>`;
    el.onclick=()=>{ if(G.active.has(c.key)){ if(G.active.size>1){G.active.delete(c.key); el.classList.remove('on');} } else { G.active.add(c.key); el.classList.add('on'); } refreshStats(); };
    wrap.appendChild(el);
  });
}
function refreshStats(){ $('s-due').textContent=dueCount(); $('s-streak').textContent=G.db.streak||0; }
function updateProg(){ const done=G.sSeen, total=Math.max(1,G.sTotal); $('prog').style.width=Math.min(100,Math.round(done/total*100))+'%'; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }

function doExport(){
  const blob=new Blob([JSON.stringify(G.db,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='경락기능_진도.json'; a.click(); URL.revokeObjectURL(a.href);
  toast('진도를 내려받았습니다');
}
function doImport(file){ const r=new FileReader(); r.onload=()=>{ try{ const o=JSON.parse(r.result); G.db=Object.assign({cards:{},log:{},streak:0,lastDay:null},o); saveDB(); refreshStats(); toast('진도를 불러왔습니다'); }catch(e){ toast('파일을 읽을 수 없습니다'); } }; r.readAsText(file); }

function showStorage(){
  const el=$('storage');
  if(storageOK){ el.style.color='var(--paper-faint)'; el.innerHTML='● 자동 저장 켜짐 — 복습 일정이 이 브라우저에 저장됩니다.'; }
  else{ el.style.color='#e0a35a'; el.innerHTML='⚠ 이 브라우저는 자동 저장이 막혀 있습니다 — 진도 내보내기/불러오기를 쓰세요.'; }
}

/* ============== init ============== */
function init(){
  storageOK=probeStorage();
  loadDB();
  buildCats();
  showStorage();
  refreshStats();
  $('btn-start').onclick=()=>start('today');
  $('btn-review').onclick=()=>start('review');
  $('btn-practice').onclick=()=>start('practice');
  $('r-again').onclick=()=>start(G.mode==='practice'?'practice':'today');
  $('r-reset-session').onclick=()=>start(G.mode);
  $('btn-export').onclick=doExport;
  $('btn-import').onclick=()=>$('file-import').click();
  $('file-import').onchange=e=>{ if(e.target.files[0]) doImport(e.target.files[0]); e.target.value=''; };
  $('btn-wipe').onclick=()=>{ if(confirm('모든 진도(복습 일정·기록)를 지울까요?')){ G.db={cards:{},log:{},streak:0,lastDay:null}; saveDB(); refreshStats(); toast('초기화했습니다'); $('result').classList.remove('show'); $('stage').innerHTML=''; } };
  document.addEventListener('keydown',e=>{
    if(['1','2','3','4','5'].includes(e.key)){ const opts=$('opts')&&$('opts').querySelectorAll('.opt'); if(opts&&opts[+e.key-1]&&!G.answered) opts[+e.key-1].click(); }
    if((e.key==='Enter'||e.key===' ')&&G.answered){ e.preventDefault(); const n=$('btn-next'); if(n)n.click(); }
  });
  window.addEventListener('pagehide', saveDB);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') saveDB(); });
}
init();

try{if(window.__focusDrill&&window.__focusDrill.tool==='baesurule'){start('review');}}catch(e){}
})();</script>

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1500);}

const GROUPS=[
 {k:'독맥',label:'督脈',m:"도(陶道)미노 대추(大椎) 두 알에 아문(啞門) 말없이 풍(風府)덩, 뇌(腦戶)리에 백(百會) 불 켜지자 신(神庭)나게 수(水溝)구치며 은(齦交)밀히 모였다.",
  rows:[["陶道","도도"],["大椎","대추"],["啞門","아문"],["風府","풍부"],["腦戶","뇌호"],["百會","백회"],["神庭","신정"],["水溝","수구"],["齦交","은교"]]},
 {k:'임맥',label:'任脈',m:"회음(會陰)악 듣던 곡(曲骨)소리에 중극(中極)장 관(關元)객이 음(陰交)침하게 하(下脘)품하며 중(中脘)얼대다, 상(上脘)가서 천(天突)천히 염(廉泉)불하고 승(承漿)천했다.",
  rows:[["會陰","회음"],["曲骨","곡골"],["中極","중극"],["關元","관원"],["陰交","음교"],["下脘","하완"],["中脘","중완"],["上脘","상완"],["天突","천돌"],["廉泉","염천"],["承漿","승장"]]},
 {k:'폐심포',label:'肺·心包',m:"가슴 중부(中府) 지방에 천지(天池)가 열렸다.",
  rows:[["中府","중부"],["天池","천지"]]},
 {k:'대장',label:'大腸',m:"비(臂臑)틀대던 견우(肩髃)가 거골(巨骨) 지고 영향(迎香)력 행사했다.",
  rows:[["臂臑","비노"],["肩髃","견우"],["巨骨","거골"],["迎香","영향"]]},
 {k:'소장',label:'小腸',m:"노(臑俞) 젓는 병풍(秉風) 뒤, 권(顴髎)법으로 청궁(聽宮)을 지켰다.",
  rows:[["臑俞","노유"],["秉風","병풍"],["顴髎","권료"],["聽宮","청궁"]]},
 {k:'삼초',label:'三焦',m:"천(天髎)막 아래 예(翳風)리한 각(角孫)이 화(和髎)목하게 굴었다.",
  rows:[["天髎","천료"],["翳風","예풍"],["角孫","각손"],["和髎","화료"]]},
 {k:'위',label:'胃',m:"승(承泣)객이 거(巨髎)대한 지(地倉)고를 열고, 하(下關)역서 두(頭維)건 쓰고 기(氣衝)차에 올랐다.",
  rows:[["承泣","승읍"],["巨髎","거료"],["地倉","지창"],["下關","하관"],["頭維","두유"],["氣衝","기충"]]},
 {k:'비',label:'脾',m:"삼음교(三陰交) 길목서 충(衝門)격받은 부(府舍)자가 대(大橫)문 앞에서 복(腹哀)받쳤다.",
  rows:[["三陰交","삼음교"],["衝門","충문"],["府舍","부사"],["大橫","대횡"],["腹哀","복애"]]},
 {k:'신',label:'腎',m:"횡(橫骨)단보도서 대혁(大赫)이 기(氣穴)합 넣어, 사만(四滿)원 중주(中注) 들고 황(肓俞)금빛 상곡(商曲) 언덕의 석관(石關)을 열자 음도(陰都)가 나와 복통(腹通谷) 끝 유문(幽門)이 닫혔다. — 발목엔 조(照海)·교(交信)·축(築賓)이 마저 모였다.",
  rows:[["橫骨","횡골"],["大赫","대혁"],["氣穴","기혈"],["四滿","사만"],["中注","중주"],["肓俞","황수"],["商曲","상곡"],["石關","석관"],["陰都","음도"],["腹通谷","복통곡"],["幽門","유문"],["照海","조해"],["交信","교신"],["築賓","축빈"]]},
 {k:'방광',label:'膀胱',m:"정(睛明)문에 대저(大杼)울 걸고 풍(風門)선 막은 뒤, 부(附分)족함 없이 신(申脈)나게 복(僕參)습하다 금(金門)고리 열고 부(跗陽)리나케 솟았다.",
  rows:[["睛明","정명"],["大杼","대저"],["風門","풍문"],["附分","부분"],["申脈","신맥"],["僕參","복삼"],["金門","금문"],["跗陽","부양"]]},
 {k:'담측두',label:'膽·측두',m:"동자(瞳子髎)야 상관(上關)없다며 함(頷厭)부로 현(懸厘)관 지나, 곡(曲鬢)예서 솔(率谷)직히 완(完骨)강하게 버텼다.",
  rows:[["瞳子髎","동자료"],["上關","상관"],["頷厭","함염"],["懸厘","현리"],["曲鬢","곡빈"],["率谷","솔곡"],["完骨","완골"]]},
 {k:'담머리',label:'膽·머리위',m:"본(本神)부서 양백(陽白)이 임읍(頭臨泣) 애를 목창(目窗)에 두니, 정영(正營)이 승령(承靈)하려다 뇌(腦空)가 공허해 풍(風池)비박산.",
  rows:[["本神","본신"],["陽白","양백"],["頭臨泣","두임읍"],["目窗","목창"],["正營","정영"],["承靈","승령"],["腦空","뇌공"],["風池","풍지"]]},
 {k:'담몸통',label:'膽·몸통',m:"견정(肩井) 우물에 일월(日月)이 비치고, 대(帶脈)띠 두른 오(五樞)층 유도(維道)부서 거(居髎)인이 환(環跳)호했다.",
  rows:[["肩井","견정"],["日月","일월"],["帶脈","대맥"],["五樞","오추"],["維道","유도"],["居髎","거료"],["環跳","환도"]]},
 {k:'간',label:'肝',m:"옆구리 장문(章門) 열고 기문(期門) 닫았다.",
  rows:[["章門","장문"],["期門","기문"]]},
];

const LS='jiaohoe_cloze_v1';
function loadDone(){ try{const o=JSON.parse(localStorage.getItem(LS));return new Set(o&&o.done||[]);}catch(e){return new Set();} }
function saveDone(){ try{localStorage.setItem(LS,JSON.stringify({done:[...done]}));}catch(e){} }
let done=loadDone();

function parseM(m){
  const parts=[], answers=[]; let re=/\(([^)]+)\)/g, last=0, mm;
  while((mm=re.exec(m))){
    parts.push({text:m.slice(last,mm.index)});
    parts.push({blank:true, idx:answers.length, ans:mm[1]});
    answers.push(mm[1]); last=mm.index+mm[0].length;
  }
  parts.push({text:m.slice(last)});
  return {parts, answers};
}

let gi=0, parsed=null, filled=[], active=0, miss=0, pool=[], dokmap={};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildGbar(){
  const bar=$('gbar'); bar.innerHTML='';
  GROUPS.forEach((g,i)=>{
    const b=document.createElement('button'); b.className='gchip'+(i===gi?' on':'')+(done.has(g.k)?' done':'');
    b.innerHTML='<span class="han">'+g.label+'</span><span class="n">'+g.rows.length+'</span>'+(done.has(g.k)?'<span class="ck">✓</span>':'');
    b.onclick=()=>{ gi=i; loadGroup(); };
    bar.appendChild(b);
  });
  $('p-done').textContent=done.size;
}
function loadGroup(){
  const g=GROUPS[gi];
  parsed=parseM(g.m);
  filled=parsed.answers.map(()=>null);
  active=0; miss=0;
  dokmap={}; g.rows.forEach(r=>dokmap[r[0]]=r[1]);
  pool=shuffle(parsed.answers.slice());
  $('gtitle').innerHTML=g.label+' <small>'+parsed.answers.length+'혈 · 유주 순서</small>';
  $('p-tot').textContent=parsed.answers.length;
  $('done-banner').classList.remove('on');
  buildGbar(); renderSentence(); renderPool(); updateFill();
}
function firstEmpty(){ for(let i=0;i<filled.length;i++) if(!filled[i]) return i; return -1; }
function renderSentence(){
  const s=$('sentence'); s.innerHTML='';
  parsed.parts.forEach(p=>{
    if(p.text!==undefined){ const sp=document.createElement('span'); sp.className='cue'; sp.textContent=p.text; s.appendChild(sp); }
    else{
      const b=document.createElement('span'); b.className='blank'; b.dataset.i=p.idx;
      if(filled[p.idx]){ b.classList.add('filled'); b.textContent=filled[p.idx]; }
      else { b.innerHTML='<span class="num">'+(p.idx+1)+'</span>'; if(p.idx===active) b.classList.add('active'); }
      s.appendChild(b);
    }
  });
}
function renderPool(){
  const pl=$('pool'); pl.innerHTML='';
  const remaining=pool.filter(h=>!filled.includes(h));
  if(!remaining.length){ pl.innerHTML='<div class="pool-empty">모든 혈명을 채웠습니다.</div>'; return; }
  remaining.forEach(h=>{
    const b=document.createElement('button'); b.className='pchip';
    b.innerHTML='<span class="ph">'+h+'</span><span class="pd">'+(dokmap[h]||'')+'</span>';
    b.onclick=()=>tapChip(h,b);
    pl.appendChild(b);
  });
}
function updateFill(){ $('p-fill').textContent=filled.filter(Boolean).length; }
function tapChip(h,btn){
  if(active<0) return;
  if(parsed.answers[active]===h){
    filled[active]=h;
    const nx=firstEmpty(); active=nx;
    renderSentence(); renderPool(); updateFill();
    const ab=document.querySelector('.blank[data-i="'+(nx)+'"]'); if(ab) ab.scrollIntoView({block:'nearest'});
    if(nx<0) finishGroup();
  } else {
    miss++;
    const ab=document.querySelector('.blank.active');
    if(ab){ ab.classList.add('shake'); setTimeout(()=>ab.classList.remove('shake'),300); }
    if(btn){ btn.style.borderColor='var(--bad)'; setTimeout(()=>btn.style.borderColor='',300); }
    const need=GROUPS[gi].rows.find(r=>r[0]===parsed.answers[active]);
    toast('순서상 이번 칸은 "'+(need?need[1]:'')+'"');
  }
}
function hintActive(){
  if(active<0) return;
  const ab=document.querySelector('.blank.active'); if(!ab) return;
  const dok=dokmap[parsed.answers[active]]||'';
  ab.classList.add('hintdok'); ab.textContent=dok;
  setTimeout(()=>{ if(!filled[active]){ ab.classList.remove('hintdok'); ab.innerHTML='<span class="num">'+(active+1)+'</span>'; } },1400);
  miss+=0.5;
}
function revealGroup(){
  filled=parsed.answers.slice(); active=-1;
  renderSentence(); renderPool(); updateFill();
  $('done-banner').classList.remove('on');
  toast('정답을 표시했습니다 — "다시"로 연습하세요');
}
function finishGroup(){
  const g=GROUPS[gi]; done.add(g.k); saveDone();
  const total=parsed.answers.length+miss;
  const acc=total?Math.round(parsed.answers.length/total*100):100;
  $('done-msg').textContent='첫 시도 정확도 '+acc+'%  ·  '+g.label+' '+parsed.answers.length+'혈';
  $('done-banner').classList.add('on');
  buildGbar();
}
function nextGroup(){ gi=(gi+1)%GROUPS.length; loadGroup(); }

$('btn-hint').onclick=hintActive;
$('btn-reveal').onclick=revealGroup;
$('btn-reset').onclick=loadGroup;
$('btn-next').onclick=nextGroup;
loadGroup();

})();</script>

<div class="wrap">
  <div class="kicker">經絡 발전사 · 연표 배치</div>
  <h1>저서를 시대에 놓다<span class="sub">先秦·漢 → 晉 → 唐 → 宋 → 元 → 明 → 淸 연표에 의가·저서를 배치</span></h1>
  <p class="lede">아래 카드를 탭해 고른 뒤, <b>어느 시대</b>의 저서인지 그 띠를 탭하세요. 혈수가 있는 책엔 <b>배지</b>가 붙어, 연표를 따라 혈수 변천(349→354→359→361)이 보입니다.</p>

  <div class="bar">
    <div class="seg" id="mode-seg"><button data-mode="play" class="on">배치 연습</button><button data-mode="study">학습(정답)</button></div>
    <button class="cbtn" id="btn-reveal">정답 보기</button>
    <button class="cbtn" id="btn-reset">다시 섞기</button>
    <span class="grow"></span>
    <span class="pill">놓음 <b id="p-done">0</b>/<b id="p-tot">0</b> · 실수 <b id="p-miss">0</b></span>
  </div>
  <div class="status" id="status">카드를 고른 뒤, 해당 <b>시대 띠</b>를 누르세요.</div>

  <div class="timeline" id="timeline"></div>

  <div class="done-banner" id="done-banner"><span class="t">✓ 연표 완성</span><span class="s" id="done-msg"></span></div>

  <div class="tray-wrap" id="tray-wrap">
    <div class="tray-lab">저서 카드 — 탭하여 선택</div>

      const item=cols[c.k][r]; const id=c.k+'_'+r;
      const cell=document.createElement('div'); cell.className='cell'; cell.dataset.id=id; cell.dataset.col=c.k;
      cell.textContent=item.val; cellData[id]={col:c.k,val:item.val};

function mk(cls,txt){const d=document.createElement('div');d.className=cls;d.textContent=txt;return d;}

  sel=i;
  document.querySelectorAll('.cell.pers').forEach(p=>p.classList.toggle('sel',+p.dataset.p===i));
  // color the persona cell with its accent
  document.querySelectorAll('.cell.pers').forEach(p=>{ if(p.classList.contains('mine')) {} });
  setStatus();
}
function tapAttr(cell){
  const id=cell.dataset.id;
  if(linked[id]!=null) return;                 // already linked
  if(sel==null){ toast('먼저 醫家를 선택하세요'); return; }
  const need=ROWS[sel][cell.dataset.col];
  if(cellData[id].val===need){
    linked[id]=sel;
    cell.classList.add('linked'); cell.style.background=ROWS[sel].c; cell.style.color='#16120b';
    // tint the selected persona cell too
    const pc=document.querySelector('.cell.pers[data-p="'+sel+'"]'); pc.classList.add('linked'); pc.style.background=ROWS[sel].c; pc.style.color='#16120b';
    checkDone();
  } else {
    miss++; $('p-miss').textContent=miss;

  }

function colName(k){ return ({book:'著書',cnt:'穴數',era:'時代',feat:'業績'})[k]; }

function checkDone(){

    const total=ROWS.length*COLS.length+miss;
    const acc=Math.round(ROWS.length*COLS.length/total*100);
    $('done-msg').textContent='첫 시도 정확도 '+acc+'%  ·  6의가 × 4속성 = 24연결';
    $('done-banner').classList.add('on'); try{window.HubTrack&&HubTrack.report({done:ROWS.length,total:ROWS.length,acc:acc});}catch(e){}
  }
}

  if(sel==null){ $('status').innerHTML='먼저 <b>의가</b>를 선택하세요.'; return; }
  const r=ROWS[sel]; const remain=COLS.filter(c=>!Object.keys(linked).some(id=>id.indexOf(c.k+'_')===0 && linked[id]===sel)).map(c=>c.h);
  $('status').innerHTML='선택: <b>'+r.p+'</b> — '+(remain.length? '남은 연결: '+remain.join(' · ') : '이 의가 완성! 다른 의가를 선택하세요.');
}
function revealAll(){
  document.querySelectorAll('.cell[data-id]').forEach(cell=>{
    const id=cell.dataset.id; if(linked[id]!=null) return;
    const owner=ROWS.findIndex(r=>r[cell.dataset.col]===cellData[id].val && !ownerUsed(cell.dataset.col,r));
    // assign by value to first matching persona not yet filled in this column
    const idx=firstUnfilled(cell.dataset.col,cellData[id].val);
    if(idx>=0){ linked[id]=idx; cell.classList.add('linked'); cell.style.background=ROWS[idx].c; cell.style.color='#16120b';
      const pc=document.querySelector('.cell.pers[data-p="'+idx+'"]'); pc.classList.add('linked'); pc.style.background=ROWS[idx].c; pc.style.color='#16120b'; }
  });
  checkDone(); toast('정답을 표시했습니다');
}
function firstUnfilled(col,val){
  for(let i=0;i<ROWS.length;i++){ if(ROWS[i][col]===val && linked[col+'_'+i]!==i){ // need a cell for persona i not yet linked
      // is persona i already linked in this col?
      const already=Object.keys(linked).some(k=>k.startsWith(col+'_') && linked[k]===i);

}

}

})();</script>

 {clue:'陽脈之海 (諸陽 統率)', ans:'督脈', no:'任脈', note:'督=양맥지해. 任=음맥지해.'},
 {clue:'陰脈之海', ans:'任脈', no:'督脈', note:'任=음맥지해. 督=양맥지해.'},

 {clue:'別行의 正經 · 六合', ans:'十二經別', no:'十五絡脈', note:'경별=別行정경. 낙맥=別絡.'},
];

let queue=[], idx=0, correct=0, miss=0, streak=0, best=0, solved=new Set(), locked=false;
const TOTAL=ITEMS.length;

function start(){
  queue=shuffle(ITEMS.map((_,i)=>i));
  idx=0; correct=0; miss=0; streak=0; best=0; solved=new Set(); locked=false;
  $('total').textContent=TOTAL; $('best').textContent=0;
  $('done').classList.remove('on'); $('stage').style.display='';
  render();
  updateHud();
}
function render(){
  if(!$('stage')) return;
  locked=false;
  const it=ITEMS[queue[idx]];
  $('card').className='card';
  $('clue').innerHTML=it.clue + (it.sm?'<span class="sm">'+it.sm+'</span>':'');
  // randomize left/right
  const ansLeft=Math.random()<0.5;
  const L=ansLeft?it.ans:it.no, R=ansLeft?it.no:it.ans;
  $('optL-t').textContent=L; $('optR-t').textContent=R;
  $('optL').dataset.correct=(L===it.ans); $('optR').dataset.correct=(R===it.ans);
  $('optL').className='opt'; $('optR').className='opt';
  $('note').textContent=''; $('tagL').style.opacity=0; $('tagR').style.opacity=0;
}
function answer(side){ // 'L' or 'R'
  if(locked||!$('card')) return; locked=true;
  const it=ITEMS[queue[idx]];
  const chosen=$('opt'+side), other=$('opt'+(side==='L'?'R':'L'));
  const right=chosen.dataset.correct==='true';
  const card=$('card');
  if(right){
    chosen.classList.add('pick-ok'); card.classList.add('good',side==='L'?'flyL':'flyR');
    if(!solved.has(queue[idx])){ solved.add(queue[idx]); correct++; }
    streak++; best=Math.max(best,streak);
  } else {
    chosen.classList.add('pick-bad'); other.classList.add('pick-ans'); card.classList.add('wrong');
    $('note').innerHTML='정답: <b>'+it.ans+'</b> — '+it.note;
    miss++; streak=0;
    queue.push(queue[idx]);   // re-queue wrong item
  }
  updateHud();
  setTimeout(()=>{
    if(!$('stage')) return;
    idx++;
    if(solved.size>=TOTAL){ finish(); return; }
    if(idx>=queue.length){ finish(); return; }
    render();
  }, right?260:1250);
}
function updateHud(){
  $('streak').textContent=streak; $('best').textContent=best;
  $('correct').textContent=correct;
  const ans=correct+miss; $('acc').textContent=ans?Math.round(correct/ans*100):100;
  $('pfill').style.width=Math.round(solved.size/TOTAL*100)+'%';
}
function finish(){
  $('stage').style.display='none'; $('done').classList.add('on');
  const ans=correct+miss, acc=ans?Math.round(correct/ans*100):100; try{window.HubTrack&&HubTrack.report({done:correct,total:TOTAL,acc:acc});}catch(e){}
  $('done-msg').innerHTML=TOTAL+'개 변별 완료 · 정확도 <b>'+acc+'%</b> · 최고 연속 <b>'+best+'</b>';
}

// swipe
let sx=0,sdx=0,drag=false;
const card=$('card');
card.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sdx=0;card.style.transition='none';});
window.addEventListener('pointermove',e=>{ if(!drag)return; sdx=e.clientX-sx; card.style.transform='translateX('+sdx+'px) rotate('+(sdx/22)+'deg)';

window.addEventListener('pointerup',()=>{ if(!drag)return; drag=false; card.style.transition='';

document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft')answer('L'); else if(e.key==='ArrowRight')answer('R'); });

$('optL').onclick=()=>answer('L');
$('optR').onclick=()=>answer('R');
$('btn-reset').onclick=start;
$('btn-again').onclick=start;
start();

const ELALL=["木","火","土","金","水"];
const $=id=>document.getElementById(id);
const POS={'木':[180,60],'火':[294,143],'土':[250,277],'金':[110,277],'水':[66,143]};
const SHENG=[['木','火'],['火','土'],['土','金'],['金','水'],['水','木']];
const KE=[['木','土'],['土','水'],['水','火'],['火','金'],['金','木']];
const ELNAME={'木':'木(목)','火':'火(화)','土':'土(토)','金':'金(금)','水':'水(수)'};
let mode='mix', G={score:0,streak:0}, cur=null, step=0, perfect=true;

function buildWheel(){
  let h='';
  function line(cls,a,b){const[x1,y1]=POS[a],[x2,y2]=POS[b];return '<line class="relline '+cls+'" data-a="'+a+'" data-b="'+b+'" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/>';}
  SHENG.forEach(([a,b])=>h+=line('sheng',a,b));
  KE.forEach(([a,b])=>h+=line('ke',a,b));
  ELALL.forEach(e=>{ if(!POS[e])return; const[x,y]=POS[e];
    h+='<g class="node" data-el="'+e+'"><circle class="node-c" cx="'+x+'" cy="'+y+'" r="30"/><text class="node-t" x="'+x+'" y="'+y+'">'+e+'</text></g>';
  });
  $('wheel').innerHTML=h;
  $('wheel').querySelectorAll('.node').forEach(n=>n.addEventListener('click',()=>pick(n.dataset.el,n)));
}
function clearMarks(){ $('wheel').querySelectorAll('.node').forEach(n=>n.classList.remove('me','good','bad'));
  $('wheel').querySelectorAll('.relline').forEach(l=>l.classList.remove('hot')); }
function markMe(){ const n=$('wheel').querySelector('.node[data-el="'+cur.s.el+'"]'); if(n)n.classList.add('me'); }
function hotRel(kind){ const s=cur.s;
  let want=null;
  if(kind==='mother') want=['sheng',s.mo,s.el];
  else if(kind==='officer') want=['ke',s.of,s.el];
  else if(kind==='child') want=['sheng',s.el,s.ch];
  if(!want) return;
  $('wheel').querySelectorAll('.relline.'+want[0]).forEach(l=>{ if(l.dataset.a===want[1]&&l.dataset.b===want[2]) l.classList.add('hot'); });
}

function ctxOf(s, m){
  if(m==='jeong') return {label:'正格 (補法·虛證)',
    steps:[{action:'補',rel:'母 (生我)',desc:'나(我)를 生하는 오행',want:s.mo,hot:'mother'},
           {action:'瀉',rel:'官 (克我)',desc:'나(我)를 克하는 오행',want:s.of,hot:'officer'}],
    reveal:{kind:'bs',bo:s.jbo,sa:s.jsa,boEl:s.mo+'경혈',saEl:s.of+'경혈',
      rule:'正格 = 補母('+s.mo+') + 瀉官('+s.of+'). 각 짝 = 自經穴 + 該行經 本穴.'}};
  if(m==='seung') return {label:'勝格 (瀉法·實證)',
    steps:[{action:'補',rel:'官 (克我)',desc:'나(我)를 克하는 오행',want:s.of,hot:'officer'},
           {action:'瀉',rel:'子 (我生)',desc:'내(我)가 生하는 오행',want:s.ch,hot:'child'}],
    reveal:{kind:'bs',bo:s.sbo,sa:s.ssa,boEl:s.of+'경혈',saEl:s.ch+'경혈',
      rule:'勝格 = 補官('+s.of+') + 瀉子('+s.ch+'). 官혈은 正格의 瀉와 동일(役만 반대).'}};
  if(m==='han') return {label:'寒熱補瀉 · 寒證 (데움)',
    steps:[{action:'補',rel:'火',desc:'寒證은 火로 데운다',want:'火',hot:null},
           {action:'瀉',rel:'水',desc:'水를 덜어낸다',want:'水',hot:null}],
    reveal:{kind:'bs',bo:s.hb,sa:s.hs,boEl:'火穴',saEl:'水穴',
      rule:'寒證 = 補火 + 瀉水(데움). 熱證은 반대 — 補水(식힘), 瀉는 특이배합. (寒瀉=熱補)'}};
  // juu (主客)
  return {label:'主客 原絡補瀉',
    steps:[{action:'',rel:'表裏經의 오행',desc:'表裏는 同一 오행',want:s.el,hot:'me'}],
    reveal:{kind:'juu',ju:s.ju,gaek:s.gaek,k:s.k,py:s.py,
      rule:'主=本經('+s.k+') 原穴, 客=表裏經('+s.py+') 絡穴. 表裏經은 本經과 同一 오행(음양만 반대).'}};
}
function poolModes(){ return mode==='mix' ? ['jeong','seung','juu','han'] : [mode]; }
function nextRound(){
  $('reveal').classList.remove('show'); $('next').classList.remove('show'); $('fb').textContent=''; $('fb').className='fb';
  const s=SAAMF[Math.floor(Math.random()*SAAMF.length)];
  const ms=poolModes(); const m=ms[Math.floor(Math.random()*ms.length)];
  cur={s, m, ctx:ctxOf(s,m)}; step=0; perfect=true;
  clearMarks(); markMe();
  renderAsk();
}
function renderAsk(){
  if(!$('pmer')) return;
  const s=cur.s, st=cur.ctx.steps[step];
  $('pmer').innerHTML=s.k+' <span class="el">('+s.el+')</span>';
  $('pgrade').textContent=s.name+' — '+cur.ctx.label;
  // hot line for this step
  $('wheel').querySelectorAll('.relline').forEach(l=>l.classList.remove('hot'));
  if(st.hot) hotRel(st.hot);
  const verb = st.action ? (st.action+'할 ') : '';
  $('pask').innerHTML=verb+'<span class="rel">'+st.rel+'</span>을(를) 고르세요 <span style="color:var(--faint)">('+st.desc+')</span>';
  if(cur.ctx.steps.length>1) $('stepi').textContent='단계 '+(step+1)+' / '+cur.ctx.steps.length+'   ·   我 = '+s.el;
  else $('stepi').textContent='我 = '+s.el+'   ·   表裏經과 同一 오행';
}
function pick(el,node){
  if($('next').classList.contains('show')) return;
  const st=cur.ctx.steps[step];
  if(el===st.want){
    node.classList.remove('bad'); node.classList.add('good');
    if(step<cur.ctx.steps.length-1){ step++; setTimeout(renderAsk,250); }
    else doReveal();
  } else {
    perfect=false; node.classList.add('bad'); $('wheel').classList.add('shake');
    setTimeout(()=>{const wh=$('wheel');if(wh)wh.classList.remove('shake');node.classList.remove('bad');},340);
    $('fb').textContent='다시 — '+ELNAME[st.want]+' 를 보세요'; $('fb').className='fb b';
  }
}
function ptsHtml(pair){ return pair.map(p=>p[0]).join('·'); }
function doReveal(){
  const r=cur.ctx.reveal, s=cur.s;
  let html='<div class="rv-h">'+s.k+'('+s.el+') · '+cur.ctx.label.split(' ')[0]+' 도출</div>';
  if(r.kind==='bs'){
    html+='<div class="rv-row"><span class="rv-tag bo">補</span><span class="rv-pts">'+ptsHtml(r.bo)+'</span><span class="rv-el">'+r.boEl+'</span></div>';
    html+='<div class="rv-row"><span class="rv-tag sa">瀉</span><span class="rv-pts">'+ptsHtml(r.sa)+'</span><span class="rv-el">'+r.saEl+'</span></div>';
  } else { // juu
    html+='<div class="rv-row"><span class="rv-tag neu">主</span><span class="rv-pts">'+ptsHtml(r.ju)+'</span><span class="rv-el">'+r.k+' 原穴</span></div>';
    html+='<div class="rv-row"><span class="rv-tag neu">客</span><span class="rv-pts">'+ptsHtml(r.gaek)+'</span><span class="rv-el">'+r.py+' 絡穴</span></div>';
  }
  html+='<div class="rv-note">'+r.rule+'</div>';
  $('reveal').innerHTML=html; $('reveal').classList.add('show'); $('next').classList.add('show');
  if(perfect){ G.score++; G.streak++; $('fb').textContent='정확합니다'; $('fb').className='fb g'; }
  else { G.streak=0; $('fb').textContent='도출 완료'; $('fb').className='fb'; }
  $('score').textContent=G.score; $('streak').textContent=G.streak;
}
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.mode').forEach(x=>x.classList.remove('on')); b.classList.add('on'); mode=b.dataset.m; nextRound();
}));
$('next').addEventListener('click',nextRound);
buildWheel(); nextRound();
})();</script>

.ttl small{display:block;font-size:12px;color:var(--mut);font-family:var(--sans);margin-top:2px}
.stat{font-family:var(--mono);font-size:13px;color:var(--ink2);text-align:right;line-height:1.5}
.stat b{color:var(--gold)}
.modes{display:flex;gap:6px;margin-bottom:14px}
.mode{flex:1;appearance:none;border:1px solid var(--line2);background:var(--panel);color:var(--ink2);
border-radius:9px;padding:8px;font-size:14px;cursor:pointer;font-family:var(--sans)}
.mode.on{border-color:var(--gold);color:var(--gold);background:var(--panel2)}
.mhead{text-align:center;font-family:var(--serif);font-size:23px;color:var(--ink);margin-bottom:3px}
.mhead .el{color:var(--gold);font-size:16px}
.msub{text-align:center;font-size:13px;color:var(--mut);margin-bottom:13px}
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin-bottom:14px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 10px}
.card.src{opacity:.96}
.card.tgt{border-color:var(--line2)}
.card-h{font-family:var(--serif);font-size:14px;color:var(--gold);text-align:center;margin-bottom:9px}
.slot{border:1px solid var(--line2);border-radius:9px;padding:9px 6px;margin:7px 0;text-align:center;min-height:46px;display:flex;flex-direction:column;justify-content:center}
.slot .lab{font-family:var(--mono);font-size:11px;margin-bottom:3px}
.slot.bo .lab{color:#8fbf9b}.slot.sa .lab{color:#d79a82}
.slot .val{font-family:var(--serif);font-size:18px;color:var(--ink)}
.slot.empty{cursor:pointer;border-style:dashed;color:var(--faint)}
.slot.empty .val{color:var(--faint);font-size:14px}
.slot.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(203,184,126,.18)}
.slot.good{border-color:var(--ok);background:#16241a}
.slot.bad{border-color:var(--bad);background:#251510}
.arrow{display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:24px;font-family:var(--serif)}
.mirror-link{font-size:11px;color:var(--faint);text-align:center;margin-top:-6px;margin-bottom:8px}
.poolh{font-size:13px;color:var(--mut);margin-bottom:7px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tile{appearance:none;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:9px;
padding:9px 12px;font-family:var(--serif);font-size:16px;cursor:pointer;transition:.12s}
.tile:hover{border-color:var(--gold)}
.tile.used{opacity:.32;pointer-events:none}
.fb{min-height:18px;text-align:center;font-size:14px;margin-bottom:8px;font-family:var(--serif)}
.fb.g{color:var(--ok)}.fb.b{color:var(--bad)}
.note{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:11px;font-size:13px;
color:var(--mut);line-height:1.6;margin-bottom:12px;display:none}
.note.show{display:block}.note b{color:var(--gold);font-family:var(--serif)}
.row{display:flex;gap:8px}
.btn{appearance:none;border:1px solid var(--line2);background:var(--panel);color:var(--ink2);border-radius:11px;
padding:11px;font-size:15px;cursor:pointer;font-family:var(--sans);flex:1}
.btn.primary{border-color:var(--gold);background:linear-gradient(180deg,#211a10,#181206);color:var(--gold)}
.btn.primary:hover{background:var(--gold);color:#19140d}
.btn.hidden{display:none}
.shake{animation:sh .32s}@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

      slots:[{label:'主 ('+s.k+' 原)',cls:'neutral',cap:1,need:s.ju},{label:'客 ('+s.py+' 絡)',cls:'neutral',cap:1,need:s.gaek}],
      note:'<b>主客 原絡法</b> — 主는 本經('+s.k+') 原穴, 客은 表裏經('+s.py+') 絡穴.'},
    han:{label:'寒熱補瀉 · 寒證', rule:'補火(데움) + 瀉水', sys:'寒證瀉 = 熱證補',
      slots:[{label:'補(火)',cls:'bo',cap:2,need:s.hb},{label:'瀉(水)',cls:'sa',cap:2,need:s.hs}],
      note:'<b>寒熱法 · 寒證</b> — 데움: 火穴 補 + 水穴 瀉. (특이배합은 교재 그대로)'},
    yeol:{label:'寒熱補瀉 · 熱證', rule:'補水(식힘) + 瀉(寒과 반대)', sys:'熱證補 = 寒證瀉',
      slots:[{label:'補(水)',cls:'bo',cap:2,need:s.rb},{label:'瀉',cls:'sa',cap:2,need:s.rs}],
      note:'<b>寒熱法 · 熱證</b> — 식힘: 水穴 補. 瀉는 특이배합(교재 그대로).'},
  };
  return m[ctx];
}
const MODES={all:['za_heo','za_sil','jeong','seung','juu','han','yeol'],
  za:['za_heo','za_sil'], js:['jeong','seung'], ju:['juu'], han:['han','yeol']};

let mode='all', G={score:0,streak:0}, cur=null, slots=[], active=0, perfect=true, done=false;

function meridianPts(s){ const set={}; ['za_bo','za_sa','ju','gaek','jbo','jsa','sbo','ssa','hb','hs','rb','rs'].forEach(key=>s[key].forEach(p=>set[p[0]]=p)); return set; }
const GLOBAL={}; SAAMF.forEach(s=>Object.assign(GLOBAL, meridianPts(s)));

function newRound(){
  done=false; perfect=true; active=0;
  $('note').classList.remove('show'); $('next').classList.add('hidden'); $('fb').textContent=''; $('fb').className='fb';
  const s=SAAMF[Math.floor(Math.random()*SAAMF.length)];
  const list=MODES[mode]; const ctx=list[Math.floor(Math.random()*list.length)];
  const c=buildCtx(s,ctx); cur={s,ctx,c};
  slots=c.slots.map(sl=>({label:sl.label,cls:sl.cls,cap:sl.cap,need:sl.need,placed:[]}));
  // header
  const cv=getComputedStyle(document.documentElement).getPropertyValue(ELC[s.el]).trim();
  $('mer').innerHTML=s.k+' <span class="el" style="color:'+cv+';border-color:'+cv+'44">'+s.el+'</span>';
  $('ctx').textContent=c.label; $('full').textContent=s.name;
  $('rule').innerHTML='<span class="k">'+c.rule+'</span><div class="sys">'+c.sys+'</div>';
  buildPool();
  renderSlots();
}
function correctKeys(){ const ks=new Set(); slots.forEach(sl=>sl.need.forEach(p=>ks.add(p[0]))); return ks; }
function buildPool(){
  const ck=correctKeys();
  const correct=[]; slots.forEach(sl=>sl.need.forEach(p=>correct.push(p)));
  // distractors from same meridian, then global
  let pool=Object.values(meridianPts(cur.s)).filter(p=>!ck.has(p[0]));
  pool=shuffle(pool);
  const target=Math.max(8, correct.length+4);
  let distr=pool.slice(0, target-correct.length);
  if(correct.length+distr.length<target){
    const extra=shuffle(Object.values(GLOBAL).filter(p=>!ck.has(p[0])&&!distr.some(d=>d[0]===p[0])));
    distr=distr.concat(extra.slice(0, target-correct.length-distr.length));
  }
  const tiles=shuffle(correct.concat(distr));
  // dedup by han
  const seen=new Set(); const out=[];
  tiles.forEach(p=>{ if(!seen.has(p[0])){seen.add(p[0]);out.push(p);} });
  $('pool')._map={}; out.forEach(p=>$('pool')._map[p[0]]=p);
  $('pool').innerHTML=out.map(p=>'<button class="tile" data-h="'+p[0]+'">'+p[0]+'<span style="font-size:12px;color:var(--mut)"> '+p[1]+'</span></button>').join('');
  $('pool').querySelectorAll('.tile').forEach(t=>t.addEventListener('click',()=>placeTile(t.dataset.h)));
}
function firstOpen(){ for(let i=0;i<slots.length;i++){ if(slots[i].placed.length<slots[i].cap) return i; } return -1; }
function tileUsed(h){ return slots.some(sl=>sl.placed.some(p=>p[0]===h)); }
function placeTile(h){
  if(done) return;
  const i=active<slots.length && slots[active].placed.length<slots[active].cap ? active : firstOpen();
  if(i<0) return;
  if(tileUsed(h)) return;
  slots[i].placed.push($('pool')._map[h]);
  if(slots[i].placed.length>=slots[i].cap){ const nx=firstOpen(); active = nx<0? i : nx; }
  renderSlots(); syncPool();
  if(firstOpen()<0) check();
}
function removeChip(si,ci){
  if(done) return;
  slots[si].placed.splice(ci,1); active=si;  
  slots.forEach(sl=>sl._bad=false);
  renderSlots(); syncPool();
}
function syncPool(){ $('pool').querySelectorAll('.tile').forEach(t=>t.classList.toggle('used', tileUsed(t.dataset.h))); }
function renderSlots(){
  $('slots').innerHTML=slots.map((sl,si)=>{
    let pips='';
    for(let k=0;k<sl.cap;k++){
      if(sl.placed[k]) pips+='<div class="pip filled" data-si="'+si+'" data-ci="'+k+'">'+sl.placed[k][0]+'</div>';
      else pips+='<div class="pip">·</div>';
    }
    const cls='slot '+sl.cls+(si===active&&!done?' active':'')+(sl._good?' good':'')+(sl._bad?' bad':'');
    return '<div class="'+cls+'"><div class="slot-h">'+sl.label+'</div><div class="pips">'+pips+'</div></div>';
  }).join('');
  $('slots').querySelectorAll('.pip.filled').forEach(p=>p.addEventListener('click',()=>removeChip(+p.dataset.si,+p.dataset.ci)));
}
function setEq(placed,need){ if(placed.length!==need.length) return false; const a=placed.map(p=>p[0]).sort().join('|'), b=need.map(p=>p[0]).sort().join('|'); return a===b; }
function check(){
  let allOk=true;
  slots.forEach(sl=>{ sl._good=setEq(sl.placed,sl.need); sl._bad=!sl._good; if(!sl._good)allOk=false; });
  if(allOk){
    done=true; slots.forEach(sl=>sl._bad=false);
    if(perfect){G.score++;G.streak++;$('fb').textContent='정확합니다';$('fb').className='fb g';}
    else{G.streak=0;$('fb').textContent='완성';$('fb').className='fb';}
    $('score').textContent=G.score;$('streak').textContent=G.streak;
    let pts=cur.c.slots.map(sl=>pj(sl.need)).join('  /  ');
    $('note').innerHTML=cur.c.note+'<div style="margin-top:6px"><span class="pts">'+pts+'</span></div>';
    $('note').classList.add('show'); $('next').classList.remove('hidden');
    renderSlots();
  } else {
    perfect=false; G.streak=0; $('streak').textContent=0;
    $('fb').textContent='틀린 칸이 있어요 — 빨간 칸을 다시'; $('fb').className='fb b';
    renderSlots();
    const sl=$('slots'); sl.classList.add('shake'); setTimeout(()=>{const x=$('slots');if(x)x.classList.remove('shake');},340);
    setTimeout(()=>{ if(!$('slots'))return; slots.forEach(s2=>{ if(s2._bad){ s2.placed=[]; s2._bad=false; } }); active=firstOpen(); renderSlots(); syncPool(); },680);
  }
}
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.mode').forEach(x=>x.classList.remove('on')); b.classList.add('on'); mode=b.dataset.m; newRound();
}));
$('reset').addEventListener('click',()=>{ if(!done){ slots.forEach(s2=>{s2.placed=[];s2._bad=false;s2._good=false;}); active=0; perfect=false; renderSlots(); syncPool(); } });
$('next').addEventListener('click',newRound);
newRound();
})();</script>

<script type="text/plain" id="src-saamquiz">(function(){

/* ============== question bank ============== */

  {id:'saamH12', cat:'hanyeol', q:'舍岩 寒熱補瀉 — 肝(木)經 寒證의 補·瀉는?', a:'補 行間·少府 / 瀉 陰谷·曲泉', d:['補 少府·魚際 / 瀉 尺澤·陰谷','補 陽谷·解谿 / 瀉 二間·足通谷','補 解谿·陽谷 / 瀉 內庭·足通谷','補 大都·少府 / 瀉 陰陵泉·陰谷'], note:'寒=補火瀉水(데움). 熱證은 補陰谷·曲泉(水)·瀉太衝·太白. 寒瀉=熱補. 특이배합은 교재대로.'}
];

/* ============== SRS engine ============== */
const KEY='saam_bosa_srs_v1';
const INT={1:3,2:7,3:14,4:30,5:60,6:120}; const ST_MAX=6; /* 오답→3일, 처음 맞힘→7일, 이후 성공마다 확장 · 졸업 없음 */
const G={ db:null, queue:[], cur:null, answered:false, mode:'today',
  active:new Set(CATS.map(c=>c.key)),
  sCorrect:0, sWrong:0, sStreak:0, sBest:0, sSeen:0, sTotal:0, sinceMiss:99 };
const $=id=>document.getElementById(id);

function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function probeStorage(){ try{localStorage.setItem('__p','1');const ok=localStorage.getItem('__p')==='1';localStorage.removeItem('__p');return ok;}catch(e){return false;} }
let storageOK=true;
function loadDB(){
  let db={cards:{},streak:0,lastDay:null,log:{}};
  try{ const raw=localStorage.getItem(KEY); if(raw){ const o=JSON.parse(raw); db=Object.assign(db,o); db.cards=o.cards||{}; db.log=o.log||{}; } }catch(e){}
  // prune cards no longer in bank
  const ids=new Set(BANK.map(b=>b.id));
  for(const k of Object.keys(db.cards)) if(!ids.has(k)) delete db.cards[k];
  // 구버전 '졸업'(due=null) 카드 → 유지 단계로 복귀, 7~30일에 분산
  for(const k of Object.keys(db.cards)){ const c=db.cards[k]; if(c && !c.due){ let h=0; for(let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))>>>0; c.st=Math.max(c.st||1,4); c.due=addDays(today(), 7+(h%24)); } }
  G.db=db;
}
function saveDB(){ try{ localStorage.setItem(KEY, JSON.stringify(G.db)); }catch(e){} }

function dueCount(){
  const t=today(); let n=0;
  for(const b of BANK){ if(!G.active.has(b.cat)) continue; const c=G.db.cards[b.id]; if(c && c.due && c.due<=t) n++; }
  return n;
}
function buildQueue(mode){
  const t=today();
  const due=[], fresh=[];
  for(const b of BANK){
    if(!G.active.has(b.cat)) continue;
    const c=G.db.cards[b.id];
    if(c && c.due && c.due<=t) due.push(b.id);
    else if(!c && mode!=='review') fresh.push(b.id);
  }
  shuffle(due); shuffle(fresh);
  let q;
  if(mode==='review') q=due;
  else if(mode==='practice'){ q=BANK.filter(b=>G.active.has(b.cat)).map(b=>b.id); shuffle(q); }
  else {
    const NEW_CAP=12; // 하루 신규 유입 상한
    q=[...due, ...fresh.slice(0,NEW_CAP)];
    if(!q.length){ // 전부 카드화됐고 오늘 기한도 없음 → 기한이 가장 가까운 10장 앞당겨 복습
      const ahead=BANK.filter(b=>G.active.has(b.cat)&&G.db.cards[b.id]&&G.db.cards[b.id].due)
        .sort((x,y)=>G.db.cards[x.id].due<G.db.cards[y.id].due?-1:1).slice(0,10).map(b=>b.id);
      q=shuffle(ahead);
    }
  }
  return q;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ============== flow ============== */
function start(mode){if(window.__focusDrill&&window.__focusDrill.tool==='saamquiz'&&window.__focusDrill.ids&&window.__focusDrill.ids.length){var _fd=window.__focusDrill.ids.slice();var _hub=!!window.__focusDrill.hub;window.__focusDrill=null;var _ex=new Set(BANK.map(function(x){return x.id;}));G.mode='review';G.hub=_hub;G.queue=_fd.filter(function(id){return _ex.has(id);});shuffle(G.queue);G.sCorrect=G.sWrong=G.sStreak=G.sBest=G.sSeen=0;G.sinceMiss=99;G.sTotal=G.queue.length;if($('result'))$('result').classList.remove('show');if(!G.queue.length){if($('stage'))$('stage').innerHTML='<div class="card"><div class="q" style="font-size:18px">복습할 문항이 없습니다.</div></div>';refreshStats();if(_hub){G.hub=false;setTimeout(function(){try{window.HubSession&&HubSession.next();}catch(e){}},500);}return;}nextQ();refreshStats();return;}
  G.mode=mode;
  G.queue=buildQueue(mode);
  G.sCorrect=G.sWrong=G.sStreak=G.sBest=G.sSeen=0; G.sinceMiss=99;
  G.sTotal=G.queue.length;
  $('result').classList.remove('show');
  if(!G.queue.length){
    $('stage').innerHTML='';
    const t=today();
    const msg = mode==='review'
      ? '복습할 카드가 없습니다 — 선택한 분야에서 틀린 문제가 모두 기한이 안 됐거나 졸업했어요.'
      : '이 분야에 더 풀 카드가 없습니다. 분야를 추가하거나 연습(무한) 모드를 써보세요.';
    $('stage').innerHTML=`<div class="card"><div class="q" style="font-size:20px">${msg}</div></div>`;
    refreshStats(); return;
  }
  nextQ();
  refreshStats();
}
function nextQ(){
  if(!G.queue.length){ return finish(); }
  const id=G.queue.shift();
  const b=BANK.find(x=>x.id===id);
  G.cur=b; G.answered=false;
  renderQ(b);
  updateProg();
}
function catMeta(k){ return CATS.find(c=>c.key===k); }
function renderQ(b){
  G.hinted=false;
  const cm=catMeta(b.cat);
  const cc=getComputedStyle(document.documentElement).getPropertyValue(cm.v).trim();
  const c=G.db.cards[b.id];
  const stTag = c ? (((c.st||1)>=4) ? `유지 ${INT[Math.min(c.st||1,ST_MAX)]}일` : `복습 ${c.st||1}단계`) : '신규';
  // build options
  const opts=shuffle([b.a, ...b.d]).slice();
  const letters=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ'];
  let html=`<div class="card" style="--cc:${cc}">
    <div class="tag"><span class="dot"></span>${cm.label} · <span style="color:var(--paper-dim)">${stTag}</span></div>
    <div class="q">${b.q}</div>
    <div class="opts" id="opts">`;
  opts.forEach((o,i)=>{ html+=`<button class="opt" data-v="${esc(o)}"><span class="key">${letters[i]}</span><span>${o}</span><span class="mark"></span></button>`; });
  html+=`</div>
    <div class="hint-row" id="hint-row"><button class="hint-btn" id="btn-hint" title="정답 후보를 줄여주지만, 이 문제는 오답(복습 대상)으로 기록됩니다">힌트 · 선택지 줄이기 <em>(오답 처리)</em></button></div>
    <div class="fb" id="fb">
      <div class="verdict" id="verdict"></div>
      <div class="note" id="note"></div>
      <div class="srs" id="srs"></div>
      <div class="next-row"><button class="btn primary" id="btn-next">다음 →</button></div>
    </div></div>`;
  $('stage').innerHTML=html;
  $('opts').querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>choose(btn));
  const hb=$('btn-hint'); if(hb) hb.onclick=useHint;
  $('btn-next').onclick=nextQ;
}
function esc(s){ return String(s).replace(/"/g,'&quot;'); }
function useHint(){
  if(G.answered || G.hinted) return;
  G.hinted=true;
  const b=G.cur, opts=[...$('opts').querySelectorAll('.opt')];
  const wrong=opts.filter(o=>o.dataset.v!==b.a);
  shuffle(wrong);
  wrong.slice(0, Math.max(0, wrong.length-1)).forEach(o=>{ o.classList.add('eliminated'); o.disabled=true; const mk=o.querySelector('.mark'); if(mk) mk.textContent='✕'; });
  const hb=$('btn-hint'); if(hb){ hb.disabled=true; hb.innerHTML='힌트 사용됨 · 오답 처리'; }
}

function choose(btn){
  if(G.answered) return;
  G.answered=true;
  const b=G.cur, picked=btn.dataset.v, actuallyCorrect = picked===b.a, correct = actuallyCorrect && !G.hinted;
  const opts=$('opts').querySelectorAll('.opt');
  opts.forEach(o=>{
    o.disabled=true;
    const v=o.dataset.v;
    if(v===b.a){ o.classList.add('correct'); o.querySelector('.mark').textContent='✓'; }
    else if(o===btn){ o.classList.add('wrong'); o.querySelector('.mark').textContent='✕'; }
  });
  // SRS update
  const t=today();
  const card=G.db.cards[b.id];
  let srsMsg='';
  if(correct){
    G.sCorrect++; G.sStreak++; G.sBest=Math.max(G.sBest,G.sStreak); G.sinceMiss++;
    if(!card){ // 처음 맞힘 → 카드 생성, 7일 뒤 확인
      G.db.cards[b.id]={st:2,due:addDays(t,INT[2]),lapses:0,first:t};
      srsMsg=`✓ 처음 맞힘 → ${INT[2]}일 뒤 확인.`;
    } else if(card.due && card.due<=t){ // 예정된 복습 성공 → 간격 확장 (졸업 없음)
      card.st=Math.min((card.st||1)+1, ST_MAX);
      card.due=addDays(t, INT[card.st]);
      srsMsg = card.st>=4 ? `✓ 유지 단계 → ${INT[card.st]}일 뒤 다시.` : `✓ 복습 성공 → ${INT[card.st]}일 뒤 다시.`;
    } else { // 기한 전 조기 정답(연습 등) → 간격 유지
      if(!card.due){ card.st=Math.max(card.st||1,4); card.due=addDays(t, INT[card.st]); }
      srsMsg=`✓ 정답 (다음 확인 ${card.due}).`;
    }
  } else {
    G.sWrong++; G.sStreak=0; G.sinceMiss=0;
    const cc=G.db.cards[b.id]||{lapses:0};
    cc.st=1; cc.due=addDays(t,INT[1]); cc.lapses=(cc.lapses||0)+1;
    G.db.cards[b.id]=cc;
    srsMsg=`✕ 오답 → 3일 뒤 복습 예약.`;
    // re-drill later this session
    if(Math.random()<0.5){ const pos=Math.min(G.queue.length, 3+Math.floor(Math.random()*3)); G.queue.splice(pos,0,b.id); }
  }
  G.sSeen++;
  // log
  G.db.log[t]=G.db.log[t]||{a:0,c:0}; G.db.log[t].a++; if(correct)G.db.log[t].c++;
  saveDB();
  // feedback
  const hr=$('hint-row'); if(hr) hr.style.display='none';
  $('verdict').textContent = correct ? '정답입니다'
    : (G.hinted && actuallyCorrect ? '정답이지만 힌트 사용 → 복습 대상으로 기록 (정답: '+b.a+')'
       : ('오답 — 정답: '+b.a)+(G.hinted?' · 힌트 사용':''));
  $('verdict').className = 'verdict '+(correct?'ok':'no');
  $('note').innerHTML = b.note||'';
  $('srs').textContent = srsMsg;
  $('fb').classList.add('show');
  refreshStats();
}
function addDays(ds,n){ const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function finish(){
  // streak day bookkeeping
  const t=today();
  if(G.db.lastDay!==t){ const y=addDays(t,-1); G.db.streak = (G.db.lastDay===y? (G.db.streak||0)+1 : 1); G.db.lastDay=t; saveDB(); }
  $('stage').innerHTML='';
  $('r-title').textContent = G.mode==='practice' ? '연습 한 바퀴 완료' : '학습 세트 완료';
  $('r-score').textContent = G.sCorrect+' / '+G.sSeen;
  $('r-correct').textContent=G.sCorrect; $('r-wrong').textContent=G.sWrong; $('r-streak').textContent=G.sBest;
  // due buckets after this session
  const t2=today(); const b3=addDays(t2,3),b7=addDays(t2,7),b30=addDays(t2,30);
  let n3=0,n7=0,n30=0,nk=0;
  for(const b of BANK){ const c=G.db.cards[b.id]; if(!c||!c.due) continue; if(c.due<=b3)n3++; else if(c.due<=b7)n7++; else if(c.due<=b30)n30++; else nk++; }
  $('r-buckets').innerHTML = `예정 복습 — <b style="color:var(--el)">3일 내 ${n3}</b> · 7일 내 ${n7} · 한 달 내 ${n30} · 유지(30일+) ${nk}`;
  $('result').classList.add('show');
  $('prog').style.width='100%';
  refreshStats();
  if(G.hub){ G.hub=false; const rb=$('r-buckets'); if(rb) rb.innerHTML+=' <span style="color:var(--gold)">· 통합 세션 — 다음 도구로 넘어갑니다…</span>'; setTimeout(function(){ try{ window.HubSession&&HubSession.next(); }catch(e){} },1400); }
}

/* ============== ui glue ============== */
function buildCats(){
  const wrap=$('cats');
  CATS.forEach(c=>{
    const cc=getComputedStyle(document.documentElement).getPropertyValue(c.v).trim();
    const n=BANK.filter(b=>b.cat===c.key).length;
    const el=document.createElement('button');
    el.className='cat on'; el.style.setProperty('--cc',cc); el.dataset.key=c.key;
    el.innerHTML=`<span class="dot"></span>${c.label}<span class="n">${n}</span>`;
    el.onclick=()=>{ if(G.active.has(c.key)){ if(G.active.size>1){G.active.delete(c.key); el.classList.remove('on');} } else { G.active.add(c.key); el.classList.add('on'); } refreshStats(); };
    wrap.appendChild(el);
  });
}
function refreshStats(){ $('s-due').textContent=dueCount(); $('s-streak').textContent=G.db.streak||0; }
function updateProg(){ const done=G.sSeen, total=Math.max(1,G.sTotal); $('prog').style.width=Math.min(100,Math.round(done/total*100))+'%'; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }

function doExport(){
  const blob=new Blob([JSON.stringify(G.db,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='경락기능_진도.json'; a.click(); URL.revokeObjectURL(a.href);
  toast('진도를 내려받았습니다');
}
function doImport(file){ const r=new FileReader(); r.onload=()=>{ try{ const o=JSON.parse(r.result); G.db=Object.assign({cards:{},log:{},streak:0,lastDay:null},o); saveDB(); refreshStats(); toast('진도를 불러왔습니다'); }catch(e){ toast('파일을 읽을 수 없습니다'); } }; r.readAsText(file); }

function showStorage(){
  const el=$('storage');
  if(storageOK){ el.style.color='var(--paper-faint)'; el.innerHTML='● 자동 저장 켜짐 — 복습 일정이 이 브라우저에 저장됩니다.'; }
  else{ el.style.color='#e0a35a'; el.innerHTML='⚠ 이 브라우저는 자동 저장이 막혀 있습니다 — 진도 내보내기/불러오기를 쓰세요.'; }
}

/* ============== init ============== */
function init(){
  storageOK=probeStorage();
  loadDB();
  buildCats();
  showStorage();
  refreshStats();
  $('btn-start').onclick=()=>start('today');
  $('btn-review').onclick=()=>start('review');
  $('btn-practice').onclick=()=>start('practice');
  $('r-again').onclick=()=>start(G.mode==='practice'?'practice':'today');
  $('r-reset-session').onclick=()=>start(G.mode);
  $('btn-export').onclick=doExport;
  $('btn-import').onclick=()=>$('file-import').click();
  $('file-import').onchange=e=>{ if(e.target.files[0]) doImport(e.target.files[0]); e.target.value=''; };
  $('btn-wipe').onclick=()=>{ if(confirm('모든 진도(복습 일정·기록)를 지울까요?')){ G.db={cards:{},log:{},streak:0,lastDay:null}; saveDB(); refreshStats(); toast('초기화했습니다'); $('result').classList.remove('show'); $('stage').innerHTML=''; } };
  document.addEventListener('keydown',e=>{
    if(['1','2','3','4','5'].includes(e.key)){ const opts=$('opts')&&$('opts').querySelectorAll('.opt'); if(opts&&opts[+e.key-1]&&!G.answered) opts[+e.key-1].click(); }
    if((e.key==='Enter'||e.key===' ')&&G.answered){ e.preventDefault(); const n=$('btn-next'); if(n)n.click(); }
  });
  window.addEventListener('pagehide', saveDB);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') saveDB(); });
}
init();

try{if(window.__focusDrill&&window.__focusDrill.tool==='saamquiz'){start('review');}}catch(e){}
})();</script>


<template id="tpl-osstep"><style>:root{--bg:#0d0906;--ink:#f6f1e7;--ink2:#dcd3c1;--gold:#cbb87e;--mut:#b2a994;--faint:#6f6757;

<script type="text/plain" id="src-osstep">(function(){
const $=id=>document.getElementById(id);
const POS={'木':[170,52],'火':[286,138],'土':[242,272],'金':[98,272],'水':[54,138]};
const SHENG=['木','火','土','金','水'];   // 相生 cycle
const POSITIONS=[['井','정'],['滎','형'],['兪','수'],['經','경'],['合','합']];
const YIN ={'井':'木','滎':'火','兪':'土','經':'金','合':'水'};
const YANG={'井':'金','滎':'水','兪':'木','經':'火','合':'土'};
const ELKR={'木':'목','火':'화','土':'토','金':'금','水':'수'};
let mode='mix', G={score:0,streak:0}, cur=null, done=false;

function buildWheel(){
  // 相生 ring as arcs between consecutive SHENG nodes (clockwise)
  let h='';
  for(let i=0;i<5;i++){
    const a=SHENG[i], b=SHENG[(i+1)%5];
    const [x1,y1]=POS[a], [x2,y2]=POS[b];
    // shorten endpoints toward node edge
    const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, r=33;
    const sx=x1+ux*r, sy=y1+uy*r, ex=x2-ux*r, ey=y2-uy*r;
    h+='<line class="ring" data-a="'+a+'" data-b="'+b+'" x1="'+sx+'" y1="'+sy+'" x2="'+ex+'" y2="'+ey+'"/>';
    // arrowhead near ex,ey
    const ax=ex, ay=ey, perp1x=-uy, perp1y=ux;
    h+='<polygon class="arrow" points="'+ax+','+ay+' '+(ax-ux*9+perp1x*4)+','+(ay-uy*9+perp1y*4)+' '+(ax-ux*9-perp1x*4)+','+(ay-uy*9-perp1y*4)+'"/>';
  }
  SHENG.forEach(e=>{ const[x,y]=POS[e];
    h+='<g class="node" data-el="'+e+'"><circle class="node-c" cx="'+x+'" cy="'+y+'" r="30"/><text class="node-t" x="'+x+'" y="'+y+'">'+e+'</text>'
      +'<text class="steplab" id="lab-'+e+'" x="'+x+'" y="'+(y-38)+'"></text></g>';
  });
  $('wheel').innerHTML=h;
  $('wheel').querySelectorAll('.node').forEach(n=>n.addEventListener('click',()=>pick(n.dataset.el,n)));
}
function clearMarks(){
  $('wheel').querySelectorAll('.node').forEach(n=>n.classList.remove('start','path','ans','bad'));
  $('wheel').querySelectorAll('.ring').forEach(l=>l.classList.remove('hot'));
  SHENG.forEach(e=>$('lab-'+e).textContent='');
}
function pathOf(){ // returns {start, path:[el...], ans}
  const map=cur.yin?YIN:YANG; const start=map['井'];
  const si=SHENG.indexOf(start); const path=[];
  for(let k=0;k<=cur.idx;k++) path.push(SHENG[(si+k)%5]);
  return {start, path, ans:map[cur.pos]};
}
function newRound(){
  $('reveal').classList.remove('show'); $('next').classList.remove('show'); $('fb').textContent=''; $('fb').className='fb'; done=false;
  const yin = mode==='mix' ? (Math.random()<0.5) : (mode==='yin');
  const idx=Math.floor(Math.random()*5);
  cur={yin, idx, pos:POSITIONS[idx][0], posKr:POSITIONS[idx][1]};
  clearMarks();
  const p=pathOf();
  const yy=cur.yin?'陰經':'陽經';
  $('pq').innerHTML='<span class="yy">'+yy+'</span><span class="pos">'+cur.pos+'('+cur.posKr+')穴</span> 은?';
  $('phint').innerHTML='井 = <b>'+p.start+'('+ELKR[p.start]+')</b> 에서 相生으로 <b>'+cur.idx+'칸</b> ('+cur.pos+'은 '+(cur.idx+1)+'번째)';
  // mark start
  const sn=$('wheel').querySelector('.node[data-el="'+p.start+'"]'); if(sn)sn.classList.add('start');
  $('lab-'+p.start).textContent='井';
}
function pick(el,node){
  if(done) return;
  const p=pathOf();
  if(el===p.ans){
    done=true;
    // highlight full path with step labels
    p.path.forEach((e,k)=>{ const n=$('wheel').querySelector('.node[data-el="'+e+'"]');
      if(k===p.path.length-1){ n.classList.remove('path'); n.classList.add('ans'); }
      else if(k>0){ n.classList.add('path'); }
      $('lab-'+e).textContent=POSITIONS[k][0];
      // hot ring segment a->b
      if(k>0){ const a=p.path[k-1]; const seg=$('wheel').querySelector('.ring[data-a="'+a+'"][data-b="'+e+'"]'); if(seg)seg.classList.add('hot'); }
    });
    if(G._perfect!==false){ G.score++; G.streak++; $('fb').textContent='정확합니다'; $('fb').className='fb g'; }
    else { G.streak=0; $('fb').textContent='정답'; $('fb').className='fb'; }
    G._perfect=true;
    $('score').textContent=G.score; $('streak').textContent=G.streak;
    const pathStr=p.path.map((e,k)=>POSITIONS[k][0]+'='+e).join(' → ');
    $('reveal').innerHTML='<div class="rv-path">'+p.path.map((e,k)=>k===p.path.length-1?'<span class="a">'+POSITIONS[k][0]+'='+e+'</span>':POSITIONS[k][0]+'='+e).join('  →  ')+'</div>'
      +'<div class="rv-note">'+(cur.yin?'陰經 井=木':'陽經 井=金')+' 에서 相生(生)으로 한 칸씩. '+cur.pos+'穴 = <b style="color:#9fcaa6">'+p.ans+'('+ELKR[p.ans]+')</b>.</div>';
    $('reveal').classList.add('show'); $('next').classList.add('show');
  } else {
    G._perfect=false; node.classList.add('bad'); $('wheel').classList.add('shake');
    setTimeout(()=>{const wh=$('wheel');if(wh)wh.classList.remove('shake');node.classList.remove('bad');},340);
    $('fb').textContent='다시 — 井('+pathOf().start+')에서 '+cur.idx+'칸 세어보세요'; $('fb').className='fb b';
  }
}
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.mode').forEach(x=>x.classList.remove('on')); b.classList.add('on'); mode=b.dataset.m; G._perfect=true; newRound();
}));
$('next').addEventListener('click',()=>{G._perfect=true;newRound();});
buildWheel(); G._perfect=true; newRound();
})();</script>

<script type="text/plain" id="src-osspeed">(function(){
const $=id=>document.getElementById(id);
const SHENG=['木','火','土','金','水'];
const POSITIONS=[['井','정'],['滎','형'],['兪','수'],['經','경'],['合','합']];
const YIN ={'井':'木','滎':'火','兪':'土','經':'金','合':'水'};
const YANG={'井':'金','滎':'水','兪':'木','經':'火','合':'土'};
const ELKR={'木':'목','火':'화','土':'토','金':'금','水':'수'};
const ELC ={'木':'--mok','火':'--hwa','土':'--to','金':'--geum','水':'--su'};
const TOTAL=24, QTIME=4500;
let cfg={ji:'mix',dir:'mix'}, S=null, timer=null;

function pickQ(){
  const yin = cfg.ji==='mix' ? (Math.random()<0.5) : (cfg.ji==='yin');
  const dir = cfg.dir==='mix' ? (Math.random()<0.5?'fwd':'rev') : cfg.dir;
  const idx=Math.floor(Math.random()*5); const pos=POSITIONS[idx][0], posKr=POSITIONS[idx][1];
  const map=yin?YIN:YANG; const el=map[pos];
  if(dir==='fwd') return {yin,dir,pos,posKr,el, ask:'무슨 五行?', answer:el, opts:SHENG.slice()};
  return {yin,dir,pos,posKr,el, ask:'어느 자리?', answer:pos, opts:POSITIONS.map(p=>p[0])};
}
function renderQ(){
  const q=S.q; const yy=q.yin?'陰經':'陽經';
  let big, askEl;
  if(q.dir==='fwd'){ big='<span class="big">'+q.pos+'<span class="kr">('+q.posKr+')</span>穴</span>'; }
  else { const cv=getComputedStyle(document.documentElement).getPropertyValue(ELC[q.el]).trim();
    big='<span class="big" style="color:'+cv+'">'+q.el+'<span class="kr" style="color:var(--mut)">('+ELKR[q.el]+')</span></span>'; }
  $('qcard').innerHTML='<div class="yy">'+yy+'</div>'+big+'<div class="ask">'+q.ask+'</div>';
  $('opts').innerHTML=q.opts.map(o=>{
    if(q.dir==='fwd'){ const cv=getComputedStyle(document.documentElement).getPropertyValue(ELC[o]).trim();
      return '<button class="opt" data-o="'+o+'" style="color:'+cv+'">'+o+'<span class="sub">'+ELKR[o]+'</span></button>'; }
    const kr=POSITIONS.find(p=>p[0]===o)[1];
    return '<button class="opt" data-o="'+o+'">'+o+'<span class="sub">'+kr+'</span></button>';
  }).join('');
  $('opts').querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.o,b)));
  $('combo').textContent = S.combo>1 ? (S.combo+' 콤보') : '';
}
function startTimer(){
  S.t0=Date.now(); const bar=$('bar'); bar.classList.remove('warn'); bar.style.width='100%';
  clearInterval(timer);
  timer=setInterval(()=>{
    const b=$('bar'); if(!b){ clearInterval(timer); return; }   // unmounted
    const el=Date.now()-S.t0; const left=Math.max(0,QTIME-el); const pct=left/QTIME*100;
    b.style.width=pct+'%'; if(pct<33)b.classList.add('warn');
    if(left<=0){ clearInterval(timer); timeUp(); }
  },70);
}
function answer(choice,btn){
  if(S.answered) return; S.answered=true; clearInterval(timer);
  const q=S.q; const correct=choice===q.answer; const el=Date.now()-S.t0;
  if(correct){
    btn.classList.add('good');
    S.combo++; S.best=Math.max(S.best,S.combo); S.correct++; S.times.push(el);
    const speed=Math.max(0,Math.round((QTIME-el)/QTIME*100));
    const mult=1+Math.min(S.combo-1,10)*0.1;
    S.score+=Math.round((100+speed)*mult);
  } else {
    btn.classList.add('bad'); S.combo=0;
    // highlight correct option
    $('opts').querySelectorAll('.opt').forEach(o=>{ if(o.dataset.o===q.answer)o.classList.add('good'); else if(o!==btn)o.classList.add('dim'); });
  }
  $('score').textContent=S.score; $('best').textContent=S.best;
  setTimeout(()=>{ if($('opts')) advance(); }, correct?260:560);
}
function timeUp(){
  if(S.answered) return; S.answered=true; S.combo=0;
  const q=S.q; $('opts').querySelectorAll('.opt').forEach(o=>{ if(o.dataset.o===q.answer)o.classList.add('good'); else o.classList.add('dim'); });
  $('combo').textContent='시간 초과';
  setTimeout(()=>{ if($('opts')) advance(); }, 620);
}
function advance(){ S.n++; if(S.n>=TOTAL){ endSession(); return; } nextQ(); }
function nextQ(){ S.q=pickQ(); S.answered=false; renderQ(); startTimer(); }
function endSession(){
  clearInterval(timer); $('play').classList.add('hidden');
  const avg=S.times.length?Math.round(S.times.reduce((a,b)=>a+b,0)/S.times.length):0;
  const acc=Math.round(S.correct/TOTAL*100);
  $('summary').innerHTML='<h3>결과</h3><div class="sgrid">'
    +'<div class="scell"><div class="v">'+acc+'%</div><div class="l">정답률 ('+S.correct+'/'+TOTAL+')</div></div>'
    +'<div class="scell"><div class="v">'+S.best+'</div><div class="l">최고 콤보</div></div>'
    +'<div class="scell"><div class="v">'+(avg/1000).toFixed(2)+'s</div><div class="l">평균 반응</div></div>'
    +'<div class="scell"><div class="v">'+S.score+'</div><div class="l">총점</div></div></div>';
  $('summary').classList.add('show'); $('start').classList.remove('hidden'); $('start').textContent='다시 시작 ▶';
}
function startSession(){
  S={n:0,score:0,combo:0,best:0,correct:0,times:[],answered:false,q:null};
  $('score').textContent='0'; $('best').textContent='0';
  $('summary').classList.remove('show'); $('start').classList.add('hidden'); $('play').classList.remove('hidden');
  nextQ();
}
document.querySelectorAll('.tg').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tg[data-k="'+b.dataset.k+'"]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); cfg[b.dataset.k]=b.dataset.v;
}));
$('start').addEventListener('click',startSession);
})();</script>
