};
const ORDER=['폐','대장','위','비','심','소장','방광','신','심포','삼초','담','간'];
const $=id=>document.getElementById(id);
const CHUNK=6;
let cur=null, seq=[], chunks=[], ci=0, placed=0, pool=[], G={score:0,combo:0}, hintUsed=false, gen=0;
try{if(window.__joTimer)clearTimeout(window.__joTimer);}catch(e){}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function buildChips(){
  $('chips').innerHTML=ORDER.map(k=>{const f=FLOW[k];return '<button class="chip" data-k="'+k+'" style="--c:'+f.c+'">'+f.full+'<span class="ko">'+f.seq.length+'</span></button>';}).join('');
  $('chips').querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>selectMer(b.dataset.k)));
}
function selectMer(k){
  gen++;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.k===k));
  cur=k; seq=FLOW[k].seq; chunks=[];
  for(let i=0;i<seq.length;i+=CHUNK) chunks.push([i,Math.min(i+CHUNK,seq.length)]);
  ci=0; $('intro').classList.add('hidden'); $('done').classList.remove('show'); $('game').classList.remove('hidden');
  $('merfull').textContent=FLOW[k].full;
  startChunk();
}
function mkPool(s,e){ return shuffle(seq.slice(s,e).map((it,i)=>({id:i,h:it.h,d:it.d}))); }
function startChunk(){
  if(!$('placed'))return;
  const [s,e]=chunks[ci]; placed=0; hintUsed=false; pool=mkPool(s,e);
  $('segnow').textContent='구간 '+(ci+1)+' / '+chunks.length;
  $('bar').style.width=Math.round(ci/chunks.length*100)+'%';
  if(ci===0){ $('ctx').innerHTML='起 <span class="han">'+FLOW[cur].full+'</span> — 첫 구절부터 순서대로'; }
  else { $('ctx').innerHTML='앞 구간 끝 → <b>'+esc(seq[s-1].h)+'</b> <span class="sub">'+esc(seq[s-1].d)+'</span> · 이어서'; }
  $('fb').textContent=''; $('fb').className='fb'; render();
}
function render(){
  const [s,e]=chunks[ci];
  $('placed').innerHTML = placed===0 ? '' :
    seq.slice(s,s+placed).map((it,i)=>'<div class="prow"><span class="num">'+(s+i+1)+'</span><span class="ph">'+esc(it.h)+'</span><span class="pd">'+esc(it.d)+'</span></div>').join('');
  $('remain').textContent=pool.length;
  $('pool').innerHTML = pool.length===0 ? '' :
    pool.map(it=>'<button class="tile" data-id="'+it.id+'"><span class="th">'+esc(it.h)+'</span><span class="td">'+esc(it.d)+'</span></button>').join('');
  $('pool').querySelectorAll('.tile').forEach(b=>b.addEventListener('click',()=>tap(+b.dataset.id,b)));
}
function tap(id,btn){
  const [s,e]=chunks[ci]; const expected=seq[s+placed];
  const item=pool.find(x=>x.id===id);
  if(item && item.d===expected.d){
    pool=pool.filter(x=>x.id!==id); placed++;
    if(!hintUsed){ G.score+=10; G.combo++; } else { G.combo=0; }
    $('score').textContent=G.score; $('combo').textContent=G.combo; hintUsed=false;
    $('fb').textContent=''; $('fb').className='fb'; render();
    if(pool.length===0){ const g0=gen; window.__joTimer=setTimeout(()=>{if(gen===g0)chunkDone();},260); }
  } else {
    G.combo=0; $('combo').textContent=0; btn.classList.add('bad');
    setTimeout(()=>{if(btn)btn.classList.remove('bad');},340);
    $('fb').textContent='순서가 아닙니다 — '+(placed+1)+'번째 구절을 찾으세요'; $('fb').className='fb b';
  }
}
function chunkDone(){
  if(!$('placed'))return;
  if(ci<chunks.length-1){ ci++; $('fb').textContent='구간 완성 ✓'; $('fb').className='fb g'; const g0=gen; window.__joTimer=setTimeout(()=>{if(gen===g0)startChunk();},420); }
  else meridianDone();
}
function meridianDone(){
  $('bar').style.width='100%'; $('game').classList.add('hidden');
  const f=FLOW[cur];
  $('done').innerHTML='<h3>'+f.full+' 순행 완성 ✓</h3><div class="sub">총 '+seq.length+'구절 · '+chunks.length+'구간 — 점수 '+G.score+' · 출전 靈樞 經脈篇</div>'
    +'<div class="fullseq">'+seq.map((it,i)=>'<div class="fsrow"><span class="n">'+(i+1)+'</span><span class="h">'+esc(it.h)+'</span><span class="d">'+esc(it.d)+'</span></div>').join('')+'</div>'
    +'<div class="foot"><button class="btn" id="againBtn">다시 풀기</button><button class="btn" id="pickBtn">다른 경맥</button></div>';
  $('done').classList.add('show');
  $('againBtn').addEventListener('click',()=>selectMer(cur));
  $('pickBtn').addEventListener('click',()=>{$('done').classList.remove('show');$('intro').classList.remove('hidden');document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));window.scrollTo(0,0);});
}
$('hintBtn').addEventListener('click',()=>{
  if(!pool.length)return; const [s,e]=chunks[ci]; const expected=seq[s+placed]; hintUsed=true;
  $('pool').querySelectorAll('.tile').forEach(t=>{const it=pool.find(x=>x.id==t.dataset.id);t.classList.toggle('hint',it&&it.d===expected.d);});
  $('fb').textContent='힌트: 다음은 「'+esc(expected.h[0])+'…」('+esc(expected.d)+') (이번 정답은 콤보 제외)'; $('fb').className='fb';
});
$('reshuffleBtn').addEventListener('click',()=>{ if(cur){ const [s,e]=chunks[ci]; placed=0; hintUsed=false; pool=mkPool(s,e); $('fb').textContent=''; $('fb').className='fb'; render(); }});
$('restartBtn').addEventListener('click',()=>{ if(cur)selectMer(cur); });
buildChips();
})();</script>

<script type="text/plain" id="src-home">(function(){

const TKEY='hub_track_v1';

const CLOZE_KEY='jiaohoe_cloze_v1', CLOZE_TOTAL=14;

function readJSON(k){ try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;} }

function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function addDaysISO(s,n){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return iso(d); }

function srsStat(key){
  const o=readJSON(key); if(!o) return null;
  const log=o.log||{}; let a=0,c=0; const dates=Object.keys(log);

  const td=today(); let due=0; const cards=o.cards||{};
  for(const id in cards){ const cd=cards[id]; if(cd&&cd.due&&cd.due<=td) due++; }
  return {a,c,acc:a?Math.round(c/a*100):0,days:dates.length,due,streak:o.streak||0,last:o.lastDay||null,log};
}

for(const d in (T.days||{})){ act[d]=(act[d]||0)+T.days[d]; }

function calcStreak(){ let cur=today(); if(!act[cur]) cur=addDaysISO(cur,-1); let n=0; while(act[cur]){ n++; cur=addDaysISO(cur,-1); } return n; }
const streak=calcStreak();
const studyDays=Object.keys(act).filter(d=>act[d]>0).length;
function srsTodaySum(){ const td=today(); let s=0; SRS.forEach(x=>{const st=srsStats[x.id]; if(st&&st.log[td])s+=st.log[td].a;}); return s; }
const todayCount=srsTodaySum();

const TOOLS=[
 {g:'경락 계통·기능', id:'func', label:'기능 퀴즈', desc:'계통→기능·기경팔맥·변별·原文 (SRS)', type:'srs'},
 {g:'경락 계통·기능', id:'systree', label:'계통 트리', desc:'經脈·絡脈·連屬 구조에 기능 분류', type:'report', total:18},
 {g:'경락 계통·기능', id:'swipe', label:'변별 스와이프', desc:'헷갈리는 쌍 좌우로 가르기', type:'report', total:24},
 {g:'경혈 (오수·원락극모배수)', id:'acu', label:'경혈 퀴즈', desc:'五輸·原絡郄募背兪·八會·교회 (SRS)', type:'srs'},
  {g:'경혈 (오수·원락극모배수)', id:'osstep', label:'오수혈 상생휠', desc:'井(陰木·陽金)→相生으로 五行 도출', type:'visit'},
  {g:'경혈 (오수·원락극모배수)', id:'osspeed', label:'오수혈 스피드', desc:'五輸穴↔五行 반사 훈련 (양방향)', type:'visit'},

 {g:'배수혈·교회혈', id:'spine', label:'배수혈맵', desc:'척추에 背兪 배치 + 교회 점등', type:'visit'},
 {g:'배수혈·교회혈', id:'baesurule', label:'배수혈 추론', desc:'위치·八會·兪募·교회 규칙 (SRS)', type:'srs'},
 {g:'배수혈·교회혈', id:'ref', label:'가리기표', desc:'背兪·兪募·교회 일람 셀프테스트', type:'visit'},
 {g:'배수혈·교회혈', id:'cloze', label:'교회혈 니모닉', desc:'약 91혈 니모닉 빈칸', type:'cloze', total:14},
 {g:'사암침법 (보사법)', id:'saamwheel', label:'사암 수레바퀴', desc:'生我·克我·我生으로 正格·勝格 유도', type:'visit'},
 {g:'사암침법 (보사법)', id:'saammirror', label:'사암 거울', desc:'正格↔勝格: 官혈 축, 母↔子 교체', type:'visit'},
 {g:'사암침법 (보사법)', id:'saamcloze', label:'사암 니모닉', desc:'암송 문장 단서로 4혈 입력', type:'visit'},
 {g:'사암침법 (보사법)', id:'saammaster', label:'사암 종합 빌더', desc:'自經·正格·勝格·主客·寒熱 4법', type:'visit'},
  {g:'사암침법 (보사법)', id:'saamquiz', label:'사암 보사 퀴즈', desc:'4법(正·勝·自經·主客·寒熱) 혈·五行 5지선다 (SRS)', type:'srs'},
  {g:'사암침법 (보사법)', id:'saambosafill', label:'사암 補瀉', desc:'自經·主客·正格·勝格 혈을 칩으로 빈칸 채우기', type:'visit'},
];
function toolStatus(t){
  const o=(T.tools||{})[t.id]||{};
  if(t.type==='srs'){ const st=srsStats[t.id]; if(!st||st.a===0) return {txt:'미학습', bar:0, dim:true};
    return {txt:'푼 '+st.a+'문 · 정확도 '+st.acc+'%', bar:st.acc, pill:(st.due?('복습 '+st.due):''), sub:(st.last?('최근 '+st.last):'')}; }
  if(t.type==='report'){ if(o.done!=null && o.done>=(o.total||t.total)) return {txt:'완료 ✓ · 최고 '+(o.bestAcc!=null?o.bestAcc:'-')+'%', bar:100, sub:(o.last?('최근 '+o.last):'')};
    if(o.visits) return {txt:'시도 '+o.visits+'회 · 미완료', bar:0, sub:(o.last?('최근 '+o.last):'')};
    return {txt:'미학습', bar:0, dim:true}; }
  if(t.type==='cloze'){ if(clozeDone>0) return {txt:'묶음 '+clozeDone+'/'+t.total+(clozeDone>=t.total?' ✓':''), bar:Math.round(clozeDone/t.total*100), sub:(o.last?('최근 '+o.last):'')};
    if(o.visits) return {txt:'진행 0/'+t.total, bar:0}; return {txt:'미학습', bar:0, dim:true}; }
  if(o.visits) return {txt:'학습 '+o.visits+'회', bar:null, sub:(o.last?('최근 '+o.last):'')};
  return {txt:'미학습', bar:null, dim:true};
}
function engaged(t){ return !toolStatus(t).dim; }
const engCount=TOOLS.filter(engaged).length;

function suggest(){
  for(const t of TOOLS){ if(t.type==='srs'){ const st=srsStats[t.id]; if(st&&st.due>0) return {t, why:'복습 '+st.due+'장 대기'}; } }
  for(const t of TOOLS){ if(!engaged(t)) return {t, why:'아직 안 해봤어요'}; }
  if(clozeDone>0&&clozeDone<CLOZE_TOTAL){ const t=TOOLS.find(x=>x.id==='cloze'); return {t, why:(CLOZE_TOTAL-clozeDone)+'묶음 남음'}; }
  for(const t of TOOLS){ if(t.type==='report'){ const o=(T.tools||{})[t.id]||{}; if(!(o.done!=null&&o.done>=(o.total||t.total))) return {t, why:'아직 완료 전'}; } }
  for(const t of TOOLS){ if(t.type==='srs'){ const st=srsStats[t.id]; if(st) return {t, why:'복습 이어가기'}; } }
  return null;
}

function tile(ic,lab,val){ return '<div class="hm-tile"><div class="hm-tic">'+ic+'</div><div class="hm-tval">'+val+'</div><div class="hm-tlab">'+lab+'</div></div>'; }
function renderHeat(){

  const start=new Date(td); start.setDate(start.getDate()-start.getDay()-(weeks-1)*7);
  let html='<div class="hm-heatgrid">';

      html+='<span class="hm-cell lv'+lv+'" title="'+ds+' · 활동 '+v+'"></span>';

// ---------- ② 통합 오늘 세션 ----------
function dueIdsOf(key){ const o=readJSON(key); const td=today(); const out=[]; if(!o||!o.cards) return out; for(const id in o.cards){ const c=o.cards[id]; if(c&&c.due&&c.due<=td) out.push(id); } return out; }
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildSessionPlan(cap){
  const CHUNK=4; const pools=[];
  SRS.forEach(s=>{ const ids=shuffleArr(dueIdsOf(s.key)); if(ids.length) pools.push({tool:s.id,ids}); });
  shuffleArr(pools);
  const plan=[]; let n=0; let any=true;
  while(any && n<cap){ any=false;
    for(const p of pools){ if(!p.ids.length) continue; any=true; const take=p.ids.splice(0,Math.min(CHUNK,cap-n)); if(take.length){ plan.push({tool:p.tool,ids:take}); n+=take.length; } if(n>=cap) break; }
  }
  return plan;
}
function renderSession(){
  const host=$('hm-session'); if(!host) return;
  let total=0; const per=[]; SRS.forEach(s=>{ const k=dueIdsOf(s.key).length; if(k){ total+=k; per.push(toolLabel(s.id)+' '+k); } });
  let last=null; try{ last=JSON.parse(localStorage.getItem('hub_session_last')); }catch(e){}

// ---------- 통계 내보내기 ----------
function readStats(){ try{ if(window.HubStats&&HubStats.get) return HubStats.get(); }catch(e){} return readJSON('hub_stats_v1')||{q:{}}; }
function daysAgo(d){ if(!d) return 999; const a=new Date(d+'T00:00:00'), b=new Date(today()+'T00:00:00'); return Math.max(0,Math.round((b-a)/86400000)); }
function weakScore(e){ // 최근 2주 가중: 오답 하나의 무게 = 0.5^(경과일/14)
  const HALF_LIFE=14;
  const h=Array.isArray(e.h)?e.h:null;
  if(h&&h.length){ let sc=0; h.forEach(([d,ok])=>{ if(!ok) sc+=Math.pow(0.5, daysAgo(d)/HALF_LIFE); }); return sc; }
  return (e.wrong||0)*Math.pow(0.5, daysAgo(e.lastWrong||e.last)/HALF_LIFE);
}
function weakResolved(e){ // 최근 3회 연속 정답이면 약점 해제
  const h=Array.isArray(e.h)?e.h:null; if(!h||h.length<3) return false;
  return h.slice(-3).every(x=>x[1]===1);
}
function recentStr(e){ const h=Array.isArray(e.h)?e.h:[]; return h.slice(-6).map(x=>x[1]?'○':'✕').join(''); }
function weakList(stats){
  const arr=Object.values((stats&&stats.q)||{}).map(e=>Object.assign({},e));
  arr.forEach(e=>{ e.wrongRate=e.seen?Math.round(e.wrong/e.seen*100):0; e.score=weakScore(e); e.resolved=weakResolved(e); e.recent=recentStr(e); });
  arr.sort((a,b)=> (b.score-a.score) || (b.wrong-a.wrong) || (b.wrongRate-a.wrongRate) || (b.seen-a.seen));
  return arr;
}
function toolLabel(id){ const t=TOOLS.find(x=>x.id===id); return t?t.label:id; }
function dailyMerged(){
  const d={};
  SRS.forEach(s=>{ const st=srsStats[s.id]; if(st){ for(const k in st.log){ d[k]=d[k]||{attempts:0,correct:0}; d[k].attempts+=st.log[k].a||0; d[k].correct+=st.log[k].c||0; } } });
  return Object.keys(d).sort().map(k=>({date:k,attempts:d[k].attempts,correct:d[k].correct}));
}
function lapsedList(){
  const out=[];
  SRS.forEach(s=>{ const o=readJSON(s.key); if(o&&o.cards){ for(const id in o.cards){ const c=o.cards[id]||{}; out.push({tool:s.id,id:id,stage:(c.st!=null?c.st:null),due:(c.due||null),lapses:(c.lapses!=null?c.lapses:undefined)}); } } });
  return out;
}
function toolsExport(){
  return TOOLS.map(t=>{
    const o=(T.tools||{})[t.id]||{};
    const base={id:t.id,label:t.label,group:t.g,type:t.type};
    if(t.type==='srs'){ const st=srsStats[t.id];
      Object.assign(base,{attempts:st?st.a:0,correct:st?st.c:0,accuracy:st?st.acc:0,daysStudied:st?st.days:0,reviewDue:st?st.due:0,streak:st?st.streak:0,lastStudied:st?st.last:null});
    } else if(t.type==='report'){
      Object.assign(base,{completed:!!(o.done!=null&&o.done>=(o.total||t.total)),bestAcc:(o.bestAcc!=null?o.bestAcc:null),completes:(o.completes||0),visits:(o.visits||0),lastStudied:(o.last||null)});
    } else if(t.type==='cloze'){
      Object.assign(base,{groupsDone:clozeDone,groupsTotal:t.total,visits:(o.visits||0),lastStudied:(o.last||null)});
    } else {
      Object.assign(base,{visits:(o.visits||0),lastStudied:(o.last||null)});
    }
    return base;
  });
}
function summaryObj(stats){
  let a=0,c=0; SRS.forEach(s=>{ const st=srsStats[s.id]; if(st){ a+=st.a; c+=st.c; } });
  const tracked=Object.keys((stats&&stats.q)||{}).length;
  const wrong=weakList(stats).filter(e=>e.wrong>0).length;
  return {streak,studyDays,totalAttempts:a,totalCorrect:c,overallAccuracy:(a?Math.round(c/a*100):0),toolsEngaged:engCount,toolsTotal:TOOLS.length,questionsTracked:tracked,weakQuestions:wrong};
}
function buildExport(includeRaw){
  const stats=readStats();
  const ws=weakList(stats);
  const exp={
    meta:{app:'경락 학습 허브 (한의학개론 경락)',exportedAt:new Date().toISOString(),today:today(),schema:1,
          note:'weakSpots = 문항별 오답(문제 정보 포함). recentScore(최근 2주 가중 오답 점수) 기준 정렬; resolved=최근 3회 연속 정답. raw에 전체 원본.'},
    summary:summaryObj(stats),
    tools:toolsExport(),
    weakSpots:ws.filter(e=>e.wrong>0).map(e=>({tool:e.tool,toolLabel:toolLabel(e.tool),id:e.id,question:(e.q||null),category:(e.cat||e.kind||null),answer:(e.a||null),seen:e.seen,wrong:e.wrong,wrongRate:e.wrongRate,lastWrong:(e.lastWrong||null),recentScore:Math.round(e.score*100)/100,recent:(e.recent||null),resolved:!!e.resolved})),
    reviewQueue:lapsedList(),
    dailyActivity:dailyMerged()
  };
  if(includeRaw){
    const srs={}; SRS.forEach(s=>{ const o=readJSON(s.key); if(o) srs[s.key]=o; });
    exp.raw={hub_track_v1:T, hub_stats_v1:stats, cloze:readJSON(CLOZE_KEY), srs:srs};
  }
  return exp;
}
function buildMD(){
  const stats=readStats(); const s=summaryObj(stats); const ws=weakList(stats).filter(e=>e.wrong>0).slice(0,50);
  let md='# 경락 학습 현황 ('+today()+')\n\n';
  md+='- 연속 '+s.streak+'일 · 총 학습일 '+s.studyDays+'일 · 학습한 도구 '+s.toolsEngaged+'/'+s.toolsTotal+'\n';
  md+='- 총 풀이 '+s.totalAttempts+'문 · 정답 '+s.totalCorrect+' · 정확도 '+s.overallAccuracy+'%\n';
  md+='- 추적 문항 '+s.questionsTracked+' · 오답 문항 '+s.weakQuestions+'\n\n';
  md+='## 도구별 성적\n\n| 도구 | 정확도 / 진도 |\n|---|---|\n';
  toolsExport().forEach(t=>{ let v='';
    if(t.type==='srs') v=(t.accuracy||0)+'% · '+(t.attempts||0)+'문 · 복습 '+(t.reviewDue||0);
    else if(t.type==='report') v=(t.completed?('완료 · 최고 '+(t.bestAcc!=null?t.bestAcc:'-')+'%'):((t.visits||0)+'회 시도'));
    else if(t.type==='cloze') v=(t.groupsDone||0)+'/'+t.groupsTotal+' 묶음';
    else v=(t.visits||0)+'회 학습';
    md+='| '+t.label+' | '+v+' |\n';
  });
  if(ws.length){ md+='\n## 오답 많은 문항 (상위 '+ws.length+')\n\n| 도구 | 문제 | 분류 | 틀림/시도 |\n|---|---|---|---|\n';
    ws.forEach(e=>{ const q=(e.q?String(e.q).replace(/\|/g,'/').replace(/\n/g,' ').slice(0,70):e.id); const cat=(e.cat||e.kind||'').replace(/\|/g,'/'); md+='| '+e.tool+' | '+q+' | '+cat+' | '+e.wrong+'/'+e.seen+' |\n'; });
  } else { md+='\n_아직 기록된 오답 문항이 없습니다. 게임을 풀면 문항별 오답이 여기 쌓입니다._\n'; }
  return md;
}
function setNote(m){ const n=$('hm-exp-note'); if(n) n.textContent=m||''; }
function copyText(txt,okMsg){
  const ta=$('hm-exp-ta');
  function fallback(){ try{ ta.removeAttribute('readonly'); ta.focus(); ta.select(); ta.setSelectionRange(0,ta.value.length); const ok=document.execCommand('copy'); ta.setAttribute('readonly','readonly'); setNote(ok?(okMsg||'복사됨')+' (텍스트 영역)':'자동 복사 실패 — 아래 텍스트를 직접 선택해 복사하세요'); }catch(e){ setNote('자동 복사 실패 — 아래 텍스트를 직접 선택해 복사하세요'); } }
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>setNote(okMsg||'복사됨'),fallback); } else { fallback(); } }
  catch(e){ fallback(); }
}
function downloadText(name,txt,mime){
  try{
    const blob=new Blob([txt],{type:mime||'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=name; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ try{document.body.removeChild(a);}catch(e){} try{URL.revokeObjectURL(url);}catch(e){} },200);
    setNote('다운로드 시작: '+name+' (안 되면 JSON 복사를 쓰세요)');
  }catch(e){ setNote('다운로드 실패 — JSON 복사 버튼을 사용하세요'); }
}

function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ---------- 약점 분석 (Feature 1·2) ----------
function weakAll(){ return weakList(readStats()).filter(e=>e.wrong>0 && !e.resolved && e.score>=0.1); }
function resolvedCount(){ return weakList(readStats()).filter(e=>e.wrong>0 && e.resolved).length; }
function weakByToolMap(){ const m={}; weakAll().forEach(e=>{ (m[e.tool]=m[e.tool]||[]).push(e); }); return m; }
function catAgg(){
  const m={};
  weakList(readStats()).forEach(e=>{ const cat=e.cat||e.kind||'기타'; const k=e.tool+'/'+cat; const o=m[k]||{tool:e.tool,cat:cat,seen:0,wrong:0,score:0,open:0}; o.seen+=e.seen; o.wrong+=e.wrong; if(!e.resolved){ o.score+=e.score; if(e.wrong>0) o.open++; } m[k]=o; });
  return Object.values(m).map(o=>{o.wrongRate=o.seen?Math.round(o.wrong/o.seen*100):0;return o;})
    .filter(o=>o.seen>=2&&o.open>0&&o.score>=0.1).sort((a,b)=> (b.score-a.score)||(b.wrongRate-a.wrongRate)||(b.wrong-a.wrong));
}

// ---------- 비교 (Feature 3) ----------
function parseImport(txt){ try{ const o=JSON.parse(txt); if(o&&o.summary&&o.tools) return o; }catch(e){} return null; }
function deltaTag(d){ if(d>0) return '<span class="up">▲'+d+'</span>'; if(d<0) return '<span class="down">▼'+(-d)+'</span>'; return '<span class="flat">—</span>'; }
function runCompare(txt){
  const out=$('hm-cmp-out'); if(!out) return;
  const old=parseImport(txt);
  if(!old){ out.innerHTML='<div class="hm-cmp-err">JSON을 읽지 못했습니다. 이전에 내보낸 통계 JSON 전체(중괄호 포함)를 붙여넣어 주세요.</div>'; return; }
  let cur; try{ cur=buildExport(false); }catch(e){ out.innerHTML='<div class="hm-cmp-err">현재 통계 생성 오류</div>'; return; }
  const oldDate=(old.meta&&old.meta.today)?old.meta.today:'이전';
  let h='';
  const oa=(old.summary.overallAccuracy)||0, ca=(cur.summary.overallAccuracy)||0;
  const op=(old.summary.totalAttempts)||0, cp=(cur.summary.totalAttempts)||0;
  h+='<div class="hm-cmp-line">'+oldDate+' → 오늘 · 전체 정확도 '+oa+'% → <b>'+ca+'%</b> '+deltaTag(ca-oa)+' · 풀이 '+op+' → '+cp+' (+'+Math.max(0,cp-op)+')</div>';
  const oldTools={}; (old.tools||[]).forEach(t=>{ oldTools[t.id]=t; });
  let toolLines='';
  (cur.tools||[]).filter(t=>t.type==='srs').forEach(t=>{ const ot=oldTools[t.id]||{}; const o=ot.accuracy||0, c=t.accuracy||0; if(((t.attempts||0)===0)&&((ot.attempts||0)===0)) return; toolLines+='<div class="hm-cmp-line2">'+escapeHtml(t.label)+': '+o+'% → '+c+'% '+deltaTag(c-o)+' <span style="color:#6f6757">('+(ot.attempts||0)+'→'+(t.attempts||0)+'문)</span></div>'; });
  if(toolLines){ h+='<div class="hm-cmp-sub">도구별 정확도 변화</div>'+toolLines; }
  const oldWeak={}; (old.weakSpots||[]).forEach(w=>{ oldWeak[w.tool+'::'+w.id]=w; });
  const curWeak={}; (cur.weakSpots||[]).forEach(w=>{ curWeak[w.tool+'::'+w.id]=w; });
  const fixed=[], worse=[], neww=[];
  Object.keys(oldWeak).forEach(k=>{ if(!curWeak[k]) fixed.push(oldWeak[k]); else if((curWeak[k].wrong||0)>(oldWeak[k].wrong||0)) worse.push(curWeak[k]); });
  Object.keys(curWeak).forEach(k=>{ if(!oldWeak[k]) neww.push(curWeak[k]); });
  h+='<div class="hm-cmp-sub">오답 문항 변화</div>';
  h+='<div class="hm-cmp-line2">✅ 더 이상 오답 아님 <b>'+fixed.length+'</b> · ⚠️ 더 틀림 <b>'+worse.length+'</b> · 🆕 새 오답 <b>'+neww.length+'</b></div>';
  function mini(label,list){ if(!list.length) return ''; return '<div class="hm-cmp-mini">'+label+' '+list.slice(0,6).map(w=>escapeHtml(String(w.question||w.id)).slice(0,32)).join(' · ')+(list.length>6?' …':'')+'</div>'; }
  h+=mini('개선:',fixed); h+=mini('새 오답:',neww);
  out.innerHTML=h;
}

"lyrics": "[Verse 1]\n이입출합은 경별, 결취산락은 경근.\n이입출합은 경별, 결취산락은 경근.\n이입출합은 경별, 결취산락은 경근.\n별락은 낙혈과 주병증이 있고 겉에서 표리를 잇는다.\n별락은 낙혈과 주병증이 있고 겉에서 표리를 잇는다.\n별락은 낙혈과 주병증이 있고 겉에서 표리를 잇는다.\n경별은 혈위도 주병증도 없이 속에서 표리를 잇는다.\n경별은 혈위도 주병증도 없이 속에서 표리를 잇는다.\n경별은 혈위도 주병증도 없이 속에서 표리를 잇는다.\n충맥은 혈해와 요충, 임맥은 임주포태.\n충맥은 혈해와 요충, 임맥은 임주포태.\n충맥은 혈해와 요충, 임맥은 임주포태.\n음유맥은 주리 속영, 양유맥은 주표 속위.\n음유맥은 주리 속영, 양유맥은 주표 속위.\n음유맥은 주리 속영, 양유맥은 주표 속위.\n난경의 십오락은 음교락 양교락 비대락.\n난경의 십오락은 음교락 양교락 비대락.\n난경의 십오락은 음교락 양교락 비대락.\n영추의 십오락은 임맥락 독맥락 비대락.\n영추의 십오락은 임맥락 독맥락 비대락.\n영추의 십오락은 임맥락 독맥락 비대락.\n의문법률의 십오락은 기경대락 위대락 비대락.\n의문법률의 십오락은 기경대락 위대락 비대락.\n의문법률의 십오락은 기경대락 위대락 비대락.\n\n[Verse 2]\n십이경별은 경맥계통이고 낙맥계통이 아니다.\n\n[Chorus]\n겉을 잇는 별락, 속을 잇는 경별."
}
};
var MAP   = {"func": ["gr-s01", "gr-s02", "gr-s03", "gr-s04", "gr-s05", "gr-s06"], "systree": ["gr-s01", "gr-s02", "gr-s05"], "swipe": ["gr-s06", "gr-s03", "gr-s04"]};
var STYLE = "Disco, Pop, Soft Rock, Adult Contemporary, clear female lead, one note per syllable, staccato, dry vocal, minimal reverb, crisp diction, no melisma, precise pronunciation, 50 60 per minute";

var PREF='mrd_song_pref_v1', DBN='mrd_songs_v1', STORE='songs';
var pref={loop:'inf',rate:1,last:{}};
try{ var p=JSON.parse(localStorage.getItem(PREF)||'{}'); if(p&&typeof p==='object'){ pref.loop=p.loop||'inf'; pref.rate=p.rate||1; pref.last=p.last||{}; } }catch(e){}
function savePref(){ try{ localStorage.setItem(PREF,JSON.stringify(pref)); }catch(e){} }

/* ── IndexedDB ── */
var dbp=null;
function db(){
  if(dbp) return dbp;
  dbp=new Promise(function(res,rej){
    if(!window.indexedDB){ rej(new Error('no idb')); return; }
    var r=indexedDB.open(DBN,1);
    r.onupgradeneeded=function(){ var d=r.result; if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE); };
    r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); };
  });
  return dbp;
}
function idbGet(k){ return db().then(function(d){ return new Promise(function(res,rej){
  var t=d.transaction(STORE,'readonly').objectStore(STORE).get(k);
  t.onsuccess=function(){ res(t.result||null); }; t.onerror=function(){ rej(t.error); }; }); }).catch(function(){ return null; }); }
function idbPut(k,v){ return db().then(function(d){ return new Promise(function(res,rej){
  var t=d.transaction(STORE,'readwrite').objectStore(STORE).put(v,k);
  t.onsuccess=function(){ res(true); }; t.onerror=function(){ rej(t.error); }; }); }).catch(function(){ return false; }); }
function idbDel(k){ return db().then(function(d){ return new Promise(function(res){
  var t=d.transaction(STORE,'readwrite').objectStore(STORE).delete(k); t.onsuccess=function(){ res(true); }; t.onerror=function(){ res(false); }; }); }).catch(function(){ return false; }); }
function idbKeys(){ return db().then(function(d){ return new Promise(function(res){
  var t=d.transaction(STORE,'readonly').objectStore(STORE).getAllKeys(); t.onsuccess=function(){ res(t.result||[]); }; t.onerror=function(){ res([]); }; }); }).catch(function(){ return []; }); }

/* ── 오디오 (절대 DOM 이동하지 않음) ── */
var host=document.createElement('div'); host.id='sk-audio-host'; host.style.display='none';
var audio=document.createElement('audio'); audio.id='sk-audio'; audio.preload='auto';
host.appendChild(audio); document.body.appendChild(host);

var cur=null, curUrl=null, A=null, B=null, playsLeft=null, have={};

function loopN(){ return pref.loop==='inf'?Infinity:parseInt(pref.loop,10)||1; }

var REMOTE='songs/';   /* 저장소에 songs/<곡id>.mp3 를 두면 그쪽을 먼저 쓴다 */
var CDN={"gr-s01": "71090b88-be4c-4f1f-b7ad-ae172e28535f", "gr-s02": "3d58df4c-c18f-469b-bf04-24fe06584f9a", "gr-s03": "fcf23e1f-d32e-4d9e-980f-4472bbe545e9", "gr-s04": "e9c7b5ea-9cd0-4cde-89af-c3ec8f41622e", "gr-s05": "86c9b52c-fced-466e-8a5c-2baae26fc60c", "gr-s06": "dfa00d36-be76-40ec-a0a7-43036e570c7c"};   /* 곡id → Suno clip uuid. 기본 재생원 */
function cdnUrl(id){ return CDN[id] ? 'https://cdn1.suno.ai/'+CDN[id]+'.mp3' : null; }
/* songs/ 는 같은 오리진이라 HEAD 로 있는지 물어볼 수 있다. 없으면 404 → null */
function probeRemote(id){
  var u=REMOTE+id+'.mp3';
  try{
    return fetch(u,{method:'HEAD'}).then(function(r){
      return (r&&r.ok)?{url:u,kind:'remote'}:null;
    }).catch(function(){ return null; });
  }catch(e){ return Promise.resolve(null); }
}
/* 우선순위: 임베드 > IndexedDB(이 기기) > 저장소 songs/ > Suno CDN
   CDN 은 교차 오리진이라 fetch 로 못 물어본다 — audio 에 바로 걸고 error 로 판정한다.
   (media 요소의 교차 오리진 재생에는 CORS 가 필요 없다) */
function srcFor(id){
  var e=window.__SONG_EMBED&&window.__SONG_EMBED[id];
  if(e) return Promise.resolve({url:e,kind:'embed'});
  return idbGet(id).then(function(b){
    if(b) return {url:URL.createObjectURL(b),kind:'idb'};
    return probeRemote(id).then(function(r){
      if(r) return r;
      var u=cdnUrl(id);
      return u ? {url:u,kind:'cdn'} : null;
    });
  });
}

function load(id,auto){
  cur=id; A=null; B=null; playsLeft=loopN();
  paint();
  return srcFor(id).then(function(s){
    if(curUrl){ try{ URL.revokeObjectURL(curUrl); }catch(e){} curUrl=null; }
    if(!s){ have[id]=false; audio.removeAttribute('src'); audio.load(); paint(); return false; }
    have[id]=true;
    if(s.kind==='idb') curUrl=s.url;
    audio.src=s.url; audio.playbackRate=pref.rate; audio.load();
    if(auto){ audio.play().catch(function(){}); }
    try{
      if('mediaSession' in navigator){
        navigator.mediaSession.metadata=new window.MediaMetadata({title:SONGS[id].title,artist:'傷寒·溫病 암기송',album:SONGS[id].tag});
      }
    }catch(e){}
    paint(); return true;
  });
}

audio.addEventListener('timeupdate',function(){
  if(A!=null&&B!=null&&audio.currentTime>=B){ audio.currentTime=A; }
  paintBar();
});
audio.addEventListener('ended',function(){
  if(pref.loop==='inf'){ audio.currentTime=(A!=null?A:0); audio.play().catch(function(){}); return; }
  playsLeft--;
  if(playsLeft>0){ audio.currentTime=(A!=null?A:0); audio.play().catch(function(){}); }
  else { playsLeft=loopN(); paint(); }
});
audio.addEventListener('error',function(){ if(cur){ have[cur]=false; paint(); } });
audio.addEventListener('canplay',function(){ if(cur){ have[cur]=true; paint(); } });
audio.addEventListener('play',paint);
audio.addEventListener('pause',paint);
audio.addEventListener('loadedmetadata',paintBar);

/* ── UI ── */
var ui=document.createElement('div'); ui.className='skwrap'; ui.id='sk-ui';
ui.innerHTML=''
+'<div class="sk-head"><span class="sk-eyebrow">🎵 암기송</span><span class="sk-title" id="sk-title">—</span></div>'
+'<div class="sk-chips" id="sk-chips"></div>'
+'<div class="sk-bar" id="sk-bar"><span class="sk-ab" id="sk-abband"></span><span class="sk-fill" id="sk-fill"></span><span class="sk-mk" id="sk-mka"></span><span class="sk-mk b" id="sk-mkb"></span></div>'
+'<div class="sk-time"><span id="sk-now">0:00</span><span id="sk-dur">0:00</span></div>'
+'<div class="sk-row">'
+'<button class="sk-btn sk-play" id="sk-play">▶ 재생</button>'
+'<span class="sk-seg" id="sk-loopseg"></span>'
+'<span class="sk-seg" id="sk-rateseg"></span>'
+'</div>'
+'<div class="sk-row">'
+'<button class="sk-btn" id="sk-a">A 지정</button>'
+'<button class="sk-btn" id="sk-b">B 지정</button>'
+'<button class="sk-btn" id="sk-clr">해제</button>'
+'<button class="sk-btn" id="sk-lyr">가사</button>'
+'<button class="sk-btn" id="sk-suno">Suno</button>'
+'<button class="sk-btn" id="sk-add">곡 넣기</button>'
+'</div>'
+'<p class="sk-note" id="sk-note"></p>'
+'<input type="file" id="sk-file" accept="audio/*" style="display:none">';

var park=document.createElement('div'); park.id='sk-park'; park.style.display='none';
document.body.appendChild(park); park.appendChild(ui);

var modal=document.createElement('div'); modal.className='sk-modal'; modal.id='sk-modal';
modal.innerHTML='<div class="sk-sheet"><div class="sk-sheet-h"><b id="sk-mt">가사</b><button class="sk-btn" id="sk-copy">복사</button><button class="sk-btn" id="sk-close">닫기</button></div><pre id="sk-mb"></pre></div>';
document.body.appendChild(modal);

function $(i){ return document.getElementById(i); }
function fmt(t){ if(!isFinite(t)||t<0)t=0; var m=Math.floor(t/60),s=Math.floor(t%60); return m+':'+(s<10?'0':'')+s; }

function paintBar(){
  var d=audio.duration||0, c=audio.currentTime||0;
  $('sk-fill').style.width=(d?(c/d*100):0)+'%';
  $('sk-now').textContent=fmt(c); $('sk-dur').textContent=fmt(d);
  var mka=$('sk-mka'), mkb=$('sk-mkb'), band=$('sk-abband');
  if(d&&A!=null){ mka.style.display='block'; mka.style.left=(A/d*100)+'%'; } else mka.style.display='none';
  if(d&&B!=null){ mkb.style.display='block'; mkb.style.left=(B/d*100)+'%'; } else mkb.style.display='none';
  if(d&&A!=null&&B!=null){ band.style.display='block'; band.style.left=(A/d*100)+'%'; band.style.width=((B-A)/d*100)+'%'; } else band.style.display='none';
}
function seg(hostId,vals,get,set){
  var h=$(hostId); h.innerHTML='';
  vals.forEach(function(v){
    var b=document.createElement('button'); b.className='sk-tab'+(String(get())===String(v[0])?' on':'');
    b.textContent=v[1]; b.onclick=function(){ set(v[0]); paint(); savePref(); };
    h.appendChild(b);
  });
}
function paint(){
  if(!cur) return;
  var s=SONGS[cur];
  $('sk-title').textContent=s.title;
  $('sk-play').textContent=audio.paused?'▶ 재생':'❚❚ 정지';
  seg('sk-loopseg',[['1','1'],['3','3'],['5','5'],['inf','∞']],function(){return pref.loop;},function(v){ pref.loop=v; playsLeft=loopN(); });
  seg('sk-rateseg',[[0.75,'0.75×'],[1,'1×'],[1.25,'1.25×'],[1.5,'1.5×']],function(){return pref.rate;},function(v){ pref.rate=v; audio.playbackRate=v; });
  var n=$('sk-note');
  if(have[cur]===false){ n.textContent='음원을 불러오지 못했습니다 — 네트워크를 확인하시거나, mp3를 받아 「곡 넣기」로 이 기기에 넣으면 오프라인에서도 재생됩니다.'; n.style.display='block'; }
  else n.style.display='none';
  paintBar();
}
function paintChips(ids){
  var h=$('sk-chips'); h.innerHTML='';
  if(ids.length<2){ h.style.display='none'; return; }
  h.style.display='flex';
  ids.forEach(function(id){
    var b=document.createElement('button'); b.className='sk-chip'+(id===cur?' on':'');
    b.textContent=SONGS[id].tag; b.title=SONGS[id].title;
    b.onclick=function(){ load(id,!audio.paused).then(function(){ paintChips(ids); }); };
    h.appendChild(b);
  });
}

function wire(){
  $('sk-play').onclick=function(){ if(audio.paused){ if(!audio.src){ return; } audio.play().catch(function(){}); } else audio.pause(); };
  $('sk-a').onclick=function(){ A=audio.currentTime; if(B!=null&&B<=A) B=null; paintBar(); };
  $('sk-b').onclick=function(){ var t=audio.currentTime; if(A!=null&&t>A){ B=t; } paintBar(); };
  $('sk-clr').onclick=function(){ A=null; B=null; paintBar(); };
  $('sk-bar').onclick=function(e){ var r=this.getBoundingClientRect(), d=audio.duration||0; if(d) audio.currentTime=(e.clientX-r.left)/r.width*d; };
  $('sk-lyr').onclick=function(){ openModal('가사 · '+SONGS[cur].title, SONGS[cur].lyrics); };
  $('sk-suno').onclick=function(){ openModal('Suno 스타일 · '+SONGS[cur].title, STYLE+'\n\n'+SONGS[cur].lyrics); };
  $('sk-add').onclick=function(){ $('sk-file').click(); };
  $('sk-file').onchange=function(){
    var f=this.files&&this.files[0]; if(!f) return;
    idbPut(cur,f).then(function(ok){ this.value=''; if(ok) load(cur,true); }.bind(this));
  };
  $('sk-close').onclick=function(){ modal.classList.remove('on'); };
  modal.onclick=function(e){ if(e.target===modal) modal.classList.remove('on'); };
  $('sk-copy').onclick=function(){
    var t=$('sk-mb').textContent;
    try{ navigator.clipboard.writeText(t); }catch(e){}
    var b=$('sk-copy'), o=b.textContent; b.textContent='복사됨'; setTimeout(function(){ b.textContent=o; },1200);
  };
}
function openModal(t,b){ $('sk-mt').textContent=t; $('sk-mb').textContent=b; modal.classList.add('on'); }

/* ── 뷰 부착 ──
   이 앱은 탭을 바꿀 때 #mount 를 통째로 비우고 tpl-<id> 를 다시 심는다.
   그래서 킷 UI 는 park 에 보관했다가 활성 탭이 담당 탭일 때만 #mount 안으로 옮긴다.
   화면 전환은 window.__activate 를 감싸서 잡는다(그 함수가 async 라 then 으로 이어붙인다). */
function anchorIn(root){
  /* .cats(분류 칩) 바로 뒤 — 없으면 .bar 앞, 그것도 없으면 맨 앞 */
  return root.querySelector('.cats') || root.querySelector('.bar') || null;
}
function attach(vid){
  var ids = vid ? MAP[vid] : null;
  if(!ids||!ids.length){ park.appendChild(ui); return; }
  var mount=document.getElementById('mount'); if(!mount) return;
  var wrap=mount.querySelector('.wrap')||mount;
  var a=anchorIn(wrap);
  if(a){ if(a.nextSibling!==ui) wrap.insertBefore(ui,a.nextSibling); }
  else if(ui.parentNode!==wrap||wrap.firstChild!==ui) wrap.insertBefore(ui,wrap.firstChild);
  var want=(pref.last[vid]&&ids.indexOf(pref.last[vid])>=0)?pref.last[vid]:ids[0];
  paintChips(ids);
  if(cur!==want){ load(want,false).then(function(){ paintChips(ids); }); }
  else { paint(); }
  pref.last[vid]=want; savePref();
}
var lastAttached=null;
function sync(){
  var vid=window.__active||null;
  /* 탭이 같아도 #mount 가 새로 그려졌으면 다시 붙여야 한다 */
  if(vid===lastAttached && ui.isConnected && (!MAP[vid] || ui.closest('#mount'))) return;
  lastAttached=vid;
  attach(vid);
}
document.addEventListener('DOMContentLoaded',boot);
if(document.readyState!=='loading') boot();
var booted=false;
function boot(){
  if(booted) return; booted=true;
  wire();
  var tries=0;
  (function hook(){
    if(typeof window.__activate==='function' && !window.__activate.__sk){
      var orig=window.__activate;
      var wrapped=function(id){
        var r=orig.apply(this,arguments);
        if(r&&typeof r.then==='function') r.then(function(){ lastAttached=null; sync(); },function(){});
        else { lastAttached=null; setTimeout(sync,0); }
        return r;
      };
      wrapped.__sk=true; window.__activate=wrapped;
    } else if(tries++<80) return void setTimeout(hook,100);
  })();
  idbKeys().then(function(ks){ ks.forEach(function(k){ have[k]=true; }); sync(); });
  setInterval(sync,1200);   /* 탭 복원·뒤로가기 등 놓친 전환 대비 */
}
window.SongKit={songs:SONGS,map:MAP,style:STYLE,load:load,attach:attach,audio:audio};
})();
